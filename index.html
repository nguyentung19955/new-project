<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#14110D">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Thần Thoại Việt">
  <script>
    // claude/ve-lai-pixel: gắn lớp pixel TRƯỚC khi nạp CSS (cùng điều kiện PX_ON trong js/pixel.js) → CSS chỉ tải ảnh của đúng chế độ
    (function () { var on = true; try { var q = location.search, m = localStorage.getItem('ttv.pixel');
      on = /[?&]pixel=1\b/.test(q) || window.PIXEL_BAT_EP === true || (!/[?&]pixel=0\b/.test(q) && window.PIXEL_BAT_EP !== false && m !== '0'); } catch (e) { /* chặn lưu */ }
      if (on) document.documentElement.classList.add('pixel'); })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Thần Thoại Việt</title>
  <meta name="description" content="Thần Thoại Việt — game thủ thành truyền thuyết Văn Lang – Âu Lạc: Sơn Tinh – Thủy Tinh, Thánh Gióng, Thạch Sanh, Lạc Long Quân, An Dương Vương.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700;800&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=260">
</head>
<body>
<!--BODY-->
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="ui">
      <!-- ===== Màn chơi ===== -->
      <div id="topbar" class="metal ingame">
        <div class="tb-center">
          <span id="tb-wave">Đợt 0 / 30</span>
          <div class="tb-prog inset"><i id="tb-fill"></i><span id="tb-boss"></span></div>
        </div>
        <div class="tb-res inset">
          <span id="tb-gold"><i class="coin"></i><b>0</b></span>
          <span id="tb-lives"><svg viewBox="0 0 16 16"><path d="M8 14 C2 9 1 6 3 3.5 C5 1.5 7 2.5 8 4.5 C9 2.5 11 1.5 13 3.5 C15 6 14 9 8 14Z" fill="#E25A3A"/></svg><b>20</b></span>
          <span id="tb-kho" title="Ngân khố (giữ sau trận — mở tướng, Lò đúc)"><i class="bac sm"></i><b>0</b></span>
          <span id="tb-water" hidden><b></b><i id="tb-flood"></i></span>
          <span id="tb-team" role="button" tabindex="0" aria-label="Thế trận" title="Thế trận: đội đông và nhiều hành được cộng sát thương"><svg viewBox="0 0 16 16"><path d="M2 2 L10 10 M14 2 L6 10" stroke="#FFD66B" stroke-width="2" stroke-linecap="round"/><path d="M8.5 11.5 L11.5 8.5 M7.5 11.5 L4.5 8.5" stroke="#C8A050" stroke-width="2" stroke-linecap="round"/><circle cx="12.5" cy="12.5" r="1.6" fill="#C8A050"/><circle cx="3.5" cy="12.5" r="1.6" fill="#C8A050"/></svg><b>+0%</b></span>
        </div>
        <button id="btn-hideui" class="sq metal" aria-label="Ẩn giao diện" title="Ẩn giao diện (phím H)"><svg viewBox="0 0 20 20"><path d="M2 10 Q10 2.5 18 10 Q10 17.5 2 10 Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.6" fill="currentColor"/><path d="M3.5 3.5 L16.5 16.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        <button id="btn-detail" class="sq metal" aria-label="Hiện / ẩn chỉ số" title="Hiện / ẩn chỉ số">👁</button>
        <button id="btn-speed" class="sq metal" aria-label="Tốc độ">x1</button>
        <button id="btn-run" class="sq metal go" aria-label="Bắt đầu"><svg viewBox="0 0 20 20"><path id="run-icon" d="M6 4 L16 10 L6 16 Z" fill="currentColor"/></svg></button>
        <button id="btn-chat" class="sq metal" hidden aria-label="Trò chuyện" title="Trò chuyện với đồng đội">💬<i class="dot" id="chat-dot" hidden></i></button>
        <button id="btn-menu" class="sq metal" aria-label="Menu"><svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><i class="dot" id="menu-dot" hidden></i></button>
      </div>

      <div id="coop-bar" class="metal" hidden></div>
      <div id="chat" class="metal" hidden></div>
      <div id="chat-bubbles" class="passthru"></div>
      <button id="nextwaves" class="ingame" hidden></button>
      <div id="fuse-strip" class="ingame"></div>
      <div id="trash" hidden></div>
      <div id="auto-btns" class="ingame">
        <button class="ab metal" data-act="open-bag" aria-label="Túi đồ"><span class="i">🎒</span><span class="l">Túi đồ</span><i class="dot" hidden></i></button>
        <button class="ab metal" data-act="auto-up-gear" aria-label="Nâng đồ tự động"><span class="i">⬆</span><span class="l">Nâng đồ</span><i class="dot" hidden></i></button>
        <button class="ab metal" data-act="auto-eq-all" aria-label="Mặc đồ cả đội"><span class="i">🛡</span><span class="l">Mặc đồ</span><i class="dot" hidden></i></button>
      </div>
      <div id="hero-stats" class="metal" hidden></div>
      <div id="bossbar" hidden><div class="bn"><span id="bb-name"></span><span id="bb-tag"></span></div><div class="tr"><i id="bb-fill"></i></div><div id="bb-hp"></div><div id="bb-info"></div></div>
      <div id="banner" hidden><small id="banner-sub">Boss xuất hiện</small><b id="banner-text"></b></div>
      <div id="paused-tag" hidden>Đã dừng</div>

      <!-- menu ≡: các màn phụ gom vào đây cho màn chơi gọn -->
      <div id="drawer" class="metal" hidden>
        <button class="dw-btn" data-act="dw" data-k="bag"><span class="ic">🎒</span>Túi đồ<small id="dw-bag"></small></button>
        <button class="dw-btn" data-act="dw" data-k="heroes"><span class="ic">👑</span>Anh Hùng</button>
        <button class="dw-btn" data-act="dw" data-k="runes"><span class="ic">🔯</span>Ấn Phù</button>
        <button class="dw-btn" data-act="dw" data-k="codex"><span class="ic">📖</span>Bách khoa</button>
        <button class="dw-btn" data-act="dw" data-k="pause"><span class="ic">⏸</span>Tạm dừng & cài đặt</button>
        <button class="dw-btn" data-act="dw" data-k="feedback"><span class="ic">✉</span>Góp ý</button>
        <button class="dw-btn quit" data-act="quit-run"><span class="ic">🏳</span><span id="quit-label">Rời trận</span></button>
      </div>

      <div id="legends" class="metal" role="dialog" aria-label="Hợp thể" hidden></div>
      <div id="more" class="metal" hidden></div>

      <div id="deck-hint" hidden></div>
      <div id="deck" class="metal ingame"></div>
      <button id="btn-moc" hidden aria-label="Mọc Núi"></button>

      <div id="coach" hidden></div>
      <div id="roster-hint" class="metal" hidden></div>
      <div id="toasts" class="passthru"></div>
      <button id="btn-showui" hidden aria-label="Hiện giao diện" title="Hiện giao diện (phím H)"><svg viewBox="0 0 20 20"><path d="M2 10 Q10 2.5 18 10 Q10 17.5 2 10 Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.6" fill="currentColor"/></svg></button>

      <!-- ===== Màn hình mở trong trận (không dừng game) ===== -->
      <div id="screen" class="screen" hidden></div>

      <!-- ===== Lớp phủ ===== -->
      <div id="menu" class="overlay">
        <div class="bgart" id="menu-art"></div>
        <div class="title"><h1 id="menu-logo"><span class="logo-txt">Thần Thoại Việt</span></h1><div class="orn"></div><p class="sub">Truyền thuyết Văn Lang – Âu Lạc</p><p>“Con Rồng cháu Tiên, giữ vững non sông”</p></div>
        <div class="mc-foot">Văn Lang – Âu Lạc • Đông Sơn Fantasy</div>
        <div class="pl-box metal" id="menu-player"></div>
        <div class="pl-pop metal" id="pl-pop" hidden></div>
        <div class="pl-res" id="menu-res"></div>
        <nav class="mc-nav metal" aria-label="Menu chính">
          <span class="rv" style="left:-5px;top:-5px"></span><span class="rv" style="right:-5px;top:-5px"></span><span class="rv" style="left:-5px;bottom:-5px"></span><span class="rv" style="right:-5px;bottom:-5px"></span>
          <div class="orn2"></div>
          <button id="btn-continue" class="mc-btn main"><svg viewBox="0 0 20 20"><path d="M3 17 L13 7 M10 4 L16 10 M13 7 L17 3 M4 4 L9 9 M11 11 L17 17 M3 17 L6 14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span id="continue-label">Xuất Quân</span></button>
          <button id="btn-newgame" class="mc-btn metal" hidden><svg viewBox="0 0 20 20"><path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Chơi mới</button>
          <div class="mc-row"><button id="btn-heroes" class="mc-btn metal"><svg viewBox="0 0 20 20"><circle cx="7" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="14" cy="7.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M1.5 17 Q7 10 12.5 17 M12 12 Q16 10 18.5 15" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>Anh Hùng</button><button id="btn-runes" class="mc-btn metal"><span class="mc-ic">🔯</span>Ấn Phù</button></div>
          <button id="btn-treasury" class="mc-btn metal"><svg viewBox="0 0 20 20"><path d="M4 7 H16 L15 17 H5 Z M7 7 V5 A3 3 0 0 1 13 5 V7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Kho Báu &amp; Sính Lễ</button>
          <button id="btn-settings" class="mc-btn metal"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 2v3M10 15v3M2 10h3M15 10h3M4.3 4.3l2.1 2.1M13.6 13.6l2.1 2.1M4.3 15.7l2.1-2.1M13.6 6.4l2.1-2.1" stroke="currentColor" stroke-width="1.8"/></svg>Cài Đặt</button>
          <div class="mc-subs"><button id="btn-menu-codex" class="mc-sub">📖 Bách khoa</button><button id="btn-ranks" class="mc-sub">🏆 Xếp hạng</button><button id="btn-feedback" class="mc-sub">✉ Góp ý</button></div>
        </nav>
        <div class="ver">Phiên bản 260</div>
      </div>

      <div id="campaign" class="overlay" hidden></div>
      <div id="modes" class="overlay" hidden></div>
      <div id="coop" class="overlay" hidden></div>
      <div id="settings" class="overlay" hidden></div>
      <div id="roster" class="overlay" hidden></div>
      <div id="runes" class="overlay" hidden></div>
      <div id="treasury" class="overlay" hidden></div>
      <div id="prep" class="overlay prep-ov" hidden></div>
      <div id="login" class="overlay" hidden></div>
      <div id="ranks" class="overlay" hidden></div>
      <div id="dialogue" hidden></div>
      <div id="result" class="overlay" hidden></div>
      <div id="reward" class="overlay" hidden></div>
      <div id="feedback" class="overlay" hidden></div>
      <div id="fbadmin" class="overlay" hidden></div>

      <div id="loading">Đang tải…</div>
      <div id="err" hidden></div>
    </div>
    <div id="rotate" hidden>
      <span class="svgi" id="rotate-art"></span>
      <b>Xoay ngang điện thoại để chơi</b>
      <span>Thần Thoại Việt được thiết kế cho màn hình ngang</span>
    </div>
  </div>
<!--/BODY-->
  <script>
    // Hiện lỗi ngay trên màn hình để dễ báo lỗi khi chơi trên điện thoại
    window.addEventListener('error', function (e) {
      var el = document.getElementById('err');
      if (!el) return;
      el.hidden = false;
      el.textContent = 'Lỗi: ' + (e.message || e.error) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
    });
  </script>

  <script src="js/pixel/an-phu.js?v=260"></script>

  <script src="js/coop.js?v=260"></script>

</body>

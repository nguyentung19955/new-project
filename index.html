<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1b2a1d">
  <title>Thủ Thành Anh Hùng</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="stat">❤️ <span id="lives"></span></div>
      <div class="stat">💰 <span id="gold"></span></div>
      <div class="stat">🌊 <span id="wave"></span></div>
      <div class="spacer"></div>
      <button id="btn-speed">x1</button>
      <button id="btn-pause">⏸</button>
    </div>

    <div id="controls">
      <button id="btn-bag">🎒 <span id="bag-count"></span></button>
      <button id="btn-chest">🎁 Rương</button>
      <button id="btn-wave" class="primary">▶ Đợt 1</button>
    </div>

    <div id="toasts"></div>

    <div id="sheet" class="hidden">
      <div class="sheet-inner"><div id="sheet-body"></div></div>
    </div>

    <div id="overlay" class="hidden">
      <div class="panel">
        <h2>Thành đã thất thủ!</h2>
        <p>Bạn trụ được tới đợt <b id="final-wave"></b></p>
        <button id="btn-restart" class="primary">Chơi lại</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#130E19">
<title>The Last Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="giao-dien-chung.css" data-kd="1">
<style>
/* MÀN TIÊU ĐỀ (phiên "Khởi đầu – đợt 1") theo docs/khoi-dau/tu-van-chatgpt.txt mục 3: khung logic 844×390, toạ độ theo tư vấn,
   cộng thêm vùng an toàn env(safe-area-inset-*). Nền / logo / nút / bảng = ảnh ChatGPT (art/khoi-dau/), chữ do game viết. */
html,body{height:100%;margin:0;background:#130E19;color:#F3E6C8;overflow:hidden;font-family:"Alegreya Sans",system-ui,sans-serif;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#nen{position:fixed;inset:0;background:#130E19 url(../art/khoi-dau/tieu-de-nen.png) left center/cover no-repeat;image-rendering:pixelated}
/* sân khấu 844×390 phóng theo màn (k = min(rộng/844, cao/390)), canh giữa */
#san{position:fixed;left:50%;top:50%;width:844px;height:390px;transform:translate(-50%,-50%) scale(var(--k,1));transform-origin:50% 50%}
#logo{position:absolute;left:calc(74px + var(--sl,0px));top:50px;width:370px;height:102px;image-rendering:pixelated}
#logo-chu{position:absolute;left:calc(74px + var(--sl,0px));top:56px;width:370px;margin:0;text-align:center;
  font:700 54px/1 "Cormorant Garamond",Georgia,serif;color:#E1B85A;letter-spacing:2px;text-shadow:0 2px 6px #000}
#cot{position:absolute;right:calc(66px + var(--sr,0px));top:122px;width:242px}
#cot .kd-nut{width:242px;position:absolute;left:0}
#b-tiep{top:0}
#b-moi{top:66px}
#b-tc{top:122px;width:116px!important}
#b-tk{top:122px;left:126px!important;width:116px!important}
#tt{position:absolute;top:172px;left:0;width:242px;margin:0;font:600 15px/1.3 "Alegreya Sans",sans-serif;color:#F3E6C8;text-align:center;text-shadow:0 1px 3px #000,0 0 8px #000}
#tt b{color:#ffe08a;font-weight:700}
#b-xd{position:absolute;top:-56px;left:21px;width:200px!important;font-size:16px}
/* chưa có bản lưu: chỉ NEW GAME (y = 144), Options + Account bên dưới */
body.trong #b-tiep,body.trong #tt,body.trong #b-xd{display:none}
body.trong #b-moi{top:22px;height:54px;border-width:0 42px;border-image:url(../art/khoi-dau/nut-chinh-thuong.png) 0 90 fill / 0 42px stretch;font-size:20px;color:#ffe08a}
body.trong #b-moi:active{border-image-source:url(../art/khoi-dau/nut-chinh-nhan.png)}
body.trong #b-tc,body.trong #b-tk{top:88px}
#ban{position:absolute;left:calc(54px + var(--sl,0px));top:351px;width:300px;font:500 12px "Alegreya Sans",sans-serif;color:#b9a98f;opacity:.75;text-shadow:0 1px 2px #000}
#debug{position:absolute;left:calc(54px + var(--sl,0px));top:300px;display:none;gap:8px}
body.debug #debug{display:flex}
#debug a{color:#E1B85A;font-size:13px}
#cho{position:fixed;inset:0;display:grid;place-items:center;background:#130E19;z-index:70;font:600 18px "Alegreya Sans",sans-serif;color:#b9a98f}
#cho.an{display:none}
</style>
</head>
<body class="trong">
<div id="nen"></div>
<div id="san">
  <img id="logo" alt="The Last Echo" src="../art/khoi-dau/logo.png" hidden>
  <h1 id="logo-chu" hidden>The Last Echo</h1>
  <div id="cot">
    <button id="b-tiep" class="kd-nut chinh" type="button">Continue</button>
    <button id="b-moi" class="kd-nut phu" type="button">New Game</button>
    <button id="b-tc" class="kd-nut phu" type="button">Options</button>
    <button id="b-tk" class="kd-nut phu" type="button">Account</button>
    <p id="tt"></p>
    <button id="b-xd" class="kd-nut phu" type="button" hidden>Two saves found — Review</button>
  </div>
  <div id="debug"><a href="phong-demo/">Demo Room</a><a href="vung-1/index.html?debug=1">Region 1 (debug)</a><a href="vung-2/index.html?debug=1">Region 2 (debug)</a></div>
  <div id="ban">Early build</div>
</div>
<div id="cho">Loading…</div>
<div id="kd-xoay" class="ui"><div><h1>Rotate to Play</h1>For the best experience, rotate your phone.<br><br><button class="kd-nut phu" type="button" id="b-xoay-bo">Play anyway</button></div></div>
<script src="firebase/cau-hinh.js"></script>
<script src="luu-may.js"></script>
<script src="dang-nhap.js"></script>
<script src="luu-chung.js"></script>
<script src="hanh-trinh.js"></script>
<script src="giao-dien-chung.js"></script>
<script>
'use strict';
(function(){
  const $ = id => document.getElementById(id), KD = window.KhoiDau, H = window.HanhTrinh, Q = new URLSearchParams(location.search);
  if (Q.get('debug') === '1') document.body.classList.add('debug');   // Demo Room + trang vùng chỉ qua ?debug=1
  // logo ChatGPT (A02); chưa có thì viết chữ bằng phông như menu vùng cũ
  const lg = $('logo'); lg.onload = () => { lg.hidden = false; $('logo-chu').hidden = true; }; lg.onerror = () => { lg.hidden = true; $('logo-chu').hidden = false; };
  if (lg.complete && lg.naturalWidth) lg.onload();
  // sân khấu 844×390 + vùng an toàn thật (đo env() qua phần tử ẩn)
  const DO = document.createElement('div'); DO.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
  document.body.appendChild(DO);
  function vua(){
    const c = getComputedStyle(DO), sl = parseFloat(c.paddingLeft) || 0, sr = parseFloat(c.paddingRight) || 0;
    const k = Math.max(0.5, Math.min(innerWidth / 844, innerHeight / 390)), st = $('san').style;
    st.setProperty('--k', k); st.setProperty('--sl', (sl / k) + 'px'); st.setProperty('--sr', (sr / k) + 'px');
  }
  addEventListener('resize', vua); vua();
  $('b-xoay-bo').onclick = () => $('kd-xoay').classList.add('bo');

  // âm thanh: chưa có tiếng nào – lần chạm đầu chỉ "mở khoá" (không tự phát nhạc trước khi chạm)
  addEventListener('pointerdown', () => { window.TIEU_DE_DA_CHAM = true; }, {once:true});

  let coLuu = false;
  function veTrangThai(){
    coLuu = H.coLuu(localStorage);
    document.body.classList.toggle('trong', !coLuu);
    $('b-moi').className = 'kd-nut phu' + (coLuu ? '' : ' chinh');
    if (coLuu){
      const s = H.tomTat(k => localStorage.getItem(k)), tuoi = H.chuTuoi(s.t);
      $('tt').innerHTML = '<b>' + H.chuNoi(s) + '</b>' + (tuoi ? '<br>Saved ' + tuoi : '');
    }
    const may = KD.trangThaiMay();
    $('b-xd').hidden = may.loai !== 'xung-dot';
    $('b-tk').textContent = 'Account';
  }
  function tiepTuc(){
    const di = () => { const n = H.noiTiep(localStorage); KD.diToi(n.trang); };
    if (KD.trangThaiMay().loai === 'xung-dot') return KD.xungDot.mo({sauChon:di, sauDong:di});   // chọn bản trước khi vào (không chặn: "Not now" vẫn vào)
    di();
  }
  function choiMoi(){
    const vao = () => {
      if (!H.moi(localStorage)){ KD.hop({tieu:'Could not start', chu:'The browser blocked storage, so your old journey could not be backed up. Nothing was deleted.', nut:[{chu:'OK', thoat:true}]}); return; }
      try { if (window.LuuChung) LuuChung.napLai(); } catch (e){}
      if (window.LuuMay && LuuMay.daGhi) LuuMay.daGhi();
      KD.diToi('lang-chuong/index.html?moi=1');
    };
    if (!coLuu) return vao();
    KD.hop({tieu:'Start a new journey?', chu:'Your current journey will be replaced on this device.<br><span class="kd-ghi">A backup copy is kept on this device.</span>',
      nut:[{chu:'Cancel', thoat:true, id:'b-hop-huy'}, {chu:'Start New', chinh:true, id:'b-hop-moi', bam:vao}]});
  }
  $('b-tiep').onclick = tiepTuc;
  $('b-moi').onclick = choiMoi;
  $('b-tc').onclick = () => KD.tuyChon.mo();
  $('b-tk').onclick = () => KD.taiKhoan.mo(veTrangThai);
  $('b-xd').onclick = () => KD.xungDot.mo({sauChon:veTrangThai, sauDong:veTrangThai});
  addEventListener('keydown', e => { if ((e.code === 'Enter' || e.code === 'Space') && !KD.dangMo() && document.activeElement === document.body){ e.preventDefault(); (coLuu ? tiepTuc : choiMoi)(); } });

  window.TIEU_DE = {xong:false, veTrangThai, coLuu:() => coLuu};
  (async () => {
    // lấy bản lưu mây trước (tối đa 2,5 s) để CONTINUE đúng chỗ; không có mạng vẫn mở được
    if (window.LuuMay && LuuMay.coMay()){ try { await LuuMay.cho(2500); if (window.LuuChung) LuuChung.napLai(); } catch (e){} LuuMay.nghe(veTrangThai); }
    veTrangThai();
    $('cho').classList.add('an');
    TIEU_DE.xong = true;
  })();
})();
</script>
</body>
</html>

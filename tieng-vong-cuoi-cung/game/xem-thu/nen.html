<title>Demo – Xem nền Làng Chuông</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Bố cục: một khung game 480×270 ở giữa, chú thích gọn bên dưới. Một giao diện tối cố định như trong game. */
:root{
  --bg:#14110e; --panel:#1f1a15; --line:#3a3028; --fg:#e8dcc6; --muted:#a8977e; --gold:#e1b85a;
  --f-ui:"Be Vietnam Pro",system-ui,sans-serif; --f-num:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
main{max-width:980px;margin:0 auto;display:grid;gap:14px}
h1{font-size:1.15rem;margin:0;font-weight:600;text-wrap:balance}
h1 small{display:block;color:var(--muted);font-weight:400;font-size:.8rem;margin-top:4px}
#khung{display:flex;justify-content:center;background:#000;border:1px solid var(--line);padding:0;overflow:hidden;touch-action:pan-y;cursor:grab;max-width:100%}
#khung:active{cursor:grabbing}
canvas{image-rendering:pixelated;display:block}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:.85rem;color:var(--muted)}
.bar label{display:flex;gap:6px;align-items:center}
input[type=range]{width:min(320px,70vw);accent-color:var(--gold)}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:4px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--fg)}
p.note{margin:0;font-size:.82rem;color:var(--muted);max-width:65ch;line-height:1.5}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=JetBrains+Mono&display=swap">
<main>
  <h1>Làng Chuông – xem thử nền parallax<small>Kéo hoặc vuốt ngang trên khung để di chuyển camera</small></h1>
  <div id="khung"><canvas id="c" width="480" height="270" aria-label="Nền Làng Chuông với nhân vật thử"></canvas></div>
  <div class="bar">
    <label for="cam">Camera <input id="cam" type="range" min="-69" max="69" step="1" value="0"></label>
    <span>x = <span class="num" id="camv">0</span> px</span>
    <button id="tu" type="button">Tự lia</button>
    <label><input id="nv" type="checkbox" checked> Nhân vật thử</label>
    <span>Phóng <span class="num" id="zoom">1×</span></span>
  </div>
  <p class="note">Ba lớp: xa (tốc độ 0,2), giữa (0,5), gần (1,15). Khối nhân vật đứng trên lối đi dưới của lớp giữa. Trên màn hình hẹp hơn 480 px, khung thu nhỏ cho vừa; xoay ngang điện thoại để thấy đúng 1×.</p>
</main>
<script>
const W=480,H=270, c=document.getElementById('c'), ctx=c.getContext('2d');
ctx.imageSmoothingEnabled=false;
const BASES=['../../art/nen/lang-chuong/game/','nen-lang-chuong/'];
function load(name){return new Promise(res=>{let i=0;const im=new Image();im.onload=()=>res(im);im.onerror=()=>{i++;if(i<BASES.length)im.src=BASES[i]+name;else res(null)};im.src=BASES[0]+name;});}
const L=[{f:'xa.png',s:0.2},{f:'giua.png',s:0.5},{f:'gan.png',s:1.15}];
let cam=0, auto=false, t0=0, showNv=true;
const camEl=document.getElementById('cam'), camV=document.getElementById('camv');
function setCam(v){cam=Math.max(-69,Math.min(69,v));camEl.value=Math.round(cam);camV.textContent=Math.round(cam);}
function draw(){
  ctx.fillStyle='#14161b';ctx.fillRect(0,0,W,H);
  for(let k=0;k<3;k++){const l=L[k];if(!l.im)continue;
    const x=Math.round((W-l.im.width)/2-cam*l.s), y=Math.round((H-l.im.height)/2);
    ctx.drawImage(l.im,x,y);
    if(k===1&&showNv){ // nhân vật thử, đi theo lớp giữa (lối đi)
      const px=x+310, foot=y+286, w=10, h=20;
      ctx.fillStyle='#32804F';ctx.fillRect(px-1,foot-h-1,w+2,h+1);
      ctx.fillStyle='#212835';ctx.fillRect(px,foot-h,w,h);
      ctx.fillStyle='#E1B85A';ctx.fillRect(px+6,foot-h+5,2,2);
    }
  }
}
function fit(){const w=document.getElementById('khung').clientWidth;let z=w>=W?Math.floor(w/W):w/W;z=Math.min(z,4);
  c.style.width=W*z+'px';c.style.height=H*z+'px';document.getElementById('zoom').textContent=(z>=1?z:z.toFixed(2))+'×';}
let drag=null;
const k=document.getElementById('khung');
k.addEventListener('pointerdown',e=>{drag={x:e.clientX,c:cam};auto=false;k.setPointerCapture(e.pointerId);});
k.addEventListener('pointermove',e=>{if(!drag)return;const z=c.clientWidth/W;setCam(drag.c-(e.clientX-drag.x)/z);draw();});
['pointerup','pointercancel'].forEach(n=>k.addEventListener(n,()=>drag=null));
camEl.addEventListener('input',()=>{auto=false;setCam(+camEl.value);draw();});
document.getElementById('nv').addEventListener('change',e=>{showNv=e.target.checked;draw();});
document.getElementById('tu').addEventListener('click',()=>{auto=!auto;t0=performance.now()-Math.asin(cam/69)*1500;if(auto)requestAnimationFrame(loop);});
function loop(t){if(!auto)return;setCam(69*Math.sin((t-t0)/1500));draw();requestAnimationFrame(loop);}
window.addEventListener('resize',fit);
Promise.all(L.map(l=>load(l.f).then(im=>l.im=im))).then(()=>{fit();draw();
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){auto=true;t0=performance.now();requestAnimationFrame(loop);}});
fit();
</script>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Thử Cầu Sóng Âm</title>
<style>
:root{--bg:#0d0f16;--fg:#dfe6ff;--btn:#1f2638}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 16px;touch-action:manipulation}
canvas{width:100%;max-width:960px;image-rendering:pixelated;background:linear-gradient(#1a2033,#0f1320);border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button,select{background:var(--btn);color:var(--fg);border:1px solid #39425c;border-radius:10px;padding:14px 20px;font-size:18px;user-select:none}
</style></head><body>
<canvas id="c" width="480" height="270"></canvas>
<div class="row"><button id="bl">◀</button><button id="br">▶</button><button id="ba">Đánh</button></div>
<div class="row"><select id="sel"><option value="">— Xem riêng động tác —</option></select></div>
<div style="opacity:.7">PC: ←→ chạy · J/Z đánh · bấm tiếp đúng lúc ra đòn để nối 1 → 2 → 3, không bấm thì nhân vật thu thế</div>
<script>
const META=__META__;const img=new Image();img.src='data:image/png;base64,__PNG__';const fxi=new Image();fxi.src='data:image/png;base64,__FX__';const FXROW={don1:0,don2:1,don3:2};
const c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const MS={dung:120,chay:90,don1:70,don2:75,don3:80};const CANCEL={don1:3,don2:4,don3:99};const GROUND=238,FAR=196,SC=2;
let st={x:240,face:1,anim:'dung',f:0,t:0,atk:0,q:false,preview:''};
const keys={};
function set(a){if(st.anim!==a){st.anim=a;st.f=0;st.t=0}}
function attack(){if(st.preview)return;if(st.atk){st.q=true;return}st.atk=1;set('don1')}
addEventListener('keydown',e=>{keys[e.key]=1;if('jJzZ'.includes(e.key))attack()});addEventListener('keyup',e=>keys[e.key]=0);
const hold=(id,k)=>{const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>keys[k]=0};
hold('bl','ArrowLeft');hold('br','ArrowRight');document.getElementById('ba').onpointerdown=e=>{e.preventDefault();attack()};
const sel=document.getElementById('sel');Object.keys(META.anims).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o)});
sel.onchange=()=>{st.preview=sel.value;st.atk=0;if(sel.value)set(sel.value);else set('dung')};
let last=performance.now();
function loop(now){const dt=Math.min(50,now-last);last=now;
 if(!st.preview&&!st.atk){const l=keys.ArrowLeft,r=keys.ArrowRight;
  if(l||r){st.face=l?-1:1;st.x=Math.max(40,Math.min(440,st.x+st.face*dt*0.11));set('chay')}else set('dung')}
 else if(st.atk&&!st.preview){const l=keys.ArrowLeft,r=keys.ArrowRight;if(l||r){const dir=l?-1:1;st.face=dir;st.x=Math.max(40,Math.min(440,st.x+dir*dt*0.08))}}
 st.t+=dt;if(st.t>=MS[st.anim]){st.t=0;st.f++;const n=META.anims[st.anim].frames;
  if(st.atk&&!st.preview&&st.q&&st.atk<3&&st.f>=CANCEL[st.anim]){st.atk++;st.q=false;set('don'+st.atk)}else
  if(st.f>=n){if(st.atk&&!st.preview){if(st.q&&st.atk<3){st.atk++;st.q=false;set('don'+st.atk)}else{st.atk=0;st.q=false;set('dung')}}else st.f=0}}
 g.clearRect(0,0,c.width,c.height);const gr=g.createLinearGradient(0,FAR,0,c.height);gr.addColorStop(0,'#1c2235');gr.addColorStop(1,'#3a4566');g.fillStyle=gr;g.fillRect(0,FAR,c.width,c.height-FAR);g.fillStyle='#4b5a85';g.fillRect(0,FAR,c.width,2);g.fillStyle='rgba(120,140,190,.18)';for(let y=FAR+8,k=0;y<c.height;y+=6+k*3,k++)g.fillRect(0,y,c.width,1);g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(Math.round(st.x),GROUND-1,26,6,0,0,Math.PI*2);g.fill();
 const a=META.anims[st.anim],cs=META.cell;
 if(img.complete){g.save();g.translate(Math.round(st.x),GROUND);g.scale(st.face*SC,SC);
  g.drawImage(img,st.f*cs,a.row*cs,cs,cs,-43,-68,cs,cs);if(st.anim in FXROW&&fxi.complete)g.drawImage(fxi,st.f*240,FXROW[st.anim]*240,240,240,-123,-148,240,240);g.restore()}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>

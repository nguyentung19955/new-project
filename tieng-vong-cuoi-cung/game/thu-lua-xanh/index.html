const c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const MS={dung:170,chay:90,don1:70,don2:70};const GROUND=240,SC=2;
let st={x:240,face:1,anim:'dung',f:0,t:0,atk:0,q:false,preview:''};
const keys={};
function set(a){if(st.anim!==a){st.anim=a;st.f=0;st.t=0}}
function attack(){if(st.preview)return;if(st.atk){st.q=true;return}st.atk=1;set('don1')}
addEventListener('keydown',e=>{keys[e.key]=1;if('jJzZ'.includes(e.key))attack()});addEventListener('keyup',e=>keys[e.key]=0);
const hold=(id,k)=>{const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>keys[k]=0};
hold('bl','ArrowLeft');hold('br','ArrowRight');document.getElementById('ba').onpointerdown=e=>{e.preventDefault();attack()};
const sel=document.getElementById('sel');Object.keys(META.anims).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o)});
sel.onchange=()=>{st.preview=sel.value;st.atk=0;if(sel.value)set(sel.value);else set('dung')};
let last=performance.now();
function loop(now){const dt=Math.min(50,now-last);last=now;
 if(!st.preview&&!st.atk){const l=keys.ArrowLeft,r=keys.ArrowRight;
  if(l||r){st.face=l?-1:1;st.x=Math.max(40,Math.min(440,st.x+st.face*dt*0.11));set('chay')}else set('dung')}
 st.t+=dt;if(st.t>=MS[st.anim]){st.t=0;st.f++;const n=META.anims[st.anim].frames;
  if(st.f>=n){if(st.atk&&!st.preview){if(st.q&&st.atk<2){st.atk=2;st.q=false;set('don2')}else{st.atk=0;st.q=false;set('dung')}}else st.f=0}}
 g.clearRect(0,0,c.width,c.height);g.fillStyle='#2a3350';g.fillRect(0,GROUND,c.width,c.height-GROUND);
 const a=META.anims[st.anim],cs=META.cell;
 if(img.complete){g.save();g.translate(Math.round(st.x),GROUND);g.scale(st.face*SC,SC);
  g.drawImage(img,st.f*cs,a.row*cs,cs,cs,-35,-68,cs,cs);g.restore()}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);

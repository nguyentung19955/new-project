<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bell Village – The Last Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../giao-dien-chung.css" data-kd="1">
<style>
  html, body { margin:0; height:100%; background:#05080d; color:#F3E6C8; font-family:"Alegreya Sans",system-ui,sans-serif; overflow:hidden;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #game { position:fixed; inset:0; display:grid; place-items:center; }
  #cv { display:none; image-rendering:pixelated; }
  #cho { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; }
  #cho p { max-width:640px; line-height:1.5; }
  /* (khoidau) nút = ảnh ChatGPT (nút phụ art/khoi-dau, 9-slice) – không viền/bo góc CSS */
  .vien { position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); box-sizing:border-box; height:44px; min-width:112px; padding:0 4px;
    border-style:solid; border-color:transparent; border-width:0 28px; border-radius:0; background:none;
    border-image:url(../../art/khoi-dau/nut-phu-thuong.png) 0 60 fill / 0 28px stretch; image-rendering:pixelated;
    color:#ffe08a; font:700 18px "Alegreya Sans",system-ui,sans-serif; text-shadow:0 1px 2px #000; visibility:hidden; display:none; }
  .vien:active { border-image-source:url(../../art/khoi-dau/nut-phu-nhan.png); }
  body.touch .vien { display:block; }
  #b-noi { right:calc(env(safe-area-inset-right,0px) + 16px); }
  #b-bo { right:calc(env(safe-area-inset-right,0px) + 136px); display:block; z-index:5; }
  #keys { position:fixed; bottom:6px; left:50%; transform:translateX(-50%); font-size:13px; color:#d8cdb4; white-space:nowrap; pointer-events:none; text-shadow:0 1px 2px #000; }
  body.touch #keys { display:none; }
</style>
</head>
<body>
<!-- Làng Chuông (Bell Village) = điểm khởi đầu + trạm teleport (phiên cottruyen). Logic ở lang.js, bố cục lang.json.
     LUẬT HÌNH: mọi hình là ảnh ChatGPT vẽ. Thiếu ảnh bắt buộc (docs/yeu-cau-anh/cottruyen/006…) → không dựng màn, chỉ báo chữ. -->
<div id="game"><canvas id="cv" width="960" height="540"></canvas></div>
<!-- (khoidau) lúc tải: màn tải (ảnh ChatGPT art/khoi-dau/tai-nen + tai-chuong); thiếu ảnh / lỗi → "Couldn't load this area. Retry / Return to Title" -->
<div id="kd-tai" class="ui mo"><div class="kd-chuong"></div><div class="kd-chu-tai">Loading…</div></div>
<small id="thieu" hidden></small>
<button id="b-bo" class="vien" type="button">Skip</button>
<button id="b-noi" class="vien" type="button">Talk</button>
<div id="keys">← → walk · ↑ / E talk, ring the bell · Z / Enter next · ↑ ↓ choose · Esc skip</div>
<script src="../firebase/cau-hinh.js"></script>
<script src="../luu-may.js"></script>
<script src="../dang-nhap.js"></script>
<script src="../luu-chung.js"></script>
<script src="../hanh-trinh.js"></script>
<script src="../giao-dien-chung.js"></script>
<script src="../muot-khung.js"></script>
<script src="../thu-mat-na/sprite-mn.js"></script>
<script src="../cot-truyen/hop-thoai.js"></script>
<script src="../cot-truyen/canh.js"></script>
<script src="../cot-truyen/tram.js"></script>
<script>if (window.DangNhap) DangNhap.chiThongBao();   // (dangnhap) thông báo hết phiên cả khi đang chơi (ô tài khoản đã chuyển vào Account trên màn tiêu đề)
if (window.KhoiDau && KhoiDau.camUng) document.body.classList.add('touch');   // (khoidau) máy cảm ứng: không hiện chữ phím ngay từ đầu</script>
<script src="lang.js"></script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Linh Khí</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&display=swap">
<style>
  /* Bố cục: một khung game 16:9 nằm giữa màn hình, co giãn theo cạnh ngắn hơn. Game chỉ có một giao diện tối. */
  :root {
    color-scheme: dark;
    --bg: #120d10;
    --fg: #f1ead9;
    --accent: #ffd27a;
    --frame: #3a2a22;
  }
  /* Chiều cao luôn tính theo 100% của khung chứa (không dùng 100vh) để chạy đúng khi được nhúng. */
  html, body { height: 100%; overscroll-behavior: none; touch-action: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #shell { height: 100%; box-sizing: border-box; padding-inline: 16px; padding-block: 0; }
  #fit { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; touch-action: none; }
  #stage { position: relative; outline: 1px solid var(--frame); background: #000; max-width: 100%; }
  #world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #ui { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
</style>
</head>
<body>
<div id="shell"><div id="fit"><div id="stage">
  <canvas id="world" width="480" height="270" aria-label="Màn hình game Linh Khí"></canvas>
</div><canvas id="ui"></canvas></div></div>
<script>
// ===== js/data.js =====
// Dữ liệu game: hệ, vũ khí, hero, quái, vùng, trang bị. Mọi con số cân bằng nằm ở đây.
(function () {
  const G = (window.G = window.G || {});
  G.W = 480;
  G.H = 270;
  G.GY0 = 142; // mép trên của dải mặt đất
  G.GY1 = 236; // mép dưới của dải mặt đất

  G.EL = {
    fire: { name: 'Lửa', col: '#ff7a2a', col2: '#ffd23f', dark: '#a8320a' },
    poison: { name: 'Độc', col: '#6fcf3a', col2: '#c2f58a', dark: '#2f6b1a' },
    ice: { name: 'Băng', col: '#7fd4ff', col2: '#e9f9ff', dark: '#2b6ea3' },
  };
  G.ELS = ['fire', 'poison', 'ice'];
  // Trùm kháng hệ X thì yếu với WEAK[X]
  G.WEAK = { fire: 'ice', ice: 'poison', poison: 'fire' };

  G.WTYPES = {
    sword: { name: 'Kiếm', dmg: 10, cd: 0.36, reach: 32, depth: 17, special: 'Chém lướt' },
    bow: { name: 'Cung', dmg: 9, cd: 0.5, ranged: true, special: 'Mưa tên' },
    spear: { name: 'Giáo', dmg: 11, cd: 0.44, reach: 56, depth: 12, special: 'Lao tới' },
    hammer: { name: 'Búa', dmg: 23, cd: 0.8, reach: 32, depth: 25, stagger: 0.4, special: 'Nện đất' },
  };
  G.WKEYS = ['sword', 'bow', 'spear', 'hammer'];
  // BỐN BẬC MÀU của vũ khí (thay ba bậc Sắt, Bạc, Linh cũ). mult: hệ số sát thương gốc; maxStage: mốc tiến hóa cao nhất
  // (2 là Thành hình, 3 là Thức tỉnh); affixes: số dòng phụ; power: có thêm một dòng mạnh riêng. col: màu chữ, frame: màu khung ô đồ.
  G.RARITY = [
    { key: 'thuong', name: 'Thường', mult: 1, maxStage: 2, affixes: 0, power: false, col: '#d6d2c8', frame: '#8f8c86', bg: '#34323a' },
    { key: 'lam', name: 'Lam', mult: 1.15, maxStage: 3, affixes: 1, power: false, col: '#6fb2ff', frame: '#3f86e8', bg: '#1c2f52' },
    { key: 'tim', name: 'Tím', mult: 1.3, maxStage: 3, affixes: 2, power: false, col: '#c88cff', frame: '#9a4fe0', bg: '#33204f' },
    { key: 'vang', name: 'Vàng', mult: 1.5, maxStage: 3, affixes: 2, power: true, col: '#ffd24a', frame: '#f0b020', bg: '#4a3812' },
  ];
  G.TIERS = G.RARITY; // tên cũ, giữ cho mã và bài kiểm tra cũ
  // Vũ khí Vàng của vùng sau có sát thương gốc cao hơn: vùng 1 x1,5; vùng 2 x1,6; vùng 3 x1,7 (w.gold = 0, 1, 2).
  G.GOLD_MULT = [1.5, 1.6, 1.7];
  G.FAMILIES = 10; // mỗi loại vũ khí có 10 dòng (hình và tên do js/weapon_art.js giữ)
  G.MARKS = [30, 120, 300];
  G.STAGE_NAMES = ['Trắng', 'Mầm', 'Thành hình', 'Thức tỉnh'];
  // Mỗi mốc tiến hóa tăng nhẹ sát thương gốc.
  G.STAGE_MULT = [1, 1.04, 1.08, 1.12];
  G.PROC = [0, 0.2, 0.5, 1];

  // Trùm vùng (ải 5, 10, 15): lần đầu hạ chắc chắn rơi 1 vũ khí Vàng; đánh lại thì 12% Vàng, còn lại Tím.

    stage: 0.5,       // cơ hội nhận vũ khí khi qua một ải thường (trùm nhỏ)

    fire: ['Than Hồng', 'Xích Diệm', 'Hỏa Thần'],
    poison: ['Rêu Xanh', 'Nọc Rừng', 'Độc Vương'],
    ice: ['Sương Giá', 'Hàn Ngọc', 'Băng Đế'],
  };

  G.HEROES = {
    smith: {
      name: 'Thợ Rèn', hp: 100, mana: 100, speed: 1, fav: ['sword', 'hammer'],
      passive: 'Vũ khí nhận dấu ấn nhanh hơn 20%',
      skill: 'Nung', skillDesc: 'Phủ Lửa lên vũ khí trong 6 giây',
      unlock: 'Có sẵn',
    },
    hunter: {
      name: 'Thợ Săn', hp: 75, mana: 90, speed: 1.15, fav: ['bow', 'spear'],
      passive: 'Gây thêm 25% sát thương lên mục tiêu bị choáng, đóng băng, mắc bẫy hoặc lộ điểm yếu',
      skill: 'Đặt bẫy', skillDesc: 'Bẫy giữ chân quái 2 giây và gây hiệu ứng theo hệ vũ khí',
      unlock: 'Hạ Mộc Tinh',
    },
    healer: {
      name: 'Thầy Lang', hp: 85, mana: 130, speed: 1, fav: ['spear', 'bow'],
      passive: 'Hiệu ứng bạn gây ra kéo dài hơn 30%',
      skill: 'Bình thuốc', skillDesc: 'Tạo vũng Độc 5 giây, đứng trong vũng thì hồi máu',
      unlock: 'Hạ Ngư Tinh',
    },
    wrestler: {
      name: 'Đô Vật', hp: 140, mana: 80, speed: 0.9, fav: ['hammer', 'spear'],
      passive: 'Giảm 25% sát thương nhận vào, phản lại 50% sát thương cận chiến',
      skill: 'Gồng', skillDesc: '3 giây giảm 60% sát thương, đẩy lùi quái xung quanh',
      unlock: 'Hạ Hồ Tinh',
    },
  };
  G.HKEYS = ['smith', 'hunter', 'healer', 'wrestler'];

  // Cây kỹ năng: 3 nhánh, mỗi nhánh 5 nút, phải mở theo thứ tự trong nhánh.
  G.SKILLS = {
    atk: {
      name: 'Công',
      nodes: [
        'Sát thương +8%', 'Đòn đặc biệt tốn ít hơn 5 mana', 'Sát thương +15% lên quái đang dính hiệu ứng',
        'Sát thương +8%', '10% cơ hội chí mạng gấp đôi',
      ],
    },
    def: {
      name: 'Thủ',
      nodes: [
        'Máu tối đa +10%', 'Lăn né hồi nhanh hơn 25%', 'Hồi 8% máu mỗi khi qua phòng',
        'Giảm 30% thời gian dính hiệu ứng', 'Giảm 10% sát thương nhận vào',
      ],
    },
    elem: {
      name: 'Hệ',
      nodes: [
        'Mana tối đa +20', 'Mỗi đòn trúng hồi thêm 1 mana', 'Nổ khói và Sốc nhiệt mạnh hơn 30%',
        'Đòn đầu sau khi đổi vũ khí chắc chắn gây hiệu ứng', 'Hiệu ứng bạn gây ra kéo dài hơn 25%',
      ],
    },
  };
  G.SKEYS = ['atk', 'def', 'elem'];
  G.MAX_LEVEL = 30;
  G.xpNeed = (lvl) => 40 + 25 * lvl;

  G.REGIONS = [
    {
      name: 'Rừng già', el: 'poison', boss: 'moc', bossName: 'Mộc Tinh', mat: 'Gỗ linh', mini: 'Nấm Chúa',
      sky: ['#16261c', '#1f3a28', '#2c5234'], ground: '#3d5a2a', ground2: '#34502a', deco: '#1a2f1c',
      skin: ['#6b8f3a', '#4d6b28', '#c9d67a'], rescue: 'hunter',
    },
    {
      name: 'Hang biển', el: 'ice', boss: 'ngu', bossName: 'Ngư Tinh', mat: 'Vảy cá', mini: 'Cua Đá',
      sky: ['#0d1826', '#132a40', '#1c3f5c'], ground: '#48586a', ground2: '#3d4c5e', deco: '#0f2233',
      skin: ['#5f8fb0', '#3c6788', '#cfe8f5'], rescue: 'healer',
    },
    {
      name: 'Lâu đài cổ', el: 'fire', boss: 'ho', bossName: 'Hồ Tinh', mat: 'Đá lửa', mini: 'Hổ Lửa',
      sky: ['#2a1410', '#4a2016', '#70301c'], ground: '#6b4a38', ground2: '#5c3f30', deco: '#2e1812',
      skin: ['#c0603a', '#8f3f24', '#ffd0a0'], rescue: 'wrestler',
    },
  ];

  // Vai trò quái. hp và dmg là hệ số nhân với chỉ số chuẩn của ải.
  G.ROLES = {
    rusher: { name: 'Lính xông', hp: 1, dmg: 1, speed: 44, r: 8, marks: 1 },
    swarm: { name: 'Bầy nhỏ', hp: 0.34, dmg: 0.6, speed: 60, r: 5, marks: 0.34 },
    shield: { name: 'Khiên', hp: 1.7, dmg: 1.1, speed: 26, r: 10, armor: 0.45, marks: 1 },
    archer: { name: 'Xạ thủ', hp: 0.7, dmg: 0.9, speed: 38, r: 7, marks: 1 },
    nimble: { name: 'Nhanh nhẹn', hp: 0.7, dmg: 0.85, speed: 78, r: 7, marks: 1 },
    elite: { name: 'Tinh anh', hp: 5, dmg: 1.3, speed: 40, r: 12, marks: 5 },
  };

  // Chỉ số chuẩn theo ải. r: vùng 0..2, i: ải 0..4, diff: 0 thường, 1 độ khó thứ hai.
  const HP_RANGE = [[60, 115], [130, 230], [250, 370]];
  const DMG_RANGE = [[8, 12], [12, 17], [18, 24]];
  G.stageStats = function (r, i, diff) {
    const t = i / 4;
    const k = diff ? 2.2 : 1;
    const kd = diff ? 1.5 : 1;
    const n = r * 5 + i;
    return {
      hp: (HP_RANGE[r][0] + (HP_RANGE[r][1] - HP_RANGE[r][0]) * t) * k,
      dmg: (DMG_RANGE[r][0] + (DMG_RANGE[r][1] - DMG_RANGE[r][0]) * t) * kd,
      xp: Math.round((100 + 60 * n) * (diff ? 1.5 : 1)),
      gold: Math.round((80 + 30 * n) * (diff ? 1.5 : 1)),
    };
  };
  // Phòng vuông: số đợt quái và hệ số điểm mỗi đợt (so với phòng dài trước đây).
  // start: phòng Bắt đầu [ải 1-2, ải 3-5]; early: ải 1-3; late: ải 4-5; maxPerWave: số quái tối đa một đợt;
  // stagger: nửa sau của một đợt hiện ra chậm hơn bấy nhiêu giây.
  G.ROOM_WAVES = { start: [1, 2], early: 3, late: 4, challenge: 2, pts: 0.85, ptsLate: 0.85, maxPerWave: 7, stagger: 2, challengeTime: 30 };

  G.ZK = 0.85;
  // Lăn né: tốc độ ngang (điểm ảnh mỗi giây) và tỉ lệ chiều dọc so với chiều ngang (bằng tỉ lệ lúc đi bộ).

  G.MINI_HP = 12; // máu trùm nhỏ = hệ số x máu quái thường
  G.BOSS_HP = 24; // máu boss vùng = hệ số x máu quái thường
  // Hồ Tinh né nhiều nên ít lúc đánh trúng, cho ít máu hơn để trận không kéo quá 3 phút.
  G.BOSS_HP_OF = { moc: 20, ngu: 20, ho: 14 };

  G.GEAR = {
    // Mũ: giảm thời gian dính một hệ. Áo: máu và giảm sát thương.
    helm: {
      h_r1: { name: 'Nón lá rừng', res: 'poison', pct: 0.25, cost: { mat: [6, 0, 0], gold: 80 } },
      h_r2: { name: 'Mũ da cá', res: 'ice', pct: 0.25, cost: { mat: [0, 6, 0], gold: 200 } },
      h_r3: { name: 'Khăn đá lửa', res: 'fire', pct: 0.25, cost: { mat: [0, 0, 6], gold: 400 } },
      h_moc: { name: 'Mũ sừng gỗ', res: 'poison', pct: 0.4, set: 'moc', cost: { shard: [1, 0, 0], mat: [8, 0, 0], gold: 150 } },
      h_ngu: { name: 'Mũ vây cá', res: 'ice', pct: 0.4, set: 'ngu', cost: { shard: [0, 1, 0], mat: [0, 8, 0], gold: 350 } },
      h_ho: { name: 'Mũ tai cáo', res: 'fire', pct: 0.4, set: 'ho', cost: { shard: [0, 0, 1], mat: [0, 0, 8], gold: 600 } },
    },
    armor: {
      a_r1: { name: 'Áo vải thô', hp: 20, dr: 0, cost: { mat: [8, 0, 0], gold: 100 } },
      a_r2: { name: 'Áo da biển', hp: 50, dr: 0.04, cost: { mat: [0, 8, 0], gold: 250 } },
      a_r3: { name: 'Áo giáp đá', hp: 90, dr: 0.06, cost: { mat: [0, 0, 8], gold: 500 } },
      a_moc: { name: 'Áo vỏ cây', hp: 45, dr: 0.08, set: 'moc', cost: { shard: [2, 0, 0], mat: [10, 0, 0], gold: 200 } },
      a_ngu: { name: 'Áo vảy', hp: 85, dr: 0.1, set: 'ngu', cost: { shard: [0, 2, 0], mat: [0, 10, 0], gold: 450 } },
      a_ho: { name: 'Áo lông trắng', hp: 130, dr: 0.1, set: 'ho', cost: { shard: [0, 0, 2], mat: [0, 0, 10], gold: 800 } },

    charm: {

      c_ember: { name: 'Bùa tàn lửa', desc: 'Quái đang cháy nhận thêm 15% sát thương' },

  G.SETS = {
    moc: 'Bộ Mộc Tinh: đứng yên 2 giây thì bắt đầu hồi máu',

  G.sharpenCost = function (n) {
    return { ore: 2 + n * 2, gold: 50 * (n + 1), mat: n >= 5 ? 3 : 0 };

  G.goldCost = function (r) {
    const shard = [0, 0, 0];
    shard[r] = 4;
    return { gold: 800 + 300 * r, stones: 2, shard };

// ===== js/engine.js =====
// Bộ máy: canvas, co giãn màn hình, bàn phím và cảm ứng, âm thanh, lưu game, vòng lặp.

  G.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  G.dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  G.srand = function (seed) {
    let s = seed >>> 0 || 1;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  };

  // ---------- bàn phím ----------
  G.keys = {};
  G.keyP = {};
  window.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!G.keys[e.code]) G.keyP[e.code] = true;
    G.keys[e.code] = true;

  window.addEventListener('keyup', (e) => { G.keys[e.code] = false; });

  // ---------- con trỏ và cảm ứng ----------
  G.pointers = new Map();

  G.downs = []; // các lần vừa chạm xuống trong khung hình này

    return { x: (e.clientX - r.left) / G.scale, y: (e.clientY - r.top) / G.scale };
  }

  document.addEventListener('visibilitychange', () => {

  G.inRect = (p, x, y, w, h) => p && p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;

  G.audioStart = function () {

    } catch (e) { /* máy không có âm thanh */ }
  };
  const SFX = {
    hit: [220, 0.05, 'square', 0.05], swing: [520, 0.04, 'triangle', 0.03], hurt: [110, 0.12, 'sawtooth', 0.07],
    mark: [1040, 0.09, 'sine', 0.06], evolve: [660, 0.35, 'triangle', 0.08], warn: [330, 0.1, 'square', 0.04],
    gong: [98, 0.6, 'sine', 0.12], pick: [780, 0.08, 'sine', 0.05], die: [160, 0.1, 'square', 0.04],
    fire: [300, 0.08, 'sawtooth', 0.03], poison: [180, 0.1, 'triangle', 0.04], ice: [1400, 0.06, 'sine', 0.04],
    boom: [70, 0.25, 'sawtooth', 0.1], ui: [600, 0.03, 'square', 0.03], win: [880, 0.5, 'triangle', 0.08],
  };
  G.sfx = function (name, pitch) {
    if (!ac || !G.save.sound || G.noRender || ac.state !== 'running') return;

    if (!d) return;

      if (name === 'boom' || name === 'hurt') o.frequency.exponentialRampToValueAtTime(d[0] * 0.5, ac.currentTime + d[1]);
      g.gain.value = d[3];
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d[1]);

  };

  // ---------- lưu game ----------
  const KEY = 'linhkhi_save_v1';
  // Trường "tier" cũ là tên khác của "rarity": đọc và ghi w.tier vẫn chạy, nhưng bản lưu chỉ ghi rarity.
  G.linkTier = function (w) {

  G.fitAffixes = function (w, pick) {
    const R = G.RARITY[w.rarity], keys = Object.keys(G.AFFIX);
    pick = pick || G.pick;
    w.affixes = (w.affixes || []).filter((k, i, a) => G.AFFIX[k] && a.indexOf(k) === i).slice(0, R.affixes);
    while (w.affixes.length < R.affixes) w.affixes.push(pick(keys.filter((k) => !w.affixes.includes(k))));
    if (!R.power) { w.power = null; w.gold = 0; } else if (!G.POWER[w.power]) w.power = pick(Object.keys(G.POWER));

  };

  };
  G.newSave = function () {
    const s = {
      v: 1, gold: 0, ore: 0, stones: 0, mats: [0, 0, 0], shards: [0, 0, 0], forge: 1,

      stars: {}, stars2: {}, scars: {}, tut: {}, sound: true, wins: 0, bossGold: {},

    for (const k of G.HKEYS) s.heroes[k] = { unlocked: k === 'smith', lvl: 1, xp: 0, sk: { atk: 0, def: 0, elem: 0 } };
    s.carry[0] = G.newWeapon(s, 'sword', 0, { family: 0 }).id; // Kiếm Rèn

  G.loadSave = function () {

  // Kiểm tra bản lưu cũ hoặc hỏng: thiếu gì thì bù, sai gì thì sửa, hỏng nặng thì tạo mới.

      const obj = (v) => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
      const arr3 = (v) => [0, 1, 2].map((i) => Math.max(0, num(Array.isArray(v) ? v[i] : 0, 0)));
      for (const k in base) if (!(k in s)) s[k] = base[k];
      for (const k of ['gold', 'ore', 'stones', 'wins']) s[k] = Math.max(0, Math.floor(num(s[k], 0)));
      s.mats = arr3(s.mats); s.shards = arr3(s.shards);
      s.forge = G.clamp(Math.floor(num(s.forge, 1)), 1, G.FORGE_CAP.length - 1);
      s.sound = s.sound !== false;
      for (const k of ['stars', 'stars2', 'scars', 'tut']) s[k] = obj(s[k]);
      for (const k of ['stars', 'stars2']) for (const id in s[k]) s[k][id] = G.clamp(Math.floor(num(s[k][id], 1)), 1, 3);
      for (const id in s.scars) if (!G.ELS.includes(s.scars[id])) delete s.scars[id];
      // hero
      s.heroes = obj(s.heroes);
      for (const k of G.HKEYS) {
        const h = obj(s.heroes[k]), sk = obj(h.sk);
        const lvl = G.clamp(Math.floor(num(h.lvl, 1)), 1, G.MAX_LEVEL);
        const fix = { unlocked: k === 'smith' || !!h.unlocked, lvl, xp: Math.max(0, num(h.xp, 0)), sk: {} };
        for (const b of G.SKEYS) fix.sk[b] = G.clamp(Math.floor(num(sk[b], 0)), 0, 5);
        if (fix.sk.atk + fix.sk.def + fix.sk.elem > Math.floor(lvl / 3)) fix.sk = { atk: 0, def: 0, elem: 0 };
        s.heroes[k] = Object.assign(h, fix);
      }
      if (!G.HKEYS.includes(s.hero) || !s.heroes[s.hero].unlocked) s.hero = 'smith';
      // vũ khí

        seen[w.id] = true;

  G.persist = function () {

  G.weaponById = (id) => G.save.weapons.find((w) => w.id === id) || null;

  // ---------- vẽ giao diện (toạ độ 480x270, chữ nét ở độ phân giải thật) ----------
  const FONT = '"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

  ui.panel = function (x, y, w, h, title) {

  // ---------- dựng hình và bộ đệm ----------
  const clampI = (v, a, b) => Math.max(a, Math.min(b, v | 0));
  function params(o) {
    const type = FAM[o.type] ? o.type : 'sword';
    const list = FAM[type], fi = clampI(o.family || 0, 0, list.length - 1), F = list[fi];
    let st = clampI(o.stage || 0, 0, 3), el = ELP[o.branch] ? o.branch : null;
    if (!el) st = 0; if (st === 0) el = null;
    const rar = clampI(o.rarity || 0, 0, 3), E = el ? ELP[el] : null;
    const P = {
      type: type, fam: fi, F: F, el: el, st: st, rar: rar, E: E, R: RARITY[rar],
      base: F.mat, M: st >= 2 ? E.B : F.mat, ol: st >= 2 ? E.ol : INK,
      A: st >= 2 ? E.gd : GOLD, // màu chắn tay, đai
      k: [1, 1.03, 1.08, 1.14][st], ks: KS[type] * (F.ks || 1), seed: fi * 7 + TYPES.indexOf(type) * 31 + 3,
      fire: el === 'fire', poison: el === 'poison', ice: el === 'ice',
      warp: null, arc: F.arc || null, wave: F.wave || null,
    };
    if (el === 'poison' && F.warp) {
      const w = F.warp, a = [0, 0.7, 1.5, 2.3][st] * (w.amp == null ? 1 : w.amp);
      P.warp = w.bow ? { bow: true, amp: a, f: w.f || 0.3, ph: w.ph || 0.6, fade: w.fade } : { t0: w.t0, L: w.L, amp: a, f: w.f || 1.5, hook: (w.hook || 0) * st };
    }
    return P;
  }
  const KS = { sword: 0.88, bow: 0.9, spear: 0.88, hammer: 0.86 };
  const keyOf = (P) => P.type[1] + P.fam + (P.el ? P.el[0] : 'n') + P.st + P.rar;
  const cache = new Map();
  const CACHE_MAX = 600, RAD = 72, ASTEP = 5;
  function body(P, angQ) {
    const key = keyOf(P) + '|' + angQ;
    let b = cache.get(key);
    if (b) return b;
    const fr = new Frame(angQ, P), S = new Spr(RAD, fr);
    P.F.build(S, P);
    S.gild(P.rar);
    S.finish();
    b = S.toCanvas(); b.fr = fr;
    // chiều dài thân: dọc trục t (cung thì dọc cánh cung), cộng 2 điểm viền
    b.len = Math.round((P.type === 'bow' ? S.q1 - S.q0 : S.t1 - S.t0) + 3);
    if (cache.size >= CACHE_MAX) { let n = 0; for (const k of cache.keys()) { cache.delete(k); if (++n > CACHE_MAX / 4) break; } }
    cache.set(key, b);
    return b;
  }
  const qAng = (a) => { a = Math.round((a || 0) / ASTEP) * ASTEP; a = ((a % 360) + 360) % 360; return a; };

// File tự đứng một mình: trang phác thảo cũng nạp chính file này để hình trong tờ duyệt và trong game là một.
// Gốc (0,0) là điểm giữa hai bàn chân, x sang phải, y âm là lên trên. Bé quay mặt sang phải, sáng từ trên bên phải.
(function () {

  // ====================================================================
  // 1. BỘ VẼ ĐIỂM ẢNH (lấy từ lib.js của tờ phác thảo đã duyệt)
  // Chất liệu là bộ ba sắc độ [tối, vừa, sáng]: mép trên tự sáng, mép dưới và mép trái tự tối.
  // ====================================================================
  const Dk = (r) => ({ c: r, t: 0, f: true });
  const Md = (r) => ({ c: r, t: 1, f: true });
  const Lt = (r) => ({ c: r, t: 2, f: true });
  function norm(c) {
    if (typeof c === 'string') return { c: [c, c, c], t: 1, f: true };
    if (Array.isArray(c)) return { c: c, t: 1, f: false };
    return { c: c.c, t: c.t, f: c.f };
  }
  const D2R = Math.PI / 180;
  function rotv(x, y, deg) { const r = deg * D2R, c = Math.cos(r), s = Math.sin(r); return [x * c - y * s, x * s + y * c]; }

  class Spr {
    constructor(w, h, ox, oy) {
      this.w = w; this.h = h; this.ox = ox; this.oy = oy;

      this.bx0 = 0; this.bx1 = -1; this.by0 = 0; this.by1 = -1;
    }
    p(x, y, c) {
      x = Math.round(x) + this.ox; y = Math.round(y) + this.oy;
      if (x < 1 || y < 1 || x >= this.w - 1 || y >= this.h - 1) return;
      const i = y * this.w + x;
      if (this.clip && !this.lay[i]) return;
      this.lay[i] = c === 0 ? null : norm(c);
      if (x < this.bx0) this.bx0 = x; if (x > this.bx1) this.bx1 = x; if (y < this.by0) this.by0 = y; if (y > this.by1) this.by1 = y;
    }
    r(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.p(x + i, y + j, c); }
    e(cx, cy, rx, ry, c) {
      const a = rx + 0.35, b = ry + 0.35;
      for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++)
        for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
          const dx = (x - cx) / a, dy = (y - cy) / b;
          if (dx * dx + dy * dy <= 1) this.p(x, y, c);

    }
    // bầu dục xoay một góc
    er(cx, cy, rx, ry, deg, c) {
      const a = rx + 0.35, b = ry + 0.35, R = Math.max(rx, ry) + 1, r = deg * D2R, cs = Math.cos(r), sn = Math.sin(r);
      for (let y = Math.floor(cy - R); y <= Math.ceil(cy + R); y++)
        for (let x = Math.floor(cx - R); x <= Math.ceil(cx + R); x++) {

    }
    g(pts, c) {
      let y0 = 1e9, y1 = -1e9; const n = pts.length;
      for (const q of pts) { if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; }
      for (let y = Math.ceil(y0 - 0.5); y <= Math.floor(y1 + 0.5); y++) {
        const yy = Math.min(y1 - 0.01, Math.max(y0 + 0.01, y + 0.003)); const xs = [];
        for (let i = 0; i < n; i++) {
          const a = pts[i], b = pts[(i + 1) % n];
          if ((a[1] <= yy) !== (b[1] <= yy)) xs.push(a[0] + ((yy - a[1]) * (b[0] - a[0])) / (b[1] - a[1]));
        }
        xs.sort((p, q) => p - q);
        for (let k = 0; k + 1 < xs.length; k += 2) for (let x = Math.round(xs[k]); x <= Math.round(xs[k + 1]); x++) this.p(x, y, c);

    }
    l(x0, y0, x1, y1, w, c) {
      const dx = x1 - x0, dy = y1 - y0, n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)))), o = w >> 1;

    // Một miếng: opt.ol màu viền (false là không viền), opt.bevel false là không tự đánh sáng tối, opt.fx là hiệu ứng.
    part(opt, fn) {
      if (typeof opt === 'function') { fn = opt; opt = {}; }
      const W = this.w, L = this.buf;
      this.lay = L; this.clip = false; this.bx0 = this.w; this.bx1 = -1; this.by0 = this.h; this.by1 = -1;

      if (opt.bevel !== false && !opt.fx) {

          if (!L[i - 1]) { this.main[i - 1] = ol; this.olf[i - 1] = 1; this.nol[i - 1] = 0; }

          if (!L[i - W]) { this.main[i - W] = ol; this.olf[i - W] = 1; this.nol[i - W] = 0; }

    // tint: [màu, độ pha] để nhuộm khi trúng đòn, dính băng, dính độc
    toCanvas(tint) {

    }

      P((s) => { H.g([[-7, -3], [-6, -7], [-3, -8], [4, -8], [7, -7], [8, -3]], EMBER); s.in(() => { H.r(-7, -4, 16, 1, Dk(EMBER)); H.r(3, -6, 2, 2, Lt(GOLD)); H.p(-2, -7, Lt(EMBER)); H.p(0, -6, Lt(EMBER)); }); });

  // ---------- ÁO ----------
  // Áo trùm (bộ khởi đầu): phủ từ vai xuống gần chân.
  function cloak(cx, P, C, o) {
    const B = cx.B; o = o || {};
    P((s) => {
      B.g([[-3, -13], [3, -13], [5, -3], [-5, -3]], C);
      s.in(() => { B.r(-5, -4, 11, 1, Lt(C)); B.r(-5, -9, 2, 6, Dk(C)); B.p(1, -11, o.clasp || Md(GOLD)); if (o.sash) B.r(-4, -8, 9, 1, o.sash); });
    });
  }
  // Áo nhiều tầng xù: áo tơi, áo lông.
  function tiers(cx, P, C, o) {
    const B = cx.B; o = o || {};
    const T = [[-6, 6, -7, -3], [-5, 5, -10, -7], [-4, 4, -13, -10]];
    for (const t of T) P((s) => {
      B.g([[t[0] + 1, t[2]], [t[1] - 1, t[2]], [t[1], t[3]], [t[0], t[3]]], C);
      s.in(() => { for (let u = t[0]; u <= t[1]; u += 2) { B.p(u, t[3], Dk(C)); B.p(u + 1, t[3] - 1, o.fleck || Md(C)); } });
      for (let u = t[0] + 1; u <= t[1]; u += 3) B.p(u, t[3] + 1, Md(C));
    });
    if (o.sash) P({ ol: false, bevel: false }, (s) => { B.r(-4, -10, 9, 1, o.sash); });
  }
  // Áo ngắn vừa người: áo vải, áo the, áo vảy.
  function tunic(cx, P, C, o) {
    const B = cx.B; o = o || {}; const hem = o.hem == null ? -4 : o.hem;
    P((s) => {
      B.g([[-3, -13], [3, -13], [4, hem], [-4, hem]], C);
      s.in(() => {
        B.r(-4, -9, 2, 9, Dk(C));
        if (o.collar) { B.p(0, -13, o.collar); B.p(1, -12, o.collar); B.p(2, -13, o.collar); }
        if (o.seam) B.l(1, -11, 1, hem, 1, Dk(C));
        if (o.belt) { B.r(-4, -7, 9, 1, o.belt); B.p(1, -7, Lt(GOLD)); }
        if (o.scales) for (let v = -12; v <= hem; v += 2) for (let u = -3 + ((v / 2) & 1); u <= 4; u += 2) B.p(u, v, Lt(C));
        if (o.under) B.r(-4, hem, 9, 1, o.under);
        if (o.patch) B.r(1, -6, 2, 2, o.patch);
      });
    });
  }
  // Giáp nẹp: giáp tre, giáp đá, áo vỏ cây.
  function plates(cx, P, C, o) {
    const B = cx.B; o = o || {};
    P((s) => { B.r(-5, -6, 11, 3, C); s.in(() => { for (const u of [-3, 0, 3]) B.r(u, -6, 1, 3, Dk(C)); B.r(-5, -6, 11, 1, o.cord || Md(RED)); }); });
    P((s) => {
      B.g([[-4, -13], [4, -13], [4, -6], [-4, -6]], C);
      s.in(() => { for (const u of [-2, 1]) B.r(u, -13, 1, 8, Dk(C)); B.r(-4, -10, 9, 1, o.cord || Md(RED)); if (o.glow) { B.p(2, -12, o.glow); B.p(3, -8, o.glow); B.p(-1, -8, o.glow); } });
    });
    P((s) => { B.r(-6, -14, 4, 3, C); B.r(3, -14, 4, 3, C); s.in(() => { B.r(-6, -12, 4, 1, Dk(C)); B.r(3, -12, 4, 1, Dk(C)); if (o.moss) { B.r(-6, -14, 2, 1, o.moss); B.p(5, -14, o.moss); } }); });
    if (o.sprout) P({ ol: GRN[0] }, (s) => { B.r(4, -17, 2, 2, Md(GRN)); B.p(4, -15, Md(GRN)); });
  }
  // Áo cộc không tay: áo da.
  function vest(cx, P, C, o) {
    const B = cx.B; o = o || {};
    P((s) => {
      B.g([[-4, -12], [4, -12], [4, -4], [-4, -4]], C);
      s.in(() => { B.r(-4, -9, 2, 6, Dk(C)); B.r(-4, -7, 9, 1, DARK); B.p(1, -7, Lt(GOLD)); for (let u = -4; u <= 4; u += 2) B.p(u, -4, o.trim ? Md(o.trim) : Lt(C)); });
    });
    P((s) => { B.e(0, -12.5, 4.6, 1.4, o.trim || FUR); });
  }

  // ---------- CÁNH ----------
  // Mỗi lá cánh: [góc (0 là chĩa ra sau, 90 là chĩa lên), dài, rộng]. Cấp càng cao càng nhiều lá, càng dài.
  const WINGS = {
    chuon: { name: 'Cánh chuồn chuồn', ramp: ['#5a8fb8', '#a8dcf0', '#f0fcff'], ol: '#2c4a6a', shape: 'lobe', lv: [[[22, 8, 4]], [[42, 15, 5], [6, 12, 5]], [[52, 24, 7], [22, 22, 7], [-10, 14, 5]]] },
    la: { name: 'Cánh lá', ramp: GRN, ol: '#12331a', shape: 'leaf', lv: [[[25, 8, 4]], [[40, 15, 7], [4, 12, 6]], [[56, 22, 9], [26, 24, 10], [-6, 17, 8]]] },
    lua: { name: 'Cánh lửa', ramp: FIRE, ol: '#7a1810', shape: 'flame', lv: [[[25, 9, 4]], [[42, 16, 7], [8, 12, 6]], [[60, 22, 8], [34, 26, 10], [8, 20, 8], [-16, 12, 5]]] },
    bang: { name: 'Cánh băng', ramp: ICE, ol: '#1c3a70', shape: 'shard', lv: [[[25, 9, 4]], [[50, 15, 5], [24, 15, 5], [-2, 11, 4]], [[66, 20, 5], [46, 25, 6], [26, 24, 6], [6, 19, 5], [-14, 12, 4]]] },
  };
  function blade(W, a, len, wid, shape, C, hi) {
    const r = a * D2R, dx = -Math.cos(r), dy = -Math.sin(r), nx = -dy, ny = dx, h = wid / 2;
    const q = (t, k) => [dx * len * t + nx * h * k, dy * len * t + ny * h * k];
    let pts;
    if (shape === 'lobe') pts = [q(0, 0), q(0.25, 0.8), q(0.6, 1), q(0.9, 0.7), q(1, 0), q(0.9, -0.7), q(0.6, -1), q(0.25, -0.8)];
    else if (shape === 'leaf') pts = [q(0, 0), q(0.4, 1), q(1, 0.1), q(0.45, -1)];
    else if (shape === 'flame') pts = [q(0, 0.3), q(0.4, 1.1), q(0.7, 0.5), q(1, 0.9), q(0.75, -0.2), q(0.4, -1), q(0, -0.4)];
    else pts = [q(0, 0.4), q(0.35, 1), q(1, 0), q(0.3, -1), q(0, -0.4)];
    W.g(pts, C);
    W.S.in(() => {
      const a0 = q(0.12, 0), a1 = q(0.85, shape === 'flame' ? 0.4 : 0);
      if (shape === 'leaf') W.l(a0[0], a0[1], a1[0], a1[1], 1, Dk(C));
      else if (shape === 'flame') { const b = q(0.2, 0.1), d = q(0.6, 0.3); W.l(b[0], b[1], d[0], d[1], 1, hi ? '#fff0b0' : Lt(C)); }
      else { const b = q(0.2, 0.2), d = q(0.75, 0.1); W.l(b[0], b[1], d[0], d[1], 1, shape === 'shard' ? SH : Lt(C)); }
    });
  }
  for (const id in WINGS) {
    const w = WINGS[id];
    def('wings', id, w.name, {
      levels: 3,
      draw: (cx, P) => {
        const lv = Math.max(1, Math.min(3, cx.lv | 0)), bl = w.lv[lv - 1], flap = [-14, 0, 18, 0][cx.f % 4] * (lv === 1 ? 0.6 : 1);
        const far = cx.B.sub(-3, -11, flap * 0.7 + 16), near = cx.B.sub(-4, -10, flap);
        const dim = [w.ramp[0], w.ramp[0], w.ramp[1]];
        P({ ol: w.ol }, (s) => { for (const b of bl) blade(far, b[0], b[1] * 0.85, b[2], w.shape, dim, false); });
        P({ ol: w.ol }, (s) => { for (const b of bl) blade(near, b[0], b[1], b[2], w.shape, w.ramp, lv === 3); });
        if (lv === 3) P({ fx: true }, (s) => {
          const k = cx.f % 4, c1 = id === 'lua' ? '#ffd27a' : id === 'la' ? '#c8a0ea' : '#ffffff', c2 = id === 'lua' ? '#ff8a3a' : id === 'la' ? '#b5ea6a' : '#bfe9ff';
          for (const q of [[-14, -18, c1], [-23, -8, c2], [-18, 4, c1], [-8, -24, c2], [-25, -16, c1]]) { const a = near.pt(q[0] - (k & 1), q[1] - k); s.p(a[0], a[1], q[2]); }
          if (id === 'chuon' || id === 'bang') { const a = near.pt(-20, -13), x = Math.round(a[0]), y = Math.round(a[1]); s.p(x, y, SH); if (k < 2) { s.p(x - 1, y, '#bfe9ff'); s.p(x + 1, y, '#bfe9ff'); s.p(x, y - 1, '#bfe9ff'); s.p(x, y + 1, '#bfe9ff'); } }
        });
      },
    });
  }

  // Bộ khởi đầu của từng hero và màu áo.
  const HERO = {
    smith: { name: 'Thợ Rèn', col: RED, outfit: { hat: 'trum_sung', robe: 'ao_trum', back: null, hand: 'bua_con', mask: 'lua' }, shadow: 7 },

  // Nối món đồ đang có trong data.js (G.GEAR) sang các lớp mới.
  L.fromGear = {
    helm: { h_r1: 'non_la', h_r2: 'mu_da_ca', h_r3: 'khan_lua', h_moc: 'mu_sung', h_ngu: 'mu_vay_ca', h_ho: 'mu_tai_cao' },

  };
  // Gộp: bộ khởi đầu, rồi mũ áo đang mặc trong game (o.helm, o.armor), rồi o.outfit nếu có (hoặc o.p.outfit: đồ gắn sẵn trên người chơi).
  function outfitOf(key, o) {
    const st = HERO[key].outfit, x = (o && o.outfit) || (o && o.p && o.p.outfit) || {};
    const pick = (k, gear) => (x[k] !== undefined ? x[k] : gear || st[k]);
    return {
      hat: pick('hat', o && o.helm && L.fromGear.helm[o.helm]), robe: pick('robe', o && o.armor && L.fromGear.armor[o.armor]),
      back: pick('back'), hand: pick('hand'), mask: pick('mask'), wing: x.wing && x.wing.level > 0 && L.wings[x.wing.kind] ? { kind: x.wing.kind, level: Math.min(3, x.wing.level | 0) } : null,
    };
  }

  // ====================================================================
  // 4. VẼ MỘT EM BÉ THEO LỚP
  // Thứ tự: lưng (cánh, đồ đeo) -> thân trần -> áo -> mũ -> mặt nạ -> tay gần. only: chỉ vẽ một lớp (để tách lớp cho dễ nhìn).
  // ====================================================================
  const SHN = [2, -10], SHF = [-2, -10]; // vai gần, vai xa
  function reach(sh, h, max) { const dx = h[0] - sh[0], dy = h[1] - sh[1], d = Math.hypot(dx, dy); return d <= max ? h : [sh[0] + (dx / d) * max, sh[1] + (dy / d) * max]; }
  function eyes(H, kind) {
    if (kind === 'blink') { H.r(0, 1, 2, 1, INK); H.r(4, 1, 2, 1, INK); }
    else if (kind === 'shut') { H.p(0, 0, INK); H.p(1, -1, INK); H.p(2, 0, INK); H.p(4, 0, INK); H.p(5, -1, INK); H.p(6, 0, INK); }
    else if (kind === 'hurt') { H.p(0, -1, INK); H.p(1, 0, INK); H.p(0, 1, INK); H.p(5, -1, INK); H.p(4, 0, INK); H.p(5, 1, INK); }
    else if (kind === 'x') { for (const u of [0, 4]) { H.p(u, -1, INK); H.p(u + 2, -1, INK); H.p(u + 1, 0, INK); H.p(u, 1, INK); H.p(u + 2, 1, INK); } }

  function drawKid(S, key, of, ps, only) {

    const cx = { S, B, H, C, f: ps.f | 0, ps, key, lv: of.wing ? of.wing.level : 0 };
    const lay = (name) => (opt, fn) => { if (only && only !== name) return; S.part(opt, fn); };

    const hat = L.hats[of.hat], robe = L.robes[of.robe], back = L.backs[of.back], hand = L.hands[of.hand], wing = of.wing && L.wings[of.wing.kind];
    let hn = ps.hn || [5, -7], hf = ps.hf || [-4, -7];

    hn = reach(SHN, hn, ps.grip ? 10 : 7); hf = reach(SHF, hf, ps.grip ? 11 : 7);
    const glove = hand && hand.glove;
    const arm = (sh, h, near) => {
      Pt((s) => { B.l(sh[0], sh[1], h[0], h[1], 2, near ? SKIN : Dk(SKIN)); });
      if (robe && robe.sleeve) { const k = robe.sleeveLen || 0.72, R = robe.sleeve(cx); Pa((s) => { B.l(sh[0], sh[1], sh[0] + (h[0] - sh[0]) * k, sh[1] + (h[1] - sh[1]) * k, 3, near ? R : [R[0], R[0], R[1]]); }); }

    // 2. thân trần
    arm(SHF, hf, false);
    const ff = ps.ff || [2, 0], fb = ps.fb || [-2, 0];
    Pt((s) => { B.l(-2, -4, fb[0], fb[1] - 2, 2, Dk(SKIN)); B.l(1, -4, ff[0], ff[1] - 2, 2, Dk(SKIN)); });
    Pt((s) => { B.r(fb[0] - 1, fb[1] - 2, 3, 2, DARK); B.r(ff[0] - 1, ff[1] - 2, 3, 2, DARK); });
    Pt((s) => { B.e(0, -8, 3.6, 4.4, SKIN); s.in(() => { B.e(-2, -6, 2, 2.5, Dk(SKIN)); }); });
    // 3. áo
    if (robe) robe.draw(cx, Pa);
    if (back && back.front) back.front(cx, Pb);
    // đầu trần: tròn, có chỏm tóc tinh linh
    Pt({ ol: SKIN[0] }, (s) => { H.l(0, -6, -1, -8, 1, Md(SKIN)); H.p(0, -9, Lt(SKIN)); });
    Pt((s) => { H.e(0.5, 0, 6.3, 5.8, SKIN); s.in(() => { H.e(-3.5, 2.5, 3, 2.5, Dk(SKIN)); }); });
    // 4. mũ

    Pt({ ol: only === 'than' || !hat || !hat.tint ? SKIN[0] : C[0] }, (s) => {
      H.e(2.5, 0.5, 4.3, 4.3, Md(MASK));

    });

    if (hat && hat.front) hat.front(cx, Pm);

  }

  // ====================================================================
  // 5. VŨ KHÍ SỐNG (hình tạm, dùng khi chưa có G.weaponArt)
  // Vẽ trong hệ F: gốc là điểm cầm, trục x chĩa về mũi vũ khí. kind: thuong | lua | doc | bang. mood: idle | attack | hurt.
  // ====================================================================
  const KIND = { fire: 'lua', poison: 'doc', ice: 'bang' };
  const kramp = (kind, base) => (kind === 'lua' ? ['#8a1c12', '#e8492a', '#ffb347'] : kind === 'doc' ? TOX : kind === 'bang' ? ICE : base);

  // con mắt của vũ khí: (cx,cy) là tâm, m là hướng nhìn

  function wSword(S, F, kind, mood) {

    const B = kramp(kind, STEEL), olc = kol(kind);

      s.in(() => {
        Lq(T(12, -4), T(31, -5), 1, Dk(B)); Lq(T(31, -5), T(44, 0), 1, Dk(B)); Lq(T(12, 3), T(31, 4), 1, Lt(B)); Lq(T(31, 4), T(42, 0), 1, Lt(B));
        Lq(T(23, 0), T(39, 0), 1, Dk(B)); Lq(T(26, 2), T(33, 2), 1, SH);

    S.part((s) => { F.g([T(8, -6), T(8, 6), T(13, 7.5), T(10.5, 4), T(10.5, -4), T(13, -7.5)], Gd); s.in(() => { const p = F.pt(5, 0); s.r(Math.round(p[0]) - 1, Math.round(p[1]) - 1, 2, 2, kind === 'bang' ? Md(BLU) : Md(RED)); }); });

  // tua đỏ: rủ xuống theo chiều đất chứ không theo vũ khí

  // Cung rồng: thân rồng uốn thành cánh cung, đầu rồng ngậm dây. pull 0..1 là độ kéo dây.

      F.g([[-12, -22], [-6, -23], [-3, -20], [-3, -17], [-8, -15], [-12, -17]], C);
      s.in(() => { F.r(-6, -19, 4, 1, Lt(C)); F.r(-11, -17, 6, 1, Md(GOLD)); });

      else { F.r(-8, -21, 3, 2, kind === 'lua' ? '#ffe36a' : SH); F.r(-6, -21, 1, 2, INK); if (mood !== 'attack') F.r(-9, -22, 3, 1, INK); F.p(-6, -21, INK); }
    });

  // Giáo sống: cán tre, lưỡi lá có một mắt, tua đỏ.

    S.part((s) => { F.r(-16, -1, 3, 2, GOLD); });
    S.part({ ol: olc }, (s) => {
      F.g([[24, -1], [29, -5], [35, -3.5], [42, 0], [35, 3.5], [29, 5], [24, 1]], B);
      s.in(() => { F.l(26, -3, 40, 0, 1, Dk(B)); F.l(27, 3, 39, 0, 1, Lt(B)); F.l(34, 1, 38, 1, 1, SH); if (kind === 'lua') F.l(34, 0, 40, 0, 1, '#fff0b0'); });

    S.part((s) => { F.g([[21, -5], [24, -2], [24, 2], [21, 5], [22, 2], [22, -2]], kind === 'doc' ? PURP : GOLD); });

  // Búa sống: đầu to như chiêng đồng, núm chiêng là con mắt.
  function wHammer(S, F, kind, mood) {

    S.part((s) => { F.e(-6, 0, 1.5, 1.5, GOLD); });

      F.e(22, 0, 9, 9, B);
      s.in(() => {

      else { s.r(x - 1, y - 1, 3, 3, kind === 'lua' ? '#ffe36a' : SH); s.r(x, y - 1, 2, 2, INK); if (mood !== 'attack') s.r(x - 2, y - 2, 4, 1, INK); else { s.l(x - 3, y - 4, x + 2, y - 2, 1, INK); } }

  const WCACHE = new Map();
  function weaponSprite(type, kind, mood, ang, pull) {

    let sp = WCACHE.get(id);

  // ====================================================================
  // 6. TƯ THẾ
  // Tư thế tự do: cho sẵn vị trí thân (x,y), góc nghiêng rot, bàn tay, bàn chân.
  // Tư thế bám vũ khí: cho vị trí và góc vũ khí, bé treo theo điểm cầm. hang: hướng treo (0 là thõng xuống, 90 là bay ngang phía sau,
  // 180 là bị hất lên trên), dist: khoảng cách vai tới điểm cầm (quá 9 là tuột tay), rot: góc thân (mặc định bằng hang).
  // ====================================================================
  const TAU = Math.PI * 2;
  const REST = { sword: { x: 12, y: -9, ang: -90 }, bow: { x: 16, y: -18, ang: 0 }, spear: { x: 11, y: -15, ang: -90 }, hammer: { x: 12, y: -10, ang: -90 } };
  const HOLD = { sword: -5, spear: -10, hammer: -5 }; // bé nắm ở đuôi chuôi, cách điểm cầm chừng này dọc theo vũ khí
  const KDEF = { pull: 0, hang: 0, stand: 0, lean: 0 };
  function kfill(k, wt) { const o = Object.assign({}, KDEF, k); if (o.dist == null) o.dist = wt === 'bow' ? 7 : 5; if (o.rot == null) o.rot = o.hang; return o; }
  function kf(keys, u, wt) {
    if (u <= keys[0][0]) return kfill(keys[0][1], wt);

      if (u <= keys[i][0]) {

        for (const n in b) o[n] = typeof b[n] === 'number' ? a[n] + (b[n] - a[n]) * k : b[n];

      }

    return kfill(keys[keys.length - 1][1], wt);

      // Vào thật gần mới vung đòn, và đòn với xa hơn tầm bắt đầu 14 điểm: lùi chậm thì vẫn trúng, phải bước hẳn ra hoặc lăn né.
      if (ad < 16 + e.r && Math.abs(dy) < 10 && e.cd <= 0) {
        e.wind = e.role === 'swarm' ? 0.3 : e.role === 'shield' ? 0.55 : 0.42;
        return;
      }
    }
    const mdx = tx - e.x, mdy = ty - e.y, md = Math.hypot(mdx, mdy);
    if (md > 2) {
      e.x += (mdx / md) * sp * dt;
      e.y += (mdy / md) * sp * 0.75 * dt;
      e.moving = true;
    }
    e.y = G.clamp(e.y, W.y0, W.y1);
  }
  function separate() {
    const a = W.ents;
    for (let i = 0; i < a.length; i++) {
      for (let j = i + 1; j < a.length; j++) {
        const A1 = a[i], B = a[j];
        if (A1.dead || B.dead) continue;
        const dx = B.x - A1.x, dy = (B.y - A1.y) * 1.6;
        const d = Math.hypot(dx, dy), min = (A1.r + B.r) * 0.9;
        if (d < min && d > 0.01) {
          const k = ((min - d) / d) * 0.5;
          A1.x -= dx * k; B.x += dx * k;
          A1.y -= (dy * k) / 1.6; B.y += (dy * k) / 1.6;
        }
      }
    }
  }

  // ---------- cập nhật mỗi khung ----------
  G.updateWorld = function (dt, inp) {
    const P = W.P;
    // Khựng hình khi đòn trúng: chỉ có khi đang vẽ, nút bấm trong lúc khựng được giữ lại cho khung sau.
    if (!G.noRender && G.fx && G.fx.frozen && G.fx.frozen(dt, inp)) return;
    G.updatePlayer(P, inp, dt);
    for (const e of W.ents) if (!e.dead) updateEnemy(e, dt);
    separate();
    // Quái đã vào phòng thì không được lùi hay bị đẩy ra ngoài mép phòng (ngoài đó người chơi không với tới).
    for (const e of W.ents) {
      if (e.x >= W.x0 && e.x <= W.x1) e.inside = true;
      else if (e.inside) e.x = G.clamp(e.x, W.x0, W.x1);
    }
    if (W.boss && !W.boss.dead) G.updateBoss(W.boss, dt);
    // đạn
    for (const o of W.projs) {
      o.t -= dt;
      if (o.homing) {
        const dx = P.x - o.x, dy = P.y - o.y, d = Math.max(1, Math.hypot(dx, dy));
        o.vx += ((dx / d) * o.homing - o.vx) * dt * 2.5;
        o.vy += ((dy / d) * o.homing - o.vy) * dt * 2.5;
      }
      o.x += o.vx * dt; o.y += o.vy * dt;
      if (o.team === 'player') {
        for (const e of G.targets()) {
          if (o.seen.includes(e)) continue;
          if (Math.abs(e.x - o.x) < e.r + 4 && Math.abs(e.y - o.y) < e.hr + 7) {
            o.seen.push(e);
            playerHit(e, o.mult, { w: o.w, ranged: true, heavy: o.big, dir: o.vx < 0 ? -1 : 1 });
            if (G.moves) G.moves.arrowHit(o, e);
            P.mana = Math.min(P.maxmana, P.mana + P.manaHit + (G.wHas(o.w, 'mana') ? 1 : 0));
            G.sfx('hit', 1.3);
            if (o.pierce > 0) o.pierce--; else { o.t = 0; break; }
          }
        }
        for (const pr of W.props) if (pr.env && !pr.used && Math.abs(pr.x - o.x) < 8 && Math.abs(pr.y - o.y) < 10) { G.triggerProp(pr); o.t = 0; }
      } else if (Math.abs(P.x - o.x) < 7 && Math.abs(P.y - o.y) < 8) {
        if (G.hurtPlayer(o.dmg, o.el, null, false) || P.inv <= 0) o.t = 0;
      }
      if (o.x < -30 || o.x > W.w + 30) o.t = 0;
    }
    W.projs = W.projs.filter((o) => o.t > 0);
    // vùng nguy hiểm và vũng
    for (const z of W.zones) {
      if (z.wave) {
        if (z.wait > 0) { z.wait -= dt; continue; } // sóng đứng yên báo trước rồi mới tràn tới
        z.x += z.vx * dt;
        if (!z.hit && Math.abs(P.x - z.x) < 6 && (P.y < z.g0 || P.y > z.g1)) { if (G.hurtPlayer(z.dmg, z.el, null, false)) z.hit = true; }
        if (z.x < -20) z.dead = true;
        continue;
      }
      if (z.t > 0) {
        z.t -= dt;
        if (z.t <= 0) {
          if (z.team !== 'player' && z.team !== 'fx' && G.inZone(z, P)) G.hurtPlayer(z.dmg, z.el, null, false);
          if (z.onFire) z.onFire(z);
          if (z.then) { z.pool = true; z.life = z.then; z.tick = 0.4; }
          FX('zoneFire', z);
          W.shake = Math.max(W.shake, 0.06);
        }
        continue;
      }
      z.life -= dt;
      if (z.pool) {
        z.tick -= dt;
        if (z.tick <= 0) {
          if (z.team === 'player') {
            if (z.rain) {
              z.tick = 0.15;
              for (const e of G.targets()) if (Math.hypot(e.x - z.x, (e.y - z.y) * 1.6) < z.r + e.r) playerHit(e, 0.5, { w: z.w, ranged: true, rain: true });
              const rx = z.x + G.rr(-30, 30), ry = z.y + G.rr(-12, 12); // vẫn rút hai số ngẫu nhiên như trước
              FX('rainDrop', rx, ry, z.el);
            } else {
              z.tick = z.every || 1;
              for (const e of G.targets()) if (Math.hypot(e.x - z.x, (e.y - z.y) * 1.6) < z.r + e.r) G.applyStatus(e, z.el, z.src, 1);
            }
          } else {
            z.tick = 0.5;
            if (G.inZone(z, P)) G.hurtPlayer(z.dmg * 0.3, z.el, null, false);
          }
        }
        if (z.heal && G.inZone(z, P)) P.hp = Math.min(P.maxhp, P.hp + P.maxhp * 0.03 * dt);
      }
      if (z.life <= 0) z.dead = true;
    }
    W.zones = W.zones.filter((z) => !z.dead);
    if (G.moves) G.moves.update(W, dt); // sóng chấn động, đòn hẹn giờ của js/moves.js
    // bẫy của Thợ Săn
    for (const pr of W.props) {
      if (pr.type !== 'trap' || pr.dead) continue;
      pr.t -= dt;
      if (pr.t <= 0) { pr.dead = true; continue; }
      for (const e of G.targets()) {
        if (Math.abs(e.x - pr.x) < 10 + e.r * 0.5 && Math.abs(e.y - pr.y) < 9 + e.hr * 0.5) {
          pr.dead = true;
          e.st.root = e.isBoss ? 0.8 : 2;
          const src = G.pDamage(P, pr.w);
          if (pr.el) G.applyStatus(e, pr.el, src, pr.el === 'fire' ? 1 : 2);
          G.damage(e, src * 1.5, { el: pr.el, src: 'trap', w: pr.w });
          G.sfx('hit', 0.6);
          FX('trapSnap', pr, e);
          break;
        }
      }
    }
    W.props = W.props.filter((p) => !p.dead);
    W.ents = W.ents.filter((e) => !e.dead);
    // hạt, chữ, vệt chém
    for (const o of W.parts) { o.t -= dt; o.x += o.vx * dt; o.y += o.vy * dt; o.vy += 90 * dt; }
    W.parts = W.parts.filter((o) => o.t > 0);
    for (const o of W.texts) { o.t -= dt; o.y -= 22 * dt; }
    W.texts = W.texts.filter((o) => o.t > 0);
    for (const o of W.slashes) o.t -= dt;
    W.slashes = W.slashes.filter((o) => o.t > 0);
    if (W.shake > 0) W.shake -= dt;
    if (W.banner) { W.banner.t -= dt; if (W.banner.t <= 0) W.banner = null; }
    // Trong phòng trùm cố định, đặt người chơi lệch trái để thấy rõ phía trùm.
    const lead = W.boss && !W.boss.dead && W.boss.kind !== 'ho' ? 150 : G.W / 2;
    const camTo = G.clamp(P.x - lead, 0, Math.max(0, W.w - G.W));
    W.cam += (camTo - W.cam) * Math.min(1, dt * 6);
    if (!G.noRender && G.fx && G.fx.update) G.fx.update(dt);
  };

  // ---------- vẽ ----------
  // Tham số vẽ hero. fx.js cũng dùng để vẽ bóng mờ ở vị trí cũ.
  G.heroArgs = function (P) {
    const w = curW(P);
    return {
      p: P, // hero_art.js đọc thêm trạng thái hoạt ảnh từ đây (chỉ đọc)
      x: P.x, y: P.y, face: P.face, key: P.key, move: P.moving, t: P.t,
      atk: P.atkT > 0 ? 1 - P.atkT / P.atkDur : -1, dodge: P.dodgeT > 0 ? 1 - P.dodgeT / 0.27 : -1,
      flash: P.hurtT > 0, alpha: P.inv > 0 && P.dodgeT <= 0 && Math.floor(G.time * 20) % 2 ? 0.5 : null,
      weapon: Object.assign({}, w, { coat: P.coats[w.id] && P.coats[w.id].t > 0 ? P.coats[w.id].el : null }),
      helm: P.helm, armor: P.armor, gong: P.gongT > 0,
      roundShadow: !!W.geo, // phòng vuông nhìn từ trên: bóng đổ tròn
    };
  };
  // Thứ tự lớp: nền, vùng và vũng, hiệu ứng sát đất, nhân vật (kèm hiệu ứng bám theo), đạn, hiệu ứng phía trên, rồi lớp giao diện.
  G.drawWorld = function (reg) {
    const c = G.wx, A = G.art, P = W.P;
    const F = G.noRender ? null : G.fx;
    const cam = Math.round(W.cam);
    let sx = 0, sy = 0;
    if (F && F.shakeOffset) { const o = F.shakeOffset(); sx = o.x; sy = o.y; }
    else if (W.shake > 0) { sx = Math.round(Math.random() * 4 - 2); sy = Math.round(Math.random() * 2 - 1); }
    c.setTransform(1, 0, 0, 1, 0, 0);
    A.bg(c, reg, W.seed, cam, W.w, W.shrink);
    c.setTransform(1, 0, 0, 1, -cam + sx, sy);
    for (const z of W.zones) {
      if (F && F.zone && F.zone(c, z, W)) continue;
      if (z.wave) {
        // lúc còn báo trước thì sóng mờ và nhấp nháy, khe hở nhìn thấy ngay
        const wc = z.wait > 0 ? 'rgba(160,220,250,' + (Math.floor(G.time * 10) % 2 ? 0.3 : 0.5) + ')' : 'rgba(160,220,250,0.85)';
        A.p(c, Math.round(z.x) - 3, W.y0 - 6, 6, z.g0 - W.y0 + 6, wc);
        A.p(c, Math.round(z.x) - 3, z.g1, 6, G.H - z.g1, wc);
      } else if (z.team === 'fx') A.ellipse(c, z.x, z.y, z.r, z.r * (G.ZK || 0.6), 'rgba(255,240,200,0.35)');
      else A.zone(c, z);
    }
    if (F && F.drawGround) F.drawGround(c);
    const ent = F && F.entity, rec = F && F.recoil;
    const list = [];
    for (const e of W.ents) {
      list.push({ y: e.y, f: () => {
        const k = rec ? rec(e) : 0; // giật lùi khi trúng đòn: chỉ dời hình
        if (k) c.translate(k, 0);
        if (e.illusion) A.boss(c, e); else A.enemy(c, e);
        if (k) c.translate(-k, 0);
        if (ent) ent(c, e);
      } });
    }
    for (const pr of W.props) list.push({ y: pr.y - (pr.type === 'door' ? 200 : 0), f: () => A.prop(c, pr) });
    if (W.boss && !W.boss.dead) {
      const b = W.boss;
      list.push({ y: b.y + (b.kind === 'moc' ? -30 : 0), f: () => {
        const k = rec ? rec(b) : 0;
        if (k) c.translate(k, 0);
        if (b.kind === 'mini') A.enemy(c, b); else A.boss(c, b);
        if (k) c.translate(-k, 0);
        if (!b.hidden) A.status(c, b, Math.round(b.x), Math.round(b.y - b.h - 6));
        if (ent) ent(c, b);
      } });
    }
    list.push({ y: P.y, f: () => { A.hero(c, G.heroArgs(P)); if (ent) ent(c, P); } });
    if (F && F.sorted) F.sorted(list, c);
    list.sort((a, b) => a.y - b.y);
    for (const o of list) o.f();
    if (!ent) {
      if (P.st.fire > 0) { A.p(c, Math.round(P.x) - 3, Math.round(P.y) - 38, 2, 3, '#ff7a2a'); A.p(c, Math.round(P.x) + 1, Math.round(P.y) - 40, 2, 4, '#ffd23f'); }
      if (P.st.poison > 0) A.p(c, Math.round(P.x) - 2, Math.round(P.y) - 38, 3, 3, '#6fcf3a');
      if (P.st.ice > 0) A.p(c, Math.round(P.x) - 5, Math.round(P.y) - 2, 10, 2, '#7fd4ff');
    }
    const pj = F && F.proj;
    for (const o of W.projs) { if (pj) pj(c, o); A.proj(c, o); }
    for (const s of W.slashes) A.slash(c, s);
    for (const o of W.parts) A.p(c, Math.round(o.x), Math.round(o.y), o.s, o.s, o.col);
    if (F && F.drawOver) F.drawOver(c);
    c.setTransform(1, 0, 0, 1, 0, 0);
    // chữ sát thương vẽ ở lớp giao diện cho nét
    for (const o of W.texts) G.ui.text(o.s, o.x - cam, o.y, { size: o.size, align: 'center', color: o.col, bold: true });
    if (F && F.drawUI) F.drawUI(cam);
  };
})();

  G.MOVE_TIPS = {
    sword: 'Kiếm: bấm Đánh liên tiếp ra chuỗi 3 nhát. Đánh ngay sau khi Né để lướt chém.',
    bow: 'Cung: bấm để bắn nhanh. Giữ Đánh để giương cung, thả ra bắn tên mạnh xuyên quái.',
    spear: 'Giáo: bấm Đánh liên tiếp để đâm rồi quét vòng. Giữ rồi thả để lao tới.',
    hammer: 'Búa: giữ Đánh để lấy đà, thả ra nện đất gây chấn động. Đủ 2 nấc thì làm choáng.',
  };
  const C = G.MOVES, HE = G.HE;

  // ---------- trạng thái đòn đánh trên người chơi (P.mv) ----------
  // Lớp vẽ nào cũng đọc được: name (tên đòn), step (nhịp trong chuỗi), chain (đã đánh mấy nhịp),
  // charge (tỉ lệ lấy đà 0..1), level (nấc lấy đà), prog (tiến độ đòn 0..1), holding (đang giữ để lấy đà).
  function st(P) {
    if (!P.mv) {
      P.mv = {
        name: '', kind: '', step: 0, chain: 0, charge: 0, level: 0, prog: 0, holding: false,
        holdT: 0, wasHeld: false, relP: false, buf: 0, pressBuf: 0, chargeT: 0, fullT: 0,
        afterDodge: 0, wasDodge: false, wid: null, cur: null, lastT: -9, gap: 0.45, dashDur: 0, tips: {}, tipWait: null,
      };
    }
    return P.mv;
  }
  M.state = st;
  function cancel(mv) { mv.holding = false; mv.charge = 0; mv.level = 0; mv.chargeT = 0; mv.fullT = 0; }
  const reachOf = (w, r) => r * (G.wHas(w, 'reach') ? 1.15 : 1);
  // Mức hiệu ứng hệ của vũ khí: null nếu đòn đang không mang hệ. lv 1..3 theo mốc Mầm, Thành hình, Thức tỉnh.
  function heOf(P, w) {
    const el = G.activeEl(P, w);
    if (!el) return null;
    return { el, lv: w.branch === el ? Math.max(1, G.wStage(w)) : 1 };
  }
  M.heOf = heOf;
  const has1 = (h) => !!h && h.lv >= HE.f1; // đã mở đặc trưng 1 (Thành hình)
  const has2 = (h) => !!h && h.lv >= HE.f2; // đã mở đặc trưng 2 (Thức tỉnh)

  function tip(P, mv, w, W) {
    if (mv.tips[w.type] || !G.MOVE_TIPS[w.type]) return;
    if (W.banner && !W.banner.tip) { mv.tipWait = w.type; return; } // đang có thông báo khác: chờ nó tắt
    mv.tips[w.type] = true; mv.tipWait = null;
    W.banner = { s: G.MOVE_TIPS[w.type], col: '#ffd27a', t: 5, tip: true };
  }

  // Gọi mỗi khung cho người chơi, kể cả lúc đang lăn né hay lướt: theo dõi nút Đánh được bấm, giữ, thả.
  M.input = function (P, inp, dt) {
    const mv = st(P), w = G.curW(P), W = G.getWorld();
    const held = !!(inp.atk || inp.atkP);
    mv.relP = !held && mv.wasHeld;
    if (held && !mv.wasHeld) { mv.holdT = 0; mv.pressBuf = C.buffer; }
    if (held) mv.holdT += dt;
    if (mv.relP && !mv.holding) mv.buf = C.buffer;
    mv.wasHeld = held;
    if (mv.buf > 0 && !mv.relP) mv.buf -= dt;
    if (mv.pressBuf > 0 && !held) mv.pressBuf -= dt;
    if (mv.afterDodge > 0) mv.afterDodge -= dt;
    if (P.dodgeT > 0) mv.wasDodge = true;
    else if (mv.wasDodge) { mv.wasDodge = false; mv.afterDodge = C.sword.glide.win; }
    if (P.dashOpt && !(P.dashT > 0)) P.dashOpt = null;
    if (!w) return;
    if (mv.wid !== w.id) { if (mv.wid != null) P.hitDone = true; mv.wid = w.id; cancel(mv); mv.chain = 0; mv.buf = 0; mv.cur = null; tip(P, mv, w, W); } // đổi vũ khí giữa chừng: bỏ nhát đang vung dở
    else if (mv.tipWait && !W.banner) tip(P, mv, w, W);
    // lăn né, lướt, tung đòn đặc biệt hay kỹ năng thì bỏ phần đà đang lấy
    if (mv.holding && (P.dodgeT > 0 || P.dashT > 0 || P.specT > 0 || P.castT > 0 || P.dead)) cancel(mv);
    if (mv.chain > 0 && !(P.atkT > 0) && G.time - mv.lastT > mv.gap) mv.chain = 0;
    const busy = P.atkT > 0 || P.dashT > 0;
    mv.prog = P.atkT > 0 ? 1 - P.atkT / P.atkDur : P.dashT > 0 && mv.dashDur > 0 ? G.clamp(1 - P.dashT / mv.dashDur, 0, 1) : 0;
    if (!busy && !mv.holding) { mv.name = ''; mv.kind = ''; }
  };
  // Đi chậm lại trong lúc lấy đà
  M.speed = function (P) {
    const mv = P.mv;
    if (!mv || !mv.holding) return 1;
    const cfg = C[G.curW(P).type];
    return cfg && cfg.charge ? cfg.charge.slow : 1;
  };

  function aim(P, reach, maxDy) {
    const tgt = G.cb.nearest(P, reach + 34, maxDy, false);
    if (tgt && Math.abs(tgt.x - P.x) > 3) P.face = tgt.x > P.x ? 1 : -1;
  }
  // Bắt đầu một nhát: phase > 0 là vào thẳng giữa động tác (dùng khi thả đòn đã lấy đà sẵn).
  function begin(P, w, o, dur, phase) {
    const mv = P.mv;
    P.atkDur = dur; P.atkT = dur * (1 - (phase || 0)); P.cdT = P.atkT; P.hitDone = false; P.lastAtk = G.time;
    P.comboI = o.pose || 0;
    mv.name = o.name; mv.kind = o.kind; mv.step = o.step || 0; mv.cur = o; mv.lastT = G.time + P.atkT;
    G.sfx('swing', w.type === 'hammer' ? 0.6 : 1);
  }
  function gain(P, w, n) {
    if (n <= 0) return;
    P.mana = Math.min(P.maxmana, P.mana + P.manaHit + (G.wHas(w, 'mana') ? 1 : 0));
    G.sfx('hit');
  }
  // Đánh mọi quái trong hộp trước mặt. Trả về danh sách quái trúng đòn.
  function boxHit(P, reach, depth, mult, o) {
    const f = P.face, out = [];
    for (const e of G.targets()) {
      const dx = (e.x - P.x) * f;
      if (dx > -8 - e.r * 0.5 && dx < reach + e.r && Math.abs(e.y - P.y) <= depth / 2 + e.hr) { G.cb.playerHit(e, mult, o); out.push(e); }
    }
    G.cb.hitProps(Math.min(P.x, P.x + f * reach) - 4, Math.max(P.x, P.x + f * reach) + 4, P.y, depth / 2 + 6);
    return out;
  }
  function push(list, dx) {
    for (const e of list) if (!e.dead && !e.isBoss) e.x += dx;
  }
  function swingFx(P, w, o, extra) {
    if (G.noRender) return;
    const h = heOf(P, w);
    const info = Object.assign({ type: w.type, move: o.kind, name: o.name, step: o.step || 0, combo: o.pose || 0, reach: o.reach || 0, depth: o.depth || 0, el: h ? h.el : null, lv: h ? h.lv : 0, stage: G.wStage(w) }, extra || {});
    if (G.fx && G.fx.mvSwing) FX('mvSwing', P, info); else FX('swing', P, info);
  }

  // ---------- kiếm ----------
  function swordChain(P, w) {
    const mv = P.mv, i = mv.chain % 3, m = C.sword.chain[i];
    aim(P, reachOf(w, m.reach), 22);
    begin(P, w, { kind: 'chem', name: m.name, step: i, pose: i, m, reach: reachOf(w, m.reach), depth: m.depth }, m.dur);
    mv.chain = i + 1; mv.gap = C.sword.gap;
  }
  function swordGlide(P, w) {
    const mv = P.mv, g = C.sword.glide;
    mv.afterDodge = 0;
    aim(P, g.len + 20, 22);
    P.dashT = g.t; P.dashV = (g.len / g.t) * P.face; P.dashHit = []; P.dashMult = g.mult; P.dashStun = 0; P.dashOpt = { stun: 0 };
    P.atkT = g.t; P.atkDur = g.t; P.cdT = g.t + 0.08; P.hitDone = true; P.lastAtk = G.time; P.comboI = 0;
    mv.name = g.name; mv.kind = 'luot'; mv.step = 0; mv.cur = null; mv.dashDur = g.t;
    mv.chain = 1; mv.gap = C.sword.gap; mv.lastT = G.time + g.t; // nhát lướt thay cho nhát đầu của chuỗi
    G.sfx('swing', 1.3);
    swingFx(P, w, { kind: 'luot', name: g.name, reach: g.len + 14, depth: 24 });
  }

  // ---------- cung ----------
  function shoot(P, w, o) {
    const W = G.getWorld(), h = heOf(P, w);
    const col = h ? G.EL[h.el].col : '#f1ead9';
    const tgt = G.cb.nearest(P, o.range + 10, 44, true);
    let vy = 0;
    if (tgt) vy = G.clamp(((tgt.y - P.y) / Math.max(20, Math.abs(tgt.x - P.x))) * o.speed, -90, 90);
    W.projs.push({ team: 'player', kind: 'arrow', x: P.x + P.face * 8, y: P.y, vx: P.face * o.speed, vy, t: o.range / o.speed, w, mult: o.mult, pierce: (o.pierce || 0) + (has1(h) && h.el === 'ice' ? HE.ice.pierce : 0), big: !!o.big, col, seen: [], he: h, charged: o.charged || 0 });
  }
  function bowTap(P, w) {
    const s = C.bow.shot;
    aim(P, s.range, 44);
    // đứng yên thì giương nhanh hơn một chút so với vừa chạy vừa bắn
    begin(P, w, { kind: 'ban', name: s.name, pose: 0, arrow: { mult: s.mult, speed: s.speed, range: s.range } }, P.moving ? s.move : s.still);
  }
  function bowRelease(P, w, c) {
    const ch = C.bow.charge, full = c >= 1;
    aim(P, ch.range, 44);
    const o = { kind: 'banManh', name: ch.name, pose: 2, charge: c };
    begin(P, w, o, ch.recover, 0.43); // dây cung đã căng sẵn: buông tên ngay
    P.hitDone = true;
    shoot(P, w, { mult: ch.mult0 + (ch.mult1 - ch.mult0) * c, speed: ch.speed, range: ch.range * (0.7 + 0.3 * c), pierce: full ? 4 : c > 0.6 ? 2 : 1, big: true, charged: c });
    swingFx(P, w, o, { charge: c });
  }

  // ---------- giáo ----------
  function spearTap(P, w) {
    const mv = P.mv, i = mv.chain % 4, m = C.spear.chain[i];
    aim(P, reachOf(w, m.reach || m.r), 22);
    if (m.sweep) begin(P, w, { kind: 'quet', name: m.name, step: i, pose: 3, m, reach: reachOf(w, m.r) }, m.dur);
    else begin(P, w, { kind: 'dam', name: m.name, step: i, pose: i, m, reach: reachOf(w, m.reach), depth: m.depth }, m.dur);
    mv.chain = i + 1; mv.gap = C.spear.gap;
  }
  function spearLunge(P, w, c) {
    const mv = P.mv, ch = C.spear.charge;
    aim(P, ch.len1 + 10, 22);
    const len = ch.len0 + (ch.len1 - ch.len0) * c;
    P.dashT = ch.t; P.dashV = (len / ch.t) * P.face; P.dashHit = []; P.dashMult = ch.mult0 + (ch.mult1 - ch.mult0) * c; P.dashStun = 0;
    P.dashOpt = { stun: 0, heavy: c >= 1 };
    P.inv = Math.max(P.inv, ch.t); // đang xuyên qua quái thì không dính đòn
    P.atkT = ch.t; P.atkDur = ch.t; P.cdT = ch.t + 0.2; P.hitDone = true; P.lastAtk = G.time; P.comboI = 2;
    mv.name = ch.name; mv.kind = 'xoc'; mv.step = 0; mv.cur = null; mv.dashDur = ch.t; mv.chain = 0; mv.lastT = G.time + ch.t;
    G.sfx('swing', 1.4);
    swingFx(P, w, { kind: 'xoc', name: ch.name, reach: len, depth: ch.depth }, { charge: c });
    if (c >= 0.5) finish(P, w, { x: P.x, y: P.y, dir: P.face, power: 0.5 + 0.5 * c, line: len });
  }

  // ---------- búa ----------
  function hammerTap(P, w) {
    const m = C.hammer.swing;
    aim(P, reachOf(w, m.reach), 22);
    begin(P, w, { kind: 'nen', name: m.name, pose: 0, m, reach: reachOf(w, m.reach), depth: m.depth }, m.dur);
  }
  function hammerRelease(P, w, c, lv) {
    const ch = C.hammer.charge, sl = ch.slam[lv];
    if (!sl) { hammerTap(P, w); return; }
    aim(P, 40, 22);
    begin(P, w, { kind: 'nenDat', name: sl.name, pose: 2, level: lv, sl }, ch.recover, 0.36); // búa đã giơ sẵn: nện xuống ngay
  }
  function hammerSlam(P, w, o) {
    const W = G.getWorld(), ch = C.hammer.charge, sl = o.sl, f = P.face;
    const r = reachOf(w, sl.r), cx = G.clamp(P.x + f * ch.ahead, W.x0, W.x1), cy = P.y;
    let n = 0;
    for (const e of G.targets()) {
      if (Math.hypot(e.x - cx, (e.y - cy) * 1.5) < r + e.r) { G.cb.playerHit(e, sl.mult, { w, stun: sl.stun, heavy: true, dir: e.x >= P.x ? 1 : -1 }); n++; }
    }
    G.cb.hitProps(cx - r, cx + r, cy, r * 0.66);
    // sóng chấn động chạy trên mặt đất theo hướng đánh
    (W.mvWaves || (W.mvWaves = [])).push({ x: cx, y: cy, dir: f, left: sl.wave.len, v: ch.waveV, depth: ch.waveDepth, mult: sl.wave.mult, stun: sl.wave.stun, w, seen: [], level: o.level, he: heOf(P, w) });
    W.shake = Math.max(W.shake, o.level >= 2 ? 0.3 : 0.16);
    G.sfx('boom', o.level >= 2 ? 1.5 : 1.9);
    swingFx(P, w, o, { level: o.level, x: cx, y: cy, r });
    finish(P, w, { x: cx, y: cy, dir: f, power: o.level >= 2 ? 1.3 : 0.8 });
    gain(P, w, n);
  }

  // ---------- nút Đánh ----------
  const TAPS = { bow: bowTap, spear: spearTap, hammer: hammerTap };
  const RELEASES = { bow: bowRelease, spear: spearLunge, hammer: hammerRelease };
  function levelOf(ch, t) {
    if (ch.lv1 != null) return t >= ch.time ? 2 : t >= ch.lv1 ? 1 : 0;
    return t >= ch.time ? 1 : 0;
  }
  function release(P, w, cfg) {
    const mv = P.mv, c = mv.charge, lv = mv.level;
    cancel(mv);
    if (c < cfg.charge.min) { TAPS[w.type](P, w); return; }
    RELEASES[w.type](P, w, c, lv);
  }
  // Gọi khi người chơi đang rảnh tay (không né, không lướt, không vừa bấm đòn đặc biệt hay kỹ năng).
  M.act = function (P, inp, dt) {
    const mv = st(P), w = G.curW(P), cfg = C[w.type];
    const held = mv.wasHeld, can = P.cdT <= 0;
    if (!cfg) { // vũ khí chưa có lối đánh riêng: đánh kiểu cũ
      if (held && can) { mv.cur = null; G.cb.startAttack(P); }
      return;
    }
    if (!cfg.charge) { // kiếm: bấm hoặc giữ đều ra chuỗi
      if ((held || mv.pressBuf > 0) && can) {
        mv.pressBuf = 0;
        if (mv.afterDodge > 0 && cfg.glide) swordGlide(P, w); else swordChain(P, w);
      }
      return;
    }
    const ch = cfg.charge;
    if (mv.holding) {
      if (!held) { release(P, w, cfg); return; }
      const lv0 = mv.level;
      mv.chargeT += dt;
      mv.charge = Math.min(1, mv.chargeT / ch.time);
      mv.level = levelOf(ch, mv.chargeT);
      if (mv.level > lv0) { G.sfx('pick', 0.9 + 0.3 * mv.level); FX('mvCharge', P, mv.level); }
      if (mv.charge >= 1) { mv.fullT += dt; if (mv.fullT >= C.hold) release(P, w, cfg); }
      return;
    }
    if (held && mv.holdT >= C.tap && can) {
      mv.holding = true; mv.chargeT = 0; mv.charge = 0; mv.level = 0; mv.fullT = 0; mv.buf = 0;
      mv.name = ch.name; mv.kind = 'layDa';
    } else if (mv.buf > 0 && can) {
      mv.buf = 0;
      TAPS[w.type](P, w);
    }
  };

  // Thời điểm đòn chạm (gần giữa động tác): gây sát thương theo đòn đang ra.
  M.hit = function (P) {
    const mv = st(P), o = mv.cur, w = G.curW(P);
    if (!o) { G.cb.doHit(P); return; }
    P.hitDone = true;
    if (o.kind === 'chem') {
      const m = o.m;
      const list = boxHit(P, o.reach, o.depth, m.mult, { w, heavy: !!m.heavy });
      if (m.push) push(list, P.face * m.push);
      swingFx(P, w, o);
      if (m.finish) finish(P, w, { x: P.x + P.face * o.reach * 0.6, y: P.y, dir: P.face, power: 1 });
      gain(P, w, list.length);
    } else if (o.kind === 'ban') {
      shoot(P, w, o.arrow);
    } else if (o.kind === 'dam' || o.kind === 'nen') {
      const list = boxHit(P, o.reach, o.depth, o.m.mult, { w });
      swingFx(P, w, o);
      if (o.kind === 'nen') G.getWorld().shake = Math.max(G.getWorld().shake, 0.08);
      gain(P, w, list.length);
    } else if (o.kind === 'quet') {
      // quét một vòng quanh người: trúng cả quái sau lưng, hất nhẹ ra ngoài
      const m = o.m, list = [];
      for (const e of G.targets()) {
        if (Math.hypot(e.x - P.x, (e.y - P.y) * 1.5) < o.reach + e.r) { G.cb.playerHit(e, m.mult, { w, heavy: true, dir: e.x >= P.x ? 1 : -1 }); list.push(e); }
      }
      G.cb.hitProps(P.x - o.reach, P.x + o.reach, P.y, o.reach * 0.66);
      for (const e of list) if (!e.dead && !e.isBoss) e.x += (e.x >= P.x ? 1 : -1) * m.push;
      swingFx(P, w, o);
      finish(P, w, { x: P.x + P.face * 10, y: P.y, dir: P.face, power: 1, round: true });
      gain(P, w, list.length);
    } else if (o.kind === 'nenDat') {
      hammerSlam(P, w, o);
    }
  };

  // ---------- luật riêng của từng hệ ----------
  // Sát thương phụ của hệ: vẫn qua G.damage nên được tính vào thống kê hệ và đánh xa/gần của trùm, và kết liễu vẫn cho dấu ấn.
  function heDamage(e, amt, el, w, ranged) {
    if (!e.dead) G.damage(e, amt, { el, src: 'hit', ranged: !!ranged, w });
  }
  function around(x, y, r, fn, skip) {
    for (const e of G.targets()) if (e !== skip && Math.hypot(e.x - x, (e.y - y) * 1.5) < r + e.r) fn(e);
  }
  // Vũng nằm lại trên đất (vệt cháy, màn khói độc): dùng đúng loại vũng "pool" sẵn có của combat.js.
  function heZone(W, x, y, r, life, el, src, every, extra) {
    const mine = W.zones.filter((z) => z.he);
    if (mine.length >= HE.maxZones) mine[0].dead = true;
    const z = Object.assign({ shape: 'circle', x: G.clamp(x, W.x0, W.x1), y: G.clamp(y, W.y0, W.y1), r, t: 0, pool: true, team: 'player', el, life, tick: 0.2, every, src, he: true }, extra || {});
    W.zones.push(z);
    return z;
  }
  // ĐẶC TRƯNG 1 (từ Thành hình): nhát kết chuỗi, đòn giữ rồi thả và đòn đặc biệt để lại thứ của hệ trên sân.
  // o: { x, y, dir, power, line (độ dài đường lao), round (toả quanh người), ranged }
  function finish(P, w, o) {
    const h = heOf(P, w);
    if (!has1(h)) return; // Mầm chưa có luật hệ
    const W = G.getWorld(), D = G.pDamage(P, w), k = o.power || 1;
    const info = { x: o.x, y: o.y, dir: o.dir, power: o.power || 1, line: o.line || 0, round: !!o.round, r: 0, pts: [] };
    if (h.el === 'fire') {
      // nổ nhỏ lan ra, rồi để lại vệt cháy trên đất
      const F = HE.fire, r = F.blastR, tr = F.trailR, life = F.trailLife;
      info.r = r;
      if (o.line) {
        const n = Math.max(2, Math.round(o.line / 24));
        for (let i = 0; i < n; i++) {
          const x = o.x + o.dir * ((i + 0.5) * o.line) / n;
          around(x, o.y, tr, (e) => { if (!info.hit || !info.hit.includes(e)) { (info.hit || (info.hit = [])).push(e); heDamage(e, D * F.blast * k, 'fire', w, o.ranged); } });
          heZone(W, x, o.y, tr - 2, life, 'fire', D * F.trailSrc, F.trailEvery);
          info.pts.push(x);
        }
      } else {
        around(o.x, o.y, r, (e) => heDamage(e, D * F.blast * k, 'fire', w, o.ranged));
        heZone(W, o.x, o.y, tr, life, 'fire', D * F.trailSrc, F.trailEvery);
      }

          an.rows.push({ y: zy + ROW / 2, t: an.t, fire: 0.85, dir: an.rows.length % 2 ? 1 : -1 });
          G.zoneRect(w.x0 - 9, zy, w.x1 - w.x0 + 18, ROW, 0.85, b.dmg * 1.35, 'ice', {
            fxKind: 'charge',
            onFire: (z) => { for (let k = 0; k < 8; k++) G.burst(w.x0 + k * (w.x1 - w.x0) / 7, z.y + ROW / 2, '#9fd0e8', 4, 60); G.sfx('boom', 1.2); },
          });
          if (has(b, 'antiDodge') && i === n - 1) later(b, 0.45, () => {
            const zy2 = G.clamp(P.y, w.y0 + 8, w.y1 - 8) - ROW / 2;
            an.rows.push({ y: zy2 + ROW / 2, t: an.t, fire: 0.6, dir: an.rows.length % 2 ? 1 : -1 });
            G.zoneRect(w.x0 - 9, zy2, w.x1 - w.x0 + 18, ROW, 0.6, b.dmg * 1.2, 'ice', { fxKind: 'charge' });
          });
        });
      }
      later(b, 0.3 + n * 0.95 + 0.6, () => { b.hidden = false; b.exposed = 2.6; });
    } else if (a === 'spout') {
      const n = ph >= 1 ? 6 : 4;
      const an = act(b, 'spout', 1.7, { shots: [] });
      for (let i = 0; i < n; i++) {
        const q = i === 0 ? [P.x, P.y] : near(P.x, P.y, 80, 34);
        G.zoneCircle(q[0], q[1], 17, 0.85 + i * 0.1, b.dmg, 'ice', { fxKind: 'spout', onFire: (z) => fx(b, 'column', z.x, z.y, 0.45) });
        an.shots.push({ x: q[0], y: q[1], land: 0.85 + i * 0.1 });
      }
      later(b, 1.5, () => {});
    } else if (a === 'wave') {
      const mk = () => {
        const g0 = G.rr(w.y0, w.y1 - GAP);
        w.zones.push({ wave: true, x: b.x - 50, vx: -150, wait: 0.9, g0, g1: g0 + GAP, dmg: b.dmg * 1.2, el: 'ice' });
      };
      mk();
      act(b, 'wave', ph >= 1 ? 2.3 : 1.4, { slaps: ph >= 1 ? [0.9, 1.8] : [0.9] }); // slaps: các lúc đuôi đập, sóng bắt đầu tràn
      if (ph >= 1) later(b, 0.9, mk);
      later(b, 2.4, () => {});
    } else if (a === 'dive') {
      b.hidden = true;
      const an = act(b, 'dive', 2.1, { dive: 0.3, fire: 1.15, up: 1.6, tx: null, ty: null }); // tx, ty: chỗ sẽ trồi lên
      later(b, 0.3, () => {
        an.tx = P.x; an.ty = P.y;
        G.zoneCircle(P.x, P.y, 30, 0.85, b.dmg * 1.4, 'ice', { fxKind: 'emerge', onFire: (z) => G.burst(z.x, z.y, '#9fd0e8', 20, 90) });
      });
      later(b, 1.6, () => { b.hidden = false; });
    } else {
      b.spikes = true;
      act(b, 'spikes', 1.3, { fire: 0.9, zx: b.x - 34, zy: b.y, r: 68 });
      G.zoneCircle(b.x - 34, b.y, 68, 0.9, b.dmg, null, { fxKind: 'spikes', onFire: () => { b.spikes = false; } });
      later(b, 1.1, () => {});
    }
    b.cd = [1.6, 1.25, 0.95][ph];
  }
  function phaseNgu(b) {
    const w = W();
    if (b.phase === 1) { w.y0 += 24; w.y1 -= 24; }
    if (b.phase === 2) { w.x0 += 56; }
    w.shrink = { y0: w.y0 - 6, y1: w.y1 + 8, x0: b.phase >= 2 ? w.x0 - 8 : 0 };
    w.banner = { s: 'Nước dâng!', col: '#7fd4ff', t: 2 };
  }

  // ---------- Hồ Tinh ----------
  function thinkHo(b) {
    const w = W(), P = w.P, ph = b.phase;
    const opts = ['pounce', 'pounce', 'fox', 'nova'];
    if (w.ents.filter((e) => e.illusion && !e.dead).length < 2) opts.push('illusion');
    const a = choose(b, opts);
    G.sfx('warn', 1.2);
    if (a === 'pounce') {
      const go = (tele) => {
        const tx = P.x, ty = P.y;
        // fx, fy: chỗ lấy đà; tx, ty: chỗ sẽ đáp (b.x, b.y chỉ đổi lúc vùng nổ, hình vẽ bay trước theo cung)
        act(b, 'pounce', tele + 0.45, { fire: tele, fx: b.x, fy: b.y, tx: G.clamp(tx + (b.x < tx ? -8 : 8), w.x0, w.x1), ty });
        G.zoneCircle(tx, ty, 24, tele, b.dmg * 1.15, null, {
          fxKind: 'pounce',
          onFire: () => { b.x = G.clamp(tx + (b.x < tx ? -8 : 8), w.x0, w.x1); b.y = ty; b.exposed = 2.0; G.burst(tx, ty, '#ffffff', 10, 60); },
        });
      };
      go(0.6);
      if (has(b, 'antiDodge')) later(b, 1.0, () => go(0.5));
      later(b, has(b, 'antiDodge') ? 2.6 : 2.0, () => {});
    } else if (a === 'fox') {
      const n = ph >= 1 ? 4 : 3;
      act(b, 'fox', 1.0, { n });
      for (let i = 0; i < n; i++) {
        const an = -1.2 + (i * 2.4) / (n - 1);
        w.projs.push({ team: 'enemy', kind: 'fire', x: b.x, y: b.y, vx: Math.cos(an) * 70 * b.face, vy: Math.sin(an) * 70, homing: 58, t: 3.6, dmg: b.dmg * 0.8, el: 'fire' });
      }
      later(b, 1.0, () => {});
    } else if (a === 'nova') {
      const el = w.stats.el;
      const top = G.ELS.slice().sort((x, y) => el[y] - el[x])[0];
      b.tailEl = el[top] > 0 ? top : 'fire';
      act(b, 'nova', 1.3, { fire: 0.8, el: b.tailEl, r: 62 });
      G.zoneCircle(b.x, b.y, 62, 0.8, b.dmg * 1.2, b.tailEl, { fxKind: 'nova' });
      later(b, 1.2, () => {});
    } else {
      G.burst(b.x, b.y, '#ffffff', 14, 70);
      const ox = b.x, oy = b.y;
      for (let i = 0; i < 2; i++) {
        if (w.ents.filter((e) => e.illusion && !e.dead).length >= 2) break;
        const q = near(P.x, P.y, 130, 40);
        w.ents.push({
          illusion: true, kind: 'ho', layers: b.layers, alpha: 0.7, x: q[0], y: q[1], r: 16, hr: 9, h: 36, hp: 1, maxhp: 1,
          st: G.st0(), dmg: b.dmg * 0.6, face: -1, t: 0, cd: ph >= 1 ? 1.2 : 99, tails: 9, add: true, role: 'illusion',
          speed: ph >= 1 ? 62 : 30, marks: 0, armor: 0, flash: 0, wind: 0, scale: 1, slamCd: 99,
          fromX: ox, fromY: oy, // chỗ tách ra, chỉ để vẽ
        });
      }
      const q = near(P.x, P.y, 150, 40);
      b.x = q[0]; b.y = q[1];
      act(b, 'illusion', 0.8, { fx: ox, fy: oy });
      later(b, 0.8, () => {});
    }
    b.cd = [1.5, 1.1, 0.8][ph];
  }
  function moveHo(b, dt) {
    const w = W(), P = w.P;
    if (b.seq.length || b.st.stun > 0 || b.st.root > 0) return;
    const dx = P.x - b.x || 0.01, dy = P.y - b.y, d = Math.hypot(dx, dy); // d không bao giờ bằng 0
    b.face = dx >= 0 ? 1 : -1;
    if (has(b, 'antiMelee') && d < 42 && b.hopCd <= 0 && b.exposed <= 0) {
      b.hopCd = 3.5;
      w.zones.push({ shape: 'circle', x: b.x, y: b.y, r: 24, t: 0, pool: true, team: 'enemy', el: 'fire', life: 3, tick: 0.3, dmg: b.dmg });
      act(b, 'hop', 0.4, { fx: b.x, fy: b.y, air: 0.28 });
      b.x = G.clamp(b.x - b.face * 100, w.x0, w.x1);
      return;
    }
    const want = 105;
    const sp = b.speed * Math.max(0.4, 1 - 0.15 * b.st.iceN);
    if (d > want + 20) { b.x += (dx / d) * sp * dt; b.y += (dy / d) * sp * 0.7 * dt; } else if (d < want - 30) { b.x -= (dx / d) * sp * 0.45 * dt; } // lùi chậm để người đánh gần còn đuổi kịp
    b.y += Math.sin(b.t * 1.7) * 18 * dt;
    b.x = G.clamp(b.x, w.x0, w.x1); b.y = G.clamp(b.y, w.y0, w.y1);
  }

  // ---------- trùm nhỏ ----------
  function thinkMini(b) {
    const w = W(), P = w.P, ph = b.phase;
    const d = Math.hypot(P.x - b.x, (P.y - b.y) * 1.5);
    const opts = ['slam', 'charge', 'burst'];
    if (adds() < 4) opts.push('summon');
    if (d < 44) opts.push('swipe', 'swipe');
    const a = choose(b, opts);
    G.sfx('warn');
    b.wind = 0.7;
    if (a === 'slam') {
      act(b, 'slam', 1.2, { fire: 0.8, tx: P.x, ty: P.y });
      G.zoneCircle(P.x, P.y, 30, 0.8, b.dmg * 1.3, b.el, { fxKind: 'slam', onFire: (z) => fx(b, 'quake', z.x, z.y, 0.4, { r: z.r }) });
      if (has(b, 'antiDodge')) later(b, 0.4, () => G.zoneCircle(G.clamp(P.x + P.ddx * 46, w.x0, w.x1), P.y, 26, 0.7, b.dmg, b.el, { fxKind: 'slam', onFire: (z) => fx(b, 'quake', z.x, z.y, 0.4, { r: z.r }) }));
      later(b, 1.1, () => {});
    } else if (a === 'charge') {
      const dir = P.x >= b.x ? 1 : -1, py = P.y;
      const x0 = Math.max(w.x0 - 6, dir > 0 ? b.x : b.x - 210), x1 = Math.min(w.x1 + 6, dir > 0 ? b.x + 210 : b.x);
      // fx, fy: chỗ lấy đà; hình vẽ lướt từ đó tới chỗ mới trong dash giây sau khi vùng nổ
      act(b, 'charge', 1.5, { fire: 0.8, dash: 0.2, dir, fx: b.x, fy: b.y, ty: py });
      G.zoneRect(x0, py - 12, x1 - x0, 24, 0.8, b.dmg * 1.4, b.el, {
        fxKind: 'charge',
        onFire: () => { b.x = G.clamp(b.x + dir * 190, w.x0 + 10, w.x1 - 10); b.y = py; G.sfx('boom'); b.exposed = 1.6; },
      });
      later(b, 2.2, () => {});
    } else if (a === 'burst') {
      const an = act(b, 'burst', 0.9 + (3 + ph) * 0.12 + 0.3, { shots: [], el: b.el });
      for (let i = 0; i < 3 + ph; i++) {
        const q = near(P.x, P.y, 70, 30);
        G.zoneCircle(q[0], q[1], 18, 0.9 + i * 0.12, b.dmg * 0.8, b.el, { then: 3, fxKind: 'burst', onFire: (z) => fx(b, 'splat', z.x, z.y, 0.4, { col: G.EL[b.el].col }) });
        an.shots.push({ x: q[0], y: q[1], land: 0.9 + i * 0.12 });
      }
      later(b, 1.3, () => {});
    } else if (a === 'summon') {
      for (let i = 0; i < 2; i++) G.spawnEnemy('swarm', b.x + G.rr(-20, 20), G.clamp(b.y + (i ? 24 : -24), w.y0, w.y1), { add: true });
      act(b, 'summon', 0.8);
      later(b, 0.6, () => {});
    } else {
      act(b, 'swipe', 1.0, { fire: 0.6, r: 38 });
      G.zoneCircle(b.x, b.y, 38, 0.6, b.dmg, b.el, { fxKind: 'swipe' });
      later(b, 0.9, () => {});
    }
    b.cd = [1.6, 1.3, 1.0][ph];
  }
  function moveMini(b, dt) {
    const w = W(), P = w.P;
    b.moving = false;
    if (b.seq.length || b.st.stun > 0 || b.st.root > 0) return;
    const dx = P.x - b.x, dy = P.y - b.y, d = Math.hypot(dx, dy);
    b.face = dx >= 0 ? 1 : -1;
    if (d > 44) {
      const sp = b.speed * Math.max(0.4, 1 - 0.15 * b.st.iceN);
      b.x += (dx / d) * sp * dt; b.y += (dy / d) * sp * 0.75 * dt;
      b.moving = true;
    }
    b.y = G.clamp(b.y, w.y0, w.y1);
  }

  G.updateBoss = function (b, dt) {
    const w = W();
    b.t += dt;
    if (b.flash > 0) b.flash -= dt;
    if (b.exposed > 0) b.exposed -= dt;
    if (b.wind > 0) b.wind -= dt;
    if (b.tpCd > 0) b.tpCd -= dt;
    if (b.hopCd > 0) b.hopCd -= dt;
    // đồng hồ hoạt ảnh
    if (b.anim) { b.anim.t += dt; if (b.anim.t >= b.anim.dur) b.anim = null; }
    if (b.fx && b.fx.length) { for (const f of b.fx) f.t += dt; b.fx = b.fx.filter((f) => f.t < f.d); }
    if (b.roarT > 0) b.roarT -= dt;
    G.tickStatus(b, dt);
    if (b.dead) return;
    const frac = b.hp / b.maxhp;
    const ph = frac > 0.6 ? 0 : frac > 0.3 ? 1 : 2;
    if (ph > b.phase) {
      b.phase = ph;
      if (b.kind === 'ngu') phaseNgu(b);
      if (b.kind === 'ho' && ph === 2) b.big = true;
      b.roarT = 1.2; b.roarPh = ph; // gầm khi đổi giai đoạn
      if (b.kind !== 'ngu') w.banner = { s: b.name + (ph === 1 ? ' nổi giận!' : ' hóa cuồng!'), col: '#ff6a5a', t: 2 };
      G.sfx('gong');
    }
    if (b.kind === 'ho') b.tails = Math.max(1, Math.ceil(9 * frac));
    if (b.kind === 'moc') {
      const stopX = b.homeX - 56; // giai đoạn cuối lết dần vào giữa phòng, sân hẹp lại
      b.walking = b.phase === 2 && b.x > stopX; // đang lết tới, để vẽ dáng đi
      if (b.phase === 2 && b.x > stopX) b.x -= 7 * dt;
      w.px1 = b.x - 26;
    }
    for (const s of b.seq) s.t -= dt;
    const due = b.seq.filter((s) => s.t <= 0);
    b.seq = b.seq.filter((s) => s.t > 0);
    for (const s of due) s.f();
    const px = b.x, py = b.y;
    if (b.kind === 'ho') moveHo(b, dt);
    if (b.kind === 'mini') moveMini(b, dt);
    if (b.kind === 'ho') {
      // vận tốc để vẽ dáng chạy và đuôi trễ; bỏ qua các cú nhảy vị trí tức thời
      const vx = (b.x - px) / dt, vy = (b.y - py) / dt;
      const jump = Math.abs(b.x - px) > 6 || Math.abs(b.y - py) > 6;
      b.vx = jump ? 0 : vx; b.vy = jump ? 0 : vy;
      b.moving = !jump && Math.abs(vx) > 20;
    }
    if (b.seq.length === 0 && b.st.stun <= 0 && b.st.frozen <= 0) {
      b.cd -= dt;
      if (b.cd <= 0) {
        if (b.kind === 'moc') thinkMoc(b);
        else if (b.kind === 'ngu') thinkNgu(b);
        else if (b.kind === 'ho') thinkHo(b);
        else thinkMini(b);
      }
    }
  };
})();

    poison: { hi: '#e6ffc0', c2: '#c2f58a', c: '#6fcf3a', d: '#2f6b1a', ramp: RAMP.poison, puff: RAMP.vapor, a: 'rgba(111,207,58,' },

    none: { hi: '#ffffff', c2: '#ffffff', c: '#e4e0d4', d: '#8a93a0', ramp: RAMP.steel, puff: RAMP.dust, a: 'rgba(241,234,217,' },
    foe: { hi: '#ffffff', c2: '#ffd0c0', c: '#ff5a40', d: '#8a1c12', ramp: RAMP.red, puff: RAMP.dust, a: 'rgba(255,90,64,' },

  // Đoán bảng màu từ một mã màu bất kỳ (để G.burst cũ vẫn dùng được).
  const RAMP_OF = new Map();
  function rampOf(col) {

      arc(-0.16, 0, 0.3, 0.24, 35, 300, '#f2e6c8'), arc(-0.16, 0, 0.36, 0.1, 35, 300, '#ffffff'),
      circ(-0.02, -0.34, 0.1, '#8a5a2e'), circ(0.1, 0.2, 0.19, '#f2b888'), rect(0.0, 0.1, 0.3, 0.17, '#e0483a'),
      poly([[1.02, 0], [0.42, -0.56], [0.42, 0]], '#fff0b0'), poly([[1.02, 0], [0.42, 0.56], [0.42, 0]], '#f0b840'),

  };

  const cache = new Map();

  // ---------- chữ số pixel 3x5 ----------
  const DIG = {
    0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111', 4: '101101111001001',
    5: '111100111001111', 6: '111100111101111', 7: '111001001010010', 8: '111101111101111', 9: '111101111001111',
    x: '000101010101000',

  // Trả về bảng pixel của một dãy số, mỗi điểm phóng to s lần, có viền đen.
  function numBuf(str, s, col) {
    str = String(str);

    for (let n = 0; n < str.length; n++) {
      const g = DIG[str[n]];
      if (!g) continue;
      for (let i = 0; i < 15; i++) if (g[i] === '1') b.rect(1 + (n * 4 + (i % 3)) * s, 1 + Math.floor(i / 3) * s, s, s, col);

  // Thẻ giá mana: giọt nước xanh và con số. lack: đang thiếu mana thì số màu đỏ.

    b.rect(1, 0, w - 2, 9, OUT); b.rect(0, 1, w, 7, OUT);

  // ---------- thân nút ----------
  // Khoảng cách tới tâm theo hình dáng nút: tròn, hoặc vuông vát góc.
  function metric(shape, R) {

  // Trang trí theo hệ quanh vòng nút Đánh: lửa bốc phía trên, độc nhỏ giọt phía dưới, băng mọc gai bốn góc.

    const tri = (pts, col) => {
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      for (const p of pts) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
      for (let y = Math.floor(y0); y <= y1; y++) for (let x = Math.floor(x0); x <= x1; x++) if (inPoly(pts, x + 0.5, y + 0.5)) b.set(x, y, col);
    };

      list.forEach((f, i) => {
        const a = (f[0] * Math.PI) / 180, bx = Math.round(c + Math.sin(a) * (R - 2)), by = Math.round(cy - Math.cos(a) * (R - 2));

      const list = [[-8, 7], [26, 4], [-36, 4], [48, 2], [-56, 2]].slice(0, 2 + lv);
      list.forEach((f, i) => {
        const a = (f[0] * Math.PI) / 180, bx = Math.round(c + Math.sin(a) * (R - 3)), by = Math.round(cy + Math.cos(a) * (R - 3));

        b.rect(bx - 1, by, 1, len - 2, pal.l); b.set(bx - 1, by + len - 2, '#ffffff');

  }

  // Dựng thân nút: bóng đổ, bề dày, vòng kim loại, mặt nút lõm, biểu tượng, thẻ giá.
  // o: { shape, R, ring, face, pressed, disabled, el, lv, fr, studs, icon, iconDy, badge, badgeAt }
  function buildBase(o) {
    const R = o.R, lip = lipOf(R), rw = ringOf(R), size = 2 * R + 2 * PAD;

    const lipCol = mix(o.ring.d, '#000000', 0.5);

    }

  // Lớp phủ đang hồi: phần còn phải chờ bị che tối, quét theo chiều kim đồng hồ từ đỉnh, có vạch sáng ở mép.

  // Vòng nạp quanh nút Đánh, có vạch nấc. q/N là phần đã nạp.
  function chargeSprite(R, q, N, steps, el, blink) {
    return memo('ch|' + R + '|' + q + '|' + steps + '|' + el + '|' + blink, () => {
      const size = 2 * R + 2 * PAD, c = PAD + R, b = new Buf(size, size), pal = accent(el);
      const f = q / N, full = q >= N;

  // ---------- đưa lên màn hình ----------
  // Tính lưới pixel: mỗi điểm vẽ ứng với k điểm thật của màn hình (k nguyên), nên hình không bị nhoè.

  function label(ctx, s, x, y, col) {

  // Nhớ trạng thái lần vẽ trước của từng nút để tự biết lúc nào nút vừa dùng lại được.
  const seen = {};
  function readyAge(id, usable, t, given) {
    let s = seen[id];

    if (t < s.at) s.at = -9; // đồng hồ bị đặt lại

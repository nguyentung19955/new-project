    return t - (given != null ? given : s.at);
  }
  const elOf = (w) => (w && w.branch && G.EL && G.EL[w.branch] ? w.branch : w && EL_RING[w.branch] ? w.branch : 'none');
  const wType = (w) => (w && ICON['w_' + w.type] ? w.type : 'sword');

  // Vẽ một nút tròn (hoặc vuông vát góc với bình máu, tạm dừng).

  B.draw = function (ctx, kind, x, y, r, st) {
    st = st || {};
    const g = grid(ctx), R = Math.max(7, Math.round((r * g.a) / g.k));
    const t = st.t != null ? st.t : G.time || 0;
    const w = st.weapon || null, el = elOf(w), lv = clamp((w && w.stage) || 1, 1, 3);
    const cd = clamp(st.cd || 0, 0, 1), pressed = !!st.pressed, disabled = !!st.disabled;
    const dimmed = disabled && cd <= 0; // đang hồi thì đã có màn tối quét, không làm xám thêm kẻo mất hình
    const shape = kind === 'potion' || kind === 'pause' ? 'sq' : 'round';
    const lack = st.lack != null ? !!st.lack : disabled && st.cost != null;
    const S = Math.max(8, 2 * faceR(R) - (kind === 'atk' ? 2 : 0));
    let key, make;
    const common = (o) => Object.assign({ shape, R, pressed, disabled: dimmed }, o);
    if (kind === 'atk') {
      const fr = el === 'none' ? 0 : Math.floor(t * 5) % 2;
      key = [kind, R, wType(w), el, lv, fr];
      make = () => common({ ring: EL_RING[el], face: EL_FACE[el], el, lv, fr, studs: el !== 'ice', icon: iconBuf('w_' + wType(w), S, el) });
    } else if (kind === 'special') {
      key = [kind, R, wType(w), el, st.cost, lack];
      make = () => common({ ring: JADE, face: EL_FACE[el], icon: iconBuf('s_' + wType(w), S, el), iconDy: st.cost != null ? -1 : 0, badge: st.cost != null ? costBadge(st.cost, lack) : null });
    } else if (kind === 'skill') {
      const hero = HERO_FACE[st.hero] ? st.hero : 'smith';
      key = [kind, R, hero, st.cost, lack];
      make = () => common({ ring: GOLD, face: HERO_FACE[hero], icon: iconBuf('h_' + hero, S, ''), iconDy: st.cost != null ? -1 : 0, badge: st.cost != null ? costBadge(st.cost, lack) : null });
    } else if (kind === 'dodge') {
      // 16 hướng. Không đẩy cần thì mũi tên chỉ sang phải.
      const di = st.dir == null || isNaN(st.dir) ? 0 : ((Math.round((st.dir / TAU) * 16) % 16) + 16) % 16;
      key = [kind, R, di];
      make = () => common({ ring: IRON, face: pal3('#4a5266', '#343a4a', '#20242e'), icon: iconBuf('dodge', S, di * 22.5) });
    } else if (kind === 'potion') {
      key = [kind, R, st.count];
      make = () => common({ ring: WOOD, face: pal3('#6a2420', '#4a1614', '#2c0c0c'), studs: true, icon: iconBuf('potion', S, ''), badge: st.count != null ? numBuf('x' + st.count, 1, '#fff3da') : null, badgeAt: 'corner' });
    } else {
      key = ['pause', R];
      make = () => common({ ring: WOOD, face: pal3('#4a4038', '#342c26', '#201a16'), studs: true, icon: iconBuf('pause', Math.max(6, S - 4), '') });
    }
    const base = memo('b|' + key.join('|') + '|' + (pressed ? 1 : 0) + (dimmed ? 1 : 0), () => buildBase(make()));
    const oy = pressed ? base.lip : 0;
    const alpha = st.alpha != null ? st.alpha : 1;
    blit(ctx, g, base, x, y, 0, 0, alpha);
    // vòng nạp (chỉ có nghĩa với nút Đánh, nhưng nút nào truyền charge cũng vẽ)
    if (st.charge > 0) {
      const N = 48, q = clamp(Math.round(st.charge * N), 1, N);
      blit(ctx, g, chargeSprite(R, q, N, Math.max(1, st.chargeSteps || 1), el, q >= N && Math.floor(t * 8) % 2 ? 1 : 0), x, y, 0, oy, alpha);
    }
    // đang hồi
    if (cd > 0) {
      const N = 60, q = clamp(Math.ceil(cd * N), 1, N);
      blit(ctx, g, cdSprite(shape, R, q, N), x, y, 0, oy, alpha);
      if (st.cdSec > 1) {
        const nb = memo('n|' + Math.ceil(st.cdSec) + '|' + (R >= 24 ? 3 : 2), () => { const b = numBuf(Math.ceil(st.cdSec), R >= 24 ? 3 : 2, '#fff3da'); return { c: b.canvas(), ax: b.w >> 1, ay: b.h >> 1 }; });
        blit(ctx, g, nb, x, y, 0, oy, alpha);
      }

      const t = 0.5 + j * 0.07 + (j >= half && list.length > 3 ? G.ROOM_WAVES.stagger : 0);
      W.spawns.push({ role, x: q[0], y: q[1], t, t0: t, big: role === 'elite' });
    });
    G.sfx('warn', 0.8);
  }
  function tickSpawns(dt) {
    const W = S.W;
    if (!W.spawns.length) return;
    const el = S.stats.el, tot = el.fire + el.poison + el.ice + el.none;
    const top = G.ELS.slice().sort((a, b) => el[b] - el[a])[0];
    for (const s of W.spawns) {
      s.t -= dt;
      if (s.t > 0) continue;
      const e = G.spawnEnemy(s.role, s.x, s.y, {});
      e.inside = true;
      e.cd = Math.max(e.cd, 0.9); // vừa hiện ra thì chưa đánh ngay
      // Quái tinh anh cũng học: kháng nhẹ hệ bạn dùng nhiều nhất
      if (s.role === 'elite' && tot > 0 && el[top] / tot > 0.4) e.resist = top;
      G.burst(s.x, s.y - 6, ['#c2f58a', '#bfeaff', '#ffd0a0'][S.r] || '#ffffff', s.big ? 14 : 7, 60);
    }
    W.spawns = W.spawns.filter((s) => s.t > 0);
  }
  // Chỗ đặt vật mang hệ: trong sàn, không nằm trên lối vào cửa, không đè lên vật khác.
  function propSpot() {
    const W = S.W, g = W.geo;
    for (let k = 0; k < 30; k++) {
      const x = G.rr(W.x0 + 16, (W.px1 != null ? W.px1 : W.x1) - 16), y = G.rr(W.y0 + 16, W.y1 - 8);
      if (Math.abs(x - g.cx) < 26 && (y < W.y0 + 44 || y > W.y1 - 40)) continue;
      if (Math.abs(y - g.cy) < 26 && (x < W.x0 + 40 || x > W.x1 - 40)) continue;
      if (W.props.some((p) => p.type !== 'roomFore' && Math.hypot(p.x - x, p.y - y) < 30)) continue;
      if (Math.hypot(x - g.cx, y - g.cy - 26) < 24) continue; // chỗ người chơi đứng khi bắt đầu ở giữa phòng
      return [x, y];
    }
    return [g.cx + G.rr(-40, 40), g.cy + G.rr(-30, 30)];
  }
  function addEnv(n, el) {
    const W = S.W, reg = G.REGIONS[S.r];
    for (let k = 0; k < n; k++) {
      const e = el || (G.rnd() < 0.65 ? reg.el : G.pick(G.ELS));
      const q = propSpot();
      W.props.push({ type: PROP_OF[e], env: true, x: q[0], y: q[1] });
    }
  }

  // Dựng một phòng lần đầu bước vào.
  function buildRoom(id) {
    const P = S.P, R = S.map.rooms[id], type = R.type, M = G.mapgen;
    const bs = type === 'boss' ? bossSetup() : null;
    const geo = G.roomArt.geo(type === 'boss');
    const W = G.newWorld(P, {
      w: G.W, base: S.base, region: S.r, stats: S.stats, marksMult: S.marksMult, haste: S.haste,
      hpFloor: S.tut && type !== 'boss', loot: S.loot, seed: (S.map.seed % 100000) * 10 + id + 1,
    });
    Object.assign(W, geo.bounds);
    W.geo = geo; W.room = id; W.uid = S.uid + ':' + id; W.variant = (S.map.seed + id * 7) % 3;
    W.type = type; W.cleared = false; W.waves = []; W.waveI = -1; W.waveT = 0.6; W.spawns = []; W.hadWaves = false;
    W.doors = M.DKEYS.filter((d) => R.doors[d] != null).map((d) => ({ dir: d, to: R.doors[d], gate: M.isGate(S.map, id, R.doors[d]), boss: S.map.rooms[R.doors[d]].type === 'boss', open: false }));
    W.props.push({ type: 'roomFore', x: 0, y: 9999 }); // lớp phủ trước của phòng, vẽ sau nhân vật
    S.W = W; S.challenge = null;
    const cx = geo.cx, cy = geo.cy;
    if (type === 'start' || type === 'fight' || type === 'elite' || type === 'challenge') {
      W.waves = buildWaves(type);
      if (S.tut && type === 'start') W.waves = [['rusher', 'rusher', 'rusher']];
      else if (S.tut && id === 1) {
        W.waves = [['swarm', 'swarm', 'swarm', 'swarm', 'swarm'], ['swarm', 'swarm', 'swarm', 'swarm', 'rusher']];
        W.props.push({ type: 'brazier', env: true, x: cx - 34, y: cy - 12 }, { type: 'brazier', env: true, x: cx + 36, y: cy + 22 });
      } else if (type !== 'start') {
        if (type === 'challenge') W.props.push({ type: 'pedestal', x: cx, y: cy - 2 });
        addEnv(1 + (G.rnd() < 0.5 ? 1 : 0));
      }
      if (type === 'challenge') S.challenge = { t: G.ROOM_WAVES.challengeTime, hits: 0, hp: P.hp };
      W.hadWaves = true;
    } else if (type === 'chest') {
      W.props.push({ type: 'chest', x: cx, y: cy + 4, act: 'chest' });
      W.cleared = true;
    } else if (type === 'fountain') {
      W.props.push({ type: 'fountain', kind: 'hp', x: cx - 44, y: cy + 14, act: 'fountain' });
      W.props.push({ type: 'fountain', kind: 'mana', x: cx + 44, y: cy + 14, act: 'fountain' });
      W.props.push({ type: 'stash', x: geo.fx0 + 40, y: W.y0 + 6, act: 'stash' });
      W.cleared = true;
    } else if (type === 'merchant') {
      W.props.push({ type: 'merchant', x: cx, y: cy - 2, act: 'merchant' });
      S.shop = { el: G.pick(G.ELS), bought: {} };
      W.cleared = true;
    } else if (type === 'curse') {
      W.props.push({ type: 'altar', x: cx, y: cy - 2, act: 'altar' });
      S.curseOffer = G.pick(G.CURSES);
      W.cleared = true;
    } else if (type === 'boss') {
      S.layers = bs.layers;
      const b = G.makeBoss(bs.kind, { name: bs.name, layers: bs.layers });
      const res = bs.layers.find((l) => l.type === 'resist');
      const el = res ? G.WEAK[res.el] : G.pick(G.ELS);
      const xr = (W.px1 != null ? W.px1 : W.x1) - W.x0;
      W.props.push({ type: PROP_OF[el], env: true, x: W.x0 + xr * 0.3, y: W.y0 + 20 }, { type: PROP_OF[el], env: true, x: W.x0 + xr * 0.68, y: W.y1 - 14 });
      W.banner = { s: b.name + (bs.layers.length ? ': ' + bs.layers.map(G.layerText).join(' · ') : ' xuất hiện'), col: '#ff6a5a', t: 4 };
      G.sfx('gong');
    }
    if (W.cleared) S.cleared[id] = true;
    return W;
  }
  // Cửa của phòng hiện tại: mở khi phòng đã dọn; cửa dẫn tới Trùm còn phải đủ điều kiện của bản đồ.
  function updateDoors() {
    const W = S.W, ok = G.mapgen.gateOpen(S.map, S.cleared);
    for (const d of W.doors) d.open = !!W.cleared && W.type !== 'boss' && (!d.gate || ok);
  }
  // Rời phòng: gom dấu ấn, dọn những thứ chỉ sống trong lúc đánh.
  function leaveRoom() {
    const W = S.W;
    if (!W) return;
    S.marks += W.marksGained; W.marksGained = 0;
    if (W.usedPotion) S.usedPotion = true;
    S.challenge = null;
    W.projs = []; W.zones = []; W.parts = []; W.texts = []; W.slashes = []; W.spawns = []; W.banner = null; W.shake = 0;
    for (const p of W.props) if (p.type === 'trap') p.dead = true;
    W.props = W.props.filter((p) => !p.dead);
  }
  // Vào phòng id. from: hướng vừa đi (ví dụ 'up' là đi qua cửa trên, sẽ hiện ra ở cửa dưới của phòng mới).
  function enterRoom(id, from) {
    const P = S.P, map = S.map;
    leaveRoom();
    S.idx = id;
    let W = S.worlds[id];
    const first = !W;
    if (first) {
      W = buildRoom(id);
      S.worlds[id] = W;
      S.visits++;
      if (S.visits > 1 && P.roomHeal) P.hp = Math.min(P.maxhp, P.hp + P.maxhp * P.roomHeal);
    } else {
      G.setWorld(W);
      S.W = W;
      if (W.cleared) W.waves = [];
    }
    W.marksMult = S.marksMult; W.haste = S.haste; W.noPotion = S.curse === 'dry';
    S.near = null; S.endT = 0; S.roomT = 0; S.doorCd = 0.3;
    S.seen[id] = true; S.known[id] = true;
    for (const d of W.doors) S.known[d.to] = true;
    // vị trí xuất hiện: ngay trong cửa đối diện với hướng vừa đi, hoặc giữa phòng nếu là phòng đầu
    const g = W.geo;
    if (from) {
      const q = G.roomArt.doorPos(g, OPP[from]);
      P.x = q.x + DIRV[from][0] * 14; P.y = q.y + DIRV[from][1] * 14;
    } else { P.x = W.boss ? W.x0 + 30 : g.cx; P.y = g.cy + (W.boss ? 0 : 26); }
    if (W.boss && from && first) {
      const b = W.boss;
      if (b.kind === 'mini') {
        // trùm nhỏ đứng ở nửa phòng đối diện với cửa vừa vào
        b.x = G.clamp(g.cx + DIRV[from][0] * 70, W.x0 + 30, W.x1 - 30); b.y = G.clamp(g.cy + DIRV[from][1] * 46, W.y0 + 20, W.y1 - 10);
      } else if (W.px1 != null) P.x = Math.min(P.x, W.px1 - 24); // boss vùng chắn bên phải: không hiện ra sau lưng nó
    }
    P.inv = Math.max(P.inv, first ? 0.6 : 0.3);
    P.dashT = 0; P.dodgeT = 0;
    if (W.type === 'fountain') S.preview = bossSetup().layers;
    S.hint = S.tut ? TUT[W.type === 'fight' ? (id === 1 ? 'fight1' : 'fight2') : W.type] || null : null;
    updateDoors();
  }
  function clearRoom() {
    const W = S.W, map = S.map, M = G.mapgen;
    const was = M.gateOpen(map, S.cleared);
    W.cleared = true;
    S.cleared[S.idx] = true;
    G.sfx('pick', 0.8);
    S.P.hp = Math.min(S.P.maxhp, S.P.hp + S.P.maxhp * 0.08);
    if (S.challenge) {
      const ok = S.challenge.t > 0;
      if (ok) {
        if (G.rnd() < 0.5) { G.save.stones++; S.got.push('1 đá tôi'); } else { G.save.ore += 6; S.got.push('6 quặng'); }
        G.save.gold += 80;
        W.banner = { s: 'Vượt thử thách! Nhận ' + S.got[S.got.length - 1] + ' và 80 vàng', col: '#ffd23f', t: 3 };
      } else W.banner = { s: 'Hết giờ, không có thưởng', col: '#b8b0a0', t: 2.5 };
      S.challenge = null;
      for (const p of W.props) if (p.type === 'pedestal') p.used = true;
    }
    // điều kiện mở cửa Trùm: mảnh chìa (Kiểu C) hoặc số phòng quái đã dọn (Kiểu B)
    if (map.gate && map.gate.ids.includes(S.idx)) {
      const n = M.gateCount(map, S.cleared), keys = map.gate.rule === 'keys';
      if (!was && M.gateOpen(map, S.cleared)) {
        W.banner = { s: keys ? 'Đủ 3 mảnh chìa! Cửa phía trên sảnh đã mở' : 'Dọn đủ 3 phòng quái! Cửa Trùm đã mở', col: '#ffd23f', t: 3.5 };
        G.sfx('evolve');
      } else if (!W.banner) W.banner = { s: keys ? 'Nhặt được mảnh chìa ' + n + '/3' : 'Đã dọn ' + n + '/3 phòng quái', col: '#ffd27a', t: 2.5 };
    }
    updateDoors();
  }
  // Người chơi đang đẩy vào cửa nào (đứng sát mép sàn, đúng chỗ cửa, và đang đi về phía cửa).
  function doorAt(inp) {
    const W = S.W, P = S.P;
    let mx = inp.mx, my = inp.my;
    const l = Math.hypot(mx, my);
    if (l > 1) { mx /= l; my /= l; }
    if (P.dodgeT > 0) { mx = P.ddx; my = P.ddy; }
    for (const d of W.doors) {
      const q = G.roomArt.doorPos(W.geo, d.dir), v = DIRV[d.dir];
      if (mx * v[0] + my * v[1] < 0.35) continue;
      const along = v[0] ? Math.abs(P.y - q.y) : Math.abs(P.x - q.x);
      const depth = v[0] ? (q.x - P.x) * v[0] : (q.y - P.y) * v[1];
      if (along <= 12 && depth <= 1.5) return d;
    }
    return null;
  }

  function chestOptions() {
    const tier = G.rollRarity(S.r);
    const type = G.pick(G.WKEYS), family = Math.floor(G.rnd() * G.FAMILIES) % G.FAMILIES;
    const look = { type, family, rarity: tier, marks: { fire: 0, poison: 0, ice: 0 }, branch: null, sharpen: 0 };
    return [
      { kind: 'weapon', type, tier, family, look, label: G.wName(look), sub: 'Bậc ' + G.RARITY[tier].name + '. Vũ khí mới, cất vào rương đồ' },
      { kind: 'ore', n: 5 + S.r * 3, label: (5 + S.r * 3) + ' quặng', sub: 'Dùng để mài vũ khí ở lò rèn' },
      { kind: 'charm', el: S.tut ? 'fire' : G.pick(G.ELS), label: '', sub: 'Phủ hệ lên cả hai vũ khí trong 60 giây' },
    ].map((o) => { if (o.kind === 'charm') o.label = 'Bùa ' + G.EL[o.el].name; return o; });
  }
  function interact(pr) {
    const W = S.W, P = S.P;
    if (pr.act === 'chest' && !pr.used) { S.opts = chestOptions(); S.mode = 'chest'; S.prop = pr; } else if (pr.act === 'fountain' && !pr.used) {
      if (pr.kind === 'hp') P.hp = Math.min(P.maxhp, P.hp + P.maxhp * 0.5); else P.mana = P.maxmana;
      for (const o of W.props) if (o.type === 'fountain') o.used = true;
      G.burst(pr.x, pr.y, pr.kind === 'hp' ? '#ff6a5a' : '#6ab0ff', 20, 80);
      G.sfx('evolve', 0.8);
    } else if (pr.act === 'stash') { S.mode = 'swap'; S.sel = null; } else if (pr.act === 'merchant') S.mode = 'merchant';
    else if (pr.act === 'altar' && !pr.used) { S.mode = 'curse'; S.prop = pr; }
  }
  function rebuildWeapons() {
    const P = S.P;
    const cur = P.weapons[P.cur];
    P.weapons = G.save.carry.map((id) => G.weaponById(id)).filter(Boolean);
    P.cur = Math.max(0, P.weapons.indexOf(cur));
  }

  function finish(win) {
    const sv = G.save, reg = G.REGIONS[S.r], W = S.W;
    S.marks += W.marksGained; W.marksGained = 0;
    if (W.usedPotion) S.usedPotion = true;
    const R = { win, lines: [], stars: 0, up: 0 };
    if (win) {
      const b = W.boss;
      // Sao thứ ba: đòn kết liễu phải mang hệ khắc chế; trùm không kháng hệ nào thì chỉ cần đòn kết liễu có hệ.
      const third = b.weak.length ? b.weak.includes(S.loot.finalEl) : !!S.loot.finalEl;
      R.stars = 1 + (S.usedPotion ? 0 : 1) + (third ? 1 : 0);
      R.starNote = [true, !S.usedPotion, third];
      const map = S.diff ? sv.stars2 : sv.stars;
      const key = S.r + '-' + S.i;
      const prev = map[key] || 0;
      map[key] = Math.max(prev, R.stars);
      const big = S.i === 4;
      const xp = S.base.xp;
      let gold = S.base.gold + S.loot.kills * 2;
      if (sv.charm === 'c_greed' && sv.heroes[sv.hero].lvl >= 5) gold = Math.round(gold * 1.25);
      const ore = 3 + R.stars, mat = 5 + S.i;
      sv.gold += gold; sv.ore += ore; sv.mats[S.r] += mat;
      R.lines.push('+' + xp + ' kinh nghiệm', '+' + gold + ' vàng', '+' + ore + ' quặng', '+' + mat + ' ' + reg.mat.toLowerCase());
      if (big) { const ns = S.diff ? 4 : 3; sv.shards[S.r] += ns; R.lines.push('+' + ns + ' mảnh ' + reg.bossName); }
      if ((R.stars === 3 && prev < 3) || (!big && G.rnd() < 0.15)) { sv.stones++; R.lines.push('+1 đá tôi'); }
      // Vũ khí rơi: trùm vùng theo G.bossDrop (lần đầu chắc chắn Vàng); ải thường thì 50% một món bậc ngẫu nhiên.
      if (big || G.rnd() < G.DROP.stage) {
        const nw = big ? G.bossDrop(S.r) : G.giveWeapon(G.pick(G.WKEYS), G.rollRarity(S.r));
        R.lines.push(nw ? { s: (big ? reg.bossName + ' rơi ' : 'Nhặt được ') + rarName(nw), w: nw } : 'Rương đồ đầy, vũ khí rớt đổi thành vàng');
      }
      if (S.loot.charm) {
        const left = Object.keys(G.GEAR.charm).filter((k) => !sv.owned.charm.includes(k));
        if (left.length) { const c = G.pick(left); sv.owned.charm.push(c); R.lines.push('Nhặt được ' + G.GEAR.charm[c].name); }
      }
      if (big && !S.diff && !sv.heroes[reg.rescue].unlocked) {
        sv.heroes[reg.rescue].unlocked = true;
        R.lines.push('Cứu được ' + G.HEROES[reg.rescue].name + '! Hero mới đã mở.');
      }
      if (big && S.loot.finalEl) sv.scars[reg.boss] = S.loot.finalEl;
      if (S.tut) sv.tut.done = true;
      R.up = G.addXp(sv.hero, xp);
      G.sfx('win');
    } else {
      const xp = Math.round(S.base.xp * 0.4 * (Math.max(0, S.visits - 1) / S.rooms.length));
      const gold = S.loot.kills * 2;
      sv.gold += gold;
      R.lines.push('+' + xp + ' kinh nghiệm', '+' + gold + ' vàng');
      R.up = G.addXp(sv.hero, xp);
    }
    if (S.marks > 0) R.lines.push('Vũ khí nhận ' + Math.round(S.marks) + ' dấu ấn');
    if (R.up) R.lines.push(G.HEROES[sv.hero].name + ' lên cấp ' + sv.heroes[sv.hero].lvl + '!');
    for (const g of S.got) R.lines.push(g.w ? { s: 'Trong ải: ' + g.s, w: g.w } : 'Trong ải: ' + g);

  G.finishStage = finish;
  // Dùng khi chạy thử: nhảy thẳng tới phòng số n (0 là Bắt đầu, 7 là Trùm). type: ép loại phòng và dựng lại phòng đó.
  G.gotoRoom = function (n, type) {
    if (type) { S.map.rooms[n].type = type; S.rooms[n] = type; delete S.worlds[n]; delete S.cleared[n]; }
    S.trans = null; S.mode = 'play';
    enterRoom(n, null);
  };

  // ---------- điều khiển ----------
  const BTN0 = { atk: [430, 220, 28], dodge: [380, 246, 18], special: [384, 196, 18], skill: [434, 162, 18] }; // nút kỹ năng nhích lên 4 để ngọn lửa của nút Đánh không chạm thẻ giá
  // Có lề trống (màn hình dài hoặc đang cầm dọc) thì đẩy nút ra lề để không che trận đấu.
  // Phòng trùm rộng hơn (sàn tới x = 380): màn hình không đủ lề (16:9) thì dùng bộ nút thu nhỏ, nằm sát mép phải, không đè lên sàn.
  const BTN_BIG = { atk: [450, 222, 26], dodge: [400, 248, 17], special: [401, 200, 17], skill: [448, 167, 17] };
  const bigRoom = () => !!(S && S.W && S.W.geo && S.W.geo.big);
  function btnPos(name) { const b = (bigRoom() && G.cx < 20 ? BTN_BIG : BTN0)[name]; return [b[0] + G.cx, b[1] + G.cy, b[2]]; }
  // Cần điều khiển lúc chưa chạm: phòng trùm thì lùi sát mép trái để không đè tường.
  function stickPos() { return [(bigRoom() && G.cx < 30 ? 42 : 62) - G.cx * 0.6, 216 + G.cy, 24]; }
  const BTN = BTN0;
  // Ô bình máu và nút tạm dừng: [x, y, rộng, cao]. Vùng chạm rộng hơn hình vẽ 4 đơn vị mỗi phía.
  const POT = [4, 23, 50, 21], PAU = [58, 23, 30, 21];
  const hitBox = (d, b) => G.inRect(d, b[0] - 4, b[1] - 3, b[2] + 8, b[3] + 7);
  function setMode(m) { S.mode = m; S.sel = null; }
  G.stageUi = { btnPos, stickPos, POT, PAU }; // để bài kiểm tra biết nút nằm ở đâu
  function readInput() {
    const k = G.keys, kp = G.keyP;
    const inp = {
      mx: (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0),
      my: (k.ArrowDown || k.KeyS ? 1 : 0) - (k.ArrowUp || k.KeyW ? 1 : 0),
      atk: !!(k.KeyJ || k.KeyZ || k.Space), atkP: !!(kp.KeyJ || kp.KeyZ || kp.Space),
      dodgeP: !!(kp.KeyK || kp.KeyX || kp.ShiftLeft), specialP: !!(kp.KeyL || kp.KeyC), skillP: !!(kp.KeyI || kp.KeyV),
      swapP: !!(kp.KeyQ || kp.Tab), potionP: !!(kp.KeyE || kp.KeyH), pauseP: !!(kp.Escape || kp.KeyP), mapP: !!kp.KeyM,
    };
    const mm = G.minimap.rect(S);
    for (const d of G.downs) {
      if (G.inRect(d, 368, 0, 112, 38)) { inp.swapP = true; d.role = 'ui'; continue; }
      if (G.inRect(d, mm[0] - 2, mm[1], mm[2] + 4, mm[3] + 3)) { inp.mapP = true; d.role = 'ui'; continue; }
      if (hitBox(d, POT)) { inp.potionP = true; d.role = 'ui'; continue; }
      if (hitBox(d, PAU)) { inp.pauseP = true; d.role = 'ui'; continue; }
      // nút tròn: lấy nút gần ngón nhất, vùng chạm rộng hơn hình vẽ một chút
      let hit = null, best = 1e9;
      for (const name in BTN) {
        const b = btnPos(name), dd = Math.hypot(d.x - b[0], d.y - b[1]);
        if (dd <= b[2] + 6 && dd - b[2] < best) { best = dd - b[2]; hit = name; }
      }
      if (hit) {
        d.role = hit;
        if (hit === 'atk') inp.atkP = true;
        if (hit === 'dodge') inp.dodgeP = true;
        if (hit === 'special') inp.specialP = true;
        if (hit === 'skill') inp.skillP = true;
      } else if (d.x < 240 && d.y > 48 && ![...G.pointers.values()].some((p) => p.role === 'joy' && p !== d)) d.role = 'joy';
      else d.role = 'none'; // chạm vào chỗ trống: không làm gì, cũng không tính là bấm nút
    }
    for (const p of G.pointers.values()) {
      if (p.role === 'atk') inp.atk = true;
      if (p.role === 'joy') {
        let dx = (p.x - p.sx) / 24, dy = (p.y - p.sy) / 24;
        const l = Math.hypot(dx, dy);
        if (l > 1) { dx /= l; dy /= l; }
        if (l > 0.18) { inp.mx += dx; inp.my += dy; }
      }
    }
    return inp;
  }

  // ---------- cảnh ----------
  G.StageScene = {
    update(dt) {
      if (!S) return;
      if (S.fade > 0) S.fade -= dt;
      const W = S.W, P = S.P;
      if (S.mode !== 'play') {
        const kp = G.keyP;
        if (kp.Escape || (kp.KeyP && S.mode === 'paused') || (kp.KeyM && S.mode === 'map')) {
          if (S.mode === 'result' || S.mode === 'dead') { S = null; G.setScene(G.Village); return; }
          setMode('play'); G.sfx('ui');
        }
        return;
      }
      // đang chuyển phòng: màn hình trượt theo hướng đi, trận đấu đứng yên
      if (S.trans) {
        const T = S.trans;
        T.t += dt;
        if (T.phase === 0 && T.t >= TRANS_OUT) { enterRoom(T.to, T.dir); T.phase = 1; T.t = 0; }
        else if (T.phase === 1 && T.t >= TRANS_IN) S.trans = null;
        return;
      }
      const inp = G.botInput ? G.botInput(S) : readInput();
      if (inp.pauseP) { setMode('paused'); return; }
      if (inp.mapP) { setMode('map'); G.sfx('ui'); return; }
      S.roomT = (S.roomT || 0) + dt;
      if (S.doorCd > 0) S.doorCd -= dt;
      // tương tác với đồ vật gần nhất
      S.near = null;
      let bd = 26;
      for (const pr of W.props) {
        if (!pr.act || pr.used) continue;
        const d = Math.hypot(pr.x - P.x, (pr.y - P.y) * 1.3);
        if (d < bd) { bd = d; S.near = pr; }
      }
      if (S.near && inp.atkP) { inp.atk = false; inp.atkP = false; interact(S.near); if (S.mode !== 'play' || S.W !== W) return; }
      else if (S.near) inp.atk = false;
      G.updateWorld(dt, inp);
      // đạn không bay xuyên tường ra lề màn hình
      if (W.projs.length) W.projs = W.projs.filter((o) => o.x > W.geo.fx0 - 2 && o.x < W.geo.fx1 + 2 && o.y > W.geo.fy0 - 26 && o.y < W.geo.fy1 + 8);
      for (const z of W.zones) if (z.wave && z.x < W.geo.fx0 + 3) z.dead = true; // sóng của Ngư Tinh tan khi chạm tường trái
      // đợt quái
      tickSpawns(dt);
      if (W.waves.length && !W.cleared) {
        if (W.ents.filter((e) => !e.add).length === 0 && !W.spawns.length) {
          W.waveT -= dt;
          if (W.waveT <= 0) {
            W.waveI++;
            W.waveT = 0.7;
            if (W.waveI < W.waves.length) spawnWave(W.waves[W.waveI]); else clearRoom();
          }
        }
      }
      if (S.challenge) S.challenge.t -= dt;
      if (W.type === 'boss' && S.loot.bossDown) { S.endT += dt; if (S.endT > 1.6) finish(true); return; }
      if (W.over === 'dead') { S.endT += dt; if (S.endT > 1.2) finish(false); return; }
      // bước vào cửa đang mở thì sang phòng kề
      if (W.cleared && W.type !== 'boss' && S.doorCd <= 0) {
        const d = doorAt(inp);
        if (d && d.open) { S.trans = { to: d.to, dir: d.dir, phase: 0, t: 0 }; G.sfx('swing', 0.5); }
        else if (d && d.gate && !S.gateMsgT) { S.gateMsgT = 2; }
      }
      if (S.gateMsgT > 0) S.gateMsgT = Math.max(0, S.gateMsgT - dt);
    },
    // Trang bị ẩn (chuyển ứng dụng, tắt màn hình): tự tạm dừng.
    hide() { if (S && S.mode === 'play') setMode('paused'); },
    draw() {
      if (!S) return;
      if (S.mode !== S.shownMode) {
        // Bảng vừa mở hoặc đóng: ngón đang giữ không được bấm nhầm vào nút mới hiện.
        S.shownMode = S.mode; S.modeT = G.time; G.stalePointers(); G.click = null;
      }
      G.drawWorld(S.r);
      if (S.trans) slideWorld();
      drawHud();
      if (S.mode === 'map') { G.minimap.drawBig(S); if (G.click) { G.click = null; setMode('play'); G.sfx('ui'); } }
      else if (S.mode === 'chest') panelChest();
      else if (S.mode === 'swap') panelSwap();
      else if (S.mode === 'merchant') panelMerchant();
      else if (S.mode === 'curse') panelCurse();
      else if (S.mode === 'paused') panelPause();
      else if (S.mode === 'result' || S.mode === 'dead') panelResult();
      if (S && S.fade > 0) ui.rect(0, 0, G.W, G.H, 'rgba(0,0,0,' + Math.min(1, S.fade / 0.35) + ')'); // S có thể vừa bị xoá khi bấm Về làng
    },
  };

  // Chuyển phòng: phòng cũ trượt ra và tối dần, phòng mới trượt vào từ phía cửa vừa bước qua.
  const TRANS_OUT = 0.13, TRANS_IN = 0.2, SLIDE = 40;
  function slideWorld() {
    const T = S.trans, c = G.wx, v = DIRV[T.dir];
    const k = T.phase === 0 ? Math.min(1, T.t / TRANS_OUT) : 1 - Math.min(1, T.t / TRANS_IN);
    const sgn = T.phase === 0 ? -1 : 1;
    const ox = Math.round(v[0] * SLIDE * k * sgn), oy = Math.round(v[1] * SLIDE * k * sgn);
    c.setTransform(1, 0, 0, 1, 0, 0);
    if (ox || oy) {
      c.globalCompositeOperation = 'copy';
      c.drawImage(c.canvas, ox, oy);
      c.globalCompositeOperation = 'source-over';
    }
    c.fillStyle = 'rgba(0,0,0,' + Math.min(1, k * 1.1).toFixed(3) + ')';
    c.fillRect(0, 0, G.W, G.H);
  }

  function markInfo(w) {
    if (!w.branch) {
      const top = G.ELS.slice().sort((a, b) => w.marks[b] - w.marks[a])[0];
      return { frac: w.marks[top] / G.MARKS[0], col: w.marks[top] > 0 ? G.EL[top].col : '#666', txt: w.marks[top] > 0 ? G.EL[top].name + ' ' + Math.floor(w.marks[top]) + '/' + G.MARKS[0] : 'Chưa có dấu ấn' };
    }
    const st = G.wStage(w), m = w.marks[w.branch];
    const cap = G.RARITY[G.wRar(w)].maxStage;
    if (st >= cap) return { frac: 1, col: G.EL[w.branch].col, txt: G.EL[w.branch].name + ' · ' + G.STAGE_NAMES[st] + (cap < 3 ? ' (tối đa bậc ' + G.RARITY[G.wRar(w)].name + ')' : ' (tối đa)') };
    return { frac: (m - (st ? G.MARKS[st - 1] : 0)) / (G.MARKS[st] - (st ? G.MARKS[st - 1] : 0)), col: G.EL[w.branch].col, txt: G.EL[w.branch].name + ' · ' + G.STAGE_NAMES[st] + ' ' + Math.floor(m) + '/' + G.MARKS[st] };
  }
  G.markInfo = markInfo;

  function drawHud() {
    const W = S.W, P = S.P, c = G.ux;

    const canDrink = P.potions > 0 && !W.noPotion;

    BA.draw(c, 'potion', POT[0] + 13, POT[1] + 11, 11, { count: P.potions, disabled: !canDrink, pressed: heldBox(POT) });
    ui.text(W.noPotion ? 'Cấm' : 'Bình máu', POT[0] + 28, POT[1] + 14, { size: 6.5, bold: true, color: canDrink ? '#fff3da' : '#a89c8c' });
    BA.draw(c, 'pause', PAU[0] + PAU[2] / 2 + 6, PAU[1] + 11, 10, { pressed: heldBox(PAU) });
    let sx = 6;
    for (const k of G.ELS) if (P.st[k] > 0) { ui.rect(sx, 48, 10, 10, G.EL[k].col, '#000'); sx += 12; }
    const cw = G.curW(P), coat = P.coats[cw.id];
    if (coat && coat.t > 0) ui.text('Bùa ' + G.EL[coat.el].name + ' ' + Math.ceil(coat.t) + ' giây', sx, 56.5, { size: 7.5, color: G.EL[coat.el].col, bold: true });
    // tên vùng và loại phòng ở lề trái; bản đồ nhỏ ở lề phải (thay hàng chấm phòng trước đây)
    ui.text(G.REGIONS[S.r].name + ' ' + (S.i + 1) + ' · ' + ROOM_NAME[W.type], 6, 69, { size: 7, color: '#d9cdb8' });
    G.minimap.draw(S);
    // vũ khí: hình và bậc ở trên, mốc tiến hóa ở dưới, thanh dấu ấn sát đáy
    P.weapons.forEach((w, i) => {
      const x = 368 + i * 56, on = i === P.cur;
      // Khung ô vũ khí cùng bộ với nút, viền mang màu bậc. Hình vũ khí sống và chữ do game vẽ ở các dòng dưới.
      const rar = G.RARITY[G.wRar(w)];
      BA.slot(c, x, 3, 54, 35, {

      });
      G.art.weaponIcon(c, Object.assign({}, w, { coat: P.coats[w.id] && P.coats[w.id].t > 0 ? P.coats[w.id].el : null }), x + 13, 13, 19, on ? (P.atkT > 0 ? 'attack' : 'idle') : 'sleep');

      ui.text(G.STAGE_NAMES[G.wStage(w)], x + 27, 29.5, { size: 6.5, align: 'center', color: w.branch ? G.EL[w.branch].col : '#b8b0a0' });
      ui.bar(x + 3, 32.5, 48, 3, mi.frac, mi.col);
    });
    if (P.weapons.length > 1 && S.tut && W.type === 'elite') ui.text('↑ Chạm để đổi vũ khí', 366, 24, { size: 7, align: 'right', bold: true, color: '#ffd27a' });
    // trùm: thanh máu và các lớp thích nghi nằm trên mặt tường sau, không che sàn
    const b = W.boss;
    if (b && !b.dead) {
      ui.bar(140, 9, 200, 6, b.hp / b.maxhp, '#c23a2e');
      ui.rect(140 + 200 * 0.6, 9, 1, 6, '#000');

      let lx = 340;
      for (const l of b.layers.slice().reverse()) {
        const s = l.type === 'resist' ? 'Kháng ' + G.EL[l.el].name : G.layerText(l);
        ui.font(6.5, true);
        const tw = G.ux.measureText(s).width + 6;
        lx -= tw + 2;
        ui.rect(lx, 17, tw, 9, l.type === 'resist' ? G.EL[l.el].dark : '#4a4038', '#000');

      }
      if (b.weak.length) ui.text('Yếu ' + b.weak.map((e) => G.EL[e].name).join(', '), 240, 35, { size: 7, align: 'center', color: G.EL[b.weak[0]].col, bold: true });

    if (W.type === 'fountain') {
      const t = S.preview.length ? 'Trùm đã học: ' + S.preview.map(G.layerText).join(' · ') : 'Trùm chưa học được gì từ bạn';
      const lines = ui.wrap(t, 228, 7, true);
      ui.rect(122, 9, 236, lines.length * 9 + 5, 'rgba(20,16,14,0.8)');
      lines.forEach((l, i) => ui.text(l, 240, 18 + i * 9, { size: 7, align: 'center', color: '#ffd9c8', bold: true }));

    // Lời chỉ dẫn của ải đầu nằm ở lề trái, không che phòng. Ở phòng trùm tự ẩn sau 12 giây.

    if (hint && W.cleared && W.hadWaves) hint = TUT.door;
    if (hint && W.type === 'boss' && S.roomT > 12) hint = null;
    if (hint && S.mode === 'play') {
      const hw = W.geo.big ? 62 : 116; // phòng trùm rộng hơn nên ô chữ hẹp lại, không đè lên sàn
      const lines = ui.wrap(hint, hw - 8, 7);

    // cửa dẫn tới Trùm còn khóa: ghi rõ còn thiếu gì, ngay cạnh cửa
    if (S.mode === 'play' && W.cleared && !S.trans) {
      const gi = G.minimap.gateInfo(S);
      for (const d of W.doors) {
        if (!d.gate || d.open || !gi) continue;
        const q = G.roomArt.doorPos(W.geo, d.dir), v = DIRV[d.dir];
        const tx = q.x - v[0] * 34, ty = q.y - v[1] * 22 + (v[1] < 0 ? 4 : 0);
        const hot = S.gateMsgT > 0 && Math.floor(G.time * 6) % 2;
        ui.text(gi.keys ? 'Cần 3 mảnh chìa' : 'Dọn 3 phòng quái', tx, ty, { size: 7, align: 'center', bold: true, color: hot ? '#ffffff' : '#ff9a8a' });
        ui.text('Đã có ' + gi.n + '/' + gi.need, tx, ty + 9, { size: 7, align: 'center', bold: true, color: '#ffd27a' });
      }
    }
    // tên các vật bấm được, để người mới biết đó là gì
    const PNAME = { chest: 'Rương báu', stash: 'Rương đồ', merchant: 'Thương nhân', altar: 'Bàn thờ lời nguyền' };
    if (S.mode === 'play') {
      for (const pr of W.props) {

        const py = pr.y - (pr.act === 'stash' ? 28 : pr.act === 'fountain' ? 40 : 36);
        if (pr === S.near) ui.text('Bấm Đánh', pr.x - W.cam, py, { size: 8, align: 'center', bold: true, color: '#fff3b0' });
        else if (nm) ui.text(nm, pr.x - W.cam, py, { size: 7, align: 'center', bold: true, color: pr.act === 'fountain' ? (pr.kind === 'hp' ? '#ff9a8a' : '#9ac8ff') : '#f0d9b0' });
      }
    }
    // nút cảm ứng
    if (S.mode === 'play') {
      const joy = [...G.pointers.values()].find((p) => p.role === 'joy');
      let jdx = 0, jdy = 0;
      if (joy) {
        jdx = joy.x - joy.sx; jdy = joy.y - joy.sy;
        const jl = Math.hypot(jdx, jdy);

      const held = (name) => [...G.pointers.values()].some((p) => p.role === name);
      const cw2 = G.curW(P);
      // Vũ khí đang cầm: loại, hệ đang có hiệu lực (kể cả lúc đang Nung), mốc tiến hóa, bậc.

      const showLab = !!S.tut; // chữ tên nút chỉ hiện ở ải hướng dẫn

      const dir = P.dodgeT > 0 ? Math.atan2(P.ddy * DK, P.ddx) : Math.hypot(kx, ky) > 0.18 ? Math.atan2(ky * DK, kx) : P.ldx != null ? Math.atan2(P.ldy * DK, P.ldx) : P.face > 0 ? 0 : Math.PI;
      S.dodgeDir = dir; // để bài kiểm tra đọc

      let bt = btnPos('atk');
      BA.draw(c, 'atk', bt[0], bt[1], bt[2] + 1, {
        weapon: wst, pressed: held('atk') || G.keys.KeyJ, glow: !!S.near, label: showLab ? 'Đánh' : null,
        charge: chg > 0 ? chg : undefined, chargeSteps: mcfg && mcfg.charge ? (mcfg.charge.lv1 != null ? 2 : 1) : 0,
      });
      bt = btnPos('special');

    const sv = G.save;

    if (c.stones && sv.stones < c.stones) return false;

    if (c.shard) for (let i = 0; i < 3; i++) if (sv.shards[i] < (c.shard[i] || 0)) return false;
    return true;
  }
  function pay(c) {
    const sv = G.save;
    sv.gold -= c.gold || 0; sv.ore -= c.ore || 0; sv.stones -= c.stones || 0;
    if (c.mat) for (let i = 0; i < 3; i++) sv.mats[i] -= c.mat[i] || 0;
    if (c.shard) for (let i = 0; i < 3; i++) sv.shards[i] -= c.shard[i] || 0;

  function weaponGrid(y0, filter) {
    // vũ khí đang mang lên đầu, rồi tới bậc cao
    const carry = G.save.carry;
    const list = G.save.weapons.filter(filter || (() => true)).sort((a, b) => (carry.includes(b.id) - carry.includes(a.id)) || (G.wRar(b) - G.wRar(a)) || (a.id - b.id));
    list.slice(0, 12).forEach((w, k) => {
      const x = 16 + (k % 2) * 226, y = y0 + Math.floor(k / 2) * 25;
      if (G.weaponLine(w, x, y, 220, V.sel === w.id)) { V.sel = w.id; G.click = null; G.sfx('ui'); }
      if (G.save.carry.includes(w.id)) ui.text('đang mang', x + 214, y + 9.5, { size: 6, align: 'right', color: '#9be07a' });
    });
    return list;
  }

  // ---------- trang bị ----------
  function cycle(slot) {
    const sv = G.save, own = sv.owned[slot];
    const list = [null].concat(own);
    sv[slot] = list[(list.indexOf(sv[slot]) + 1) % list.length];
    G.persist();
  }
  function gear() {
    const sv = G.save;
    frame('Trang bị');
    ui.text('Đang mang', 16, 62, { size: 7.5, color: '#d9cdb8' });

      const w = G.weaponById(id);
      if (w && G.weaponLine(w, 16, 66 + slot * 25, 220, false)) {
        G.click = null;
        if (V.sel != null && !sv.carry.includes(V.sel)) { sv.carry[slot] = V.sel; V.sel = null; G.persist(); G.sfx('pick'); }
        else viewWeapon(w.id, 'gear'); // chưa chọn gì để thay: mở màn xem vũ khí
      }

// ===== js/mapgen.js =====
// Bản đồ một ải: 8 phòng vuông trên lưới, sinh ngẫu nhiên theo hạt giống, ba kiểu bố cục A, B, C.
//   A: đường chính 6 phòng ngoằn ngoèo, thêm 2 phòng phụ bỏ qua được.
//   B: mê cung nhỏ trong ô 3x3 có đường vòng; cửa Trùm nằm trong phòng Suối hồi, mở khi dọn xong 3 phòng quái.
//   C: sảnh giữa là phòng Bắt đầu, ba cánh giữ ba mảnh chìa; đủ 3 mảnh thì cửa phía trên sảnh mở, qua Suối hồi tới Trùm.
// Quy ước số phòng: 0 là Bắt đầu, 6 là Suối hồi, 7 là Trùm.
(function () {
  const G = window.G;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const DKEYS = ['up', 'down', 'left', 'right'];
  const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
  const MAXW = 5, MAXH = 4; // bản đồ nhỏ vẽ vừa lưới 5 x 4
  const SIDE = ['merchant', 'challenge', 'curse'];
  const KINDS = ['A', 'B', 'C'];
  const isFight = (t) => t === 'fight' || t === 'elite'; // phòng quái được tính vào điều kiện mở cửa Trùm

  function rng(seed) {
    // Trộn hạt giống trước để các hạt liền nhau không cho kết quả gần giống nhau.
    let s = (seed >>> 0) ^ 0x9e3779b9;
    s = Math.imul(s ^ (s >>> 15), 0x85ebca6b) >>> 0;
    const f = G.srand(s || 1);
    for (let i = 0; i < 4; i++) f();
    return f;
  }
  const pick = (rn, a) => a[Math.floor(rn() * a.length)];
  function shuffle(rn, a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rn() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  const key = (x, y) => x + ',' + y;
  function room(id, x, y, type, main) { return { id, x, y, type, main: !!main, doors: {} }; }
  function link(a, b) {
    for (const d of DKEYS) if (a.x + DIRS[d][0] === b.x && a.y + DIRS[d][1] === b.y) { a.doors[d] = b.id; b.doors[OPP[d]] = a.id; return true; }
    return false;
  }
  // Dời toạ độ về gốc 0 và xếp phòng theo số.
  function finish(kind, seed, rooms, gate) {
    const mx = Math.min(...rooms.map((r) => r.x)), my = Math.min(...rooms.map((r) => r.y));
    for (const r of rooms) { r.x -= mx; r.y -= my; }
    rooms.sort((a, b) => a.id - b.id);
    return {
      kind, seed, rooms, start: 0, fountain: 6, boss: 7, gate: gate || null,
      w: Math.max(...rooms.map((r) => r.x)) + 1, h: Math.max(...rooms.map((r) => r.y)) + 1,
    };
  }
  function bboxOk(cells) {
    const xs = cells.map((c) => c[0]), ys = cells.map((c) => c[1]);
    return Math.max(...xs) - Math.min(...xs) < MAXW && Math.max(...ys) - Math.min(...ys) < MAXH;
  }

  // ---------- Kiểu A: đường chính có nhánh phụ ----------
  function genA(seed, rn) {
    for (let guard = 0; guard < 400; guard++) {
      // lối chính: đi ngẫu nhiên 6 ô không cắt chính mình, phải rẽ ít nhất 2 lần
      const path = [[0, 0]];
      const used = new Set([key(0, 0)]);
      let turns = 0, last = null, ok = true;
      while (path.length < 6) {
        const [x, y] = path[path.length - 1];
        const opts = shuffle(rn, DKEYS).filter((d) => {
          const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
          return !used.has(key(nx, ny)) && bboxOk(path.concat([[nx, ny]]));
        });
        if (!opts.length) { ok = false; break; }
        // hơi ưu tiên rẽ để lối đi ngoằn ngoèo
        const d = last && opts.length > 1 && rn() < 0.45 ? opts.find((o) => o !== last) : opts[0];
        if (last && d !== last) turns++;
        last = d;
        const c = [x + DIRS[d][0], y + DIRS[d][1]];
        path.push(c); used.add(key(c[0], c[1]));
      }
      if (!ok || turns < 2) continue;
      // Phòng Trùm chỉ được kề đúng một ô của lối chính là Suối hồi? Không cần: cửa mới quyết định, không phải ô kề.
      // hai phòng phụ gắn vào bốn phòng đầu của lối chính (không gắn vào Suối hồi và Trùm)
      const sideCells = [];
      const parents = shuffle(rn, [0, 1, 2, 3]);
      for (const pi of parents) {
        if (sideCells.length >= 2) break;
        const [x, y] = path[pi];
        const free = shuffle(rn, DKEYS).map((d) => [x + DIRS[d][0], y + DIRS[d][1]]).filter((c) => !used.has(key(c[0], c[1])) && bboxOk(path.concat(sideCells.map((s) => s.c), [c])));
        if (!free.length) continue;
        used.add(key(free[0][0], free[0][1]));
        sideCells.push({ c: free[0], parent: pi });
      }
      if (sideCells.length < 2) continue;
      const types = ['start', 'fight', 'fight', 'elite'];
      const rooms = [];
      for (let i = 0; i < 4; i++) rooms.push(room(i, path[i][0], path[i][1], types[i], true));
      const sideTypes = shuffle(rn, ['chest', pick(rn, SIDE)]);
      sideCells.forEach((s, k) => rooms.push(room(4 + k, s.c[0], s.c[1], sideTypes[k], false)));
      rooms.push(room(6, path[4][0], path[4][1], 'fountain', true));
      rooms.push(room(7, path[5][0], path[5][1], 'boss', true));
      const main = [0, 1, 2, 3, 6, 7];
      for (let i = 0; i < 5; i++) link(rooms[main[i]], rooms[main[i + 1]]);
      sideCells.forEach((s, k) => link(rooms[s.parent], rooms[4 + k]));
      return finish('A', seed, rooms, null);
    }
    return null;
  }

  // ---------- Kiểu B: mê cung nhỏ 3x3 ----------
  function genB(seed, rn) {
    for (let guard = 0; guard < 400; guard++) {
      const corners = [[0, 0], [2, 0], [0, 2], [2, 2]];
      const bc = pick(rn, corners);
      // Suối hồi là một trong hai ô kề góc của Trùm
      const fc = pick(rn, [[bc[0] === 0 ? 1 : 1, bc[1]], [bc[0], 1]]);
      // Bắt đầu ở xa Trùm: góc đối diện hoặc một ô cách Trùm ít nhất 3 bước
      const far = [];
      for (let x = 0; x < 3; x++) for (let y = 0; y < 3; y++) if (Math.abs(x - bc[0]) + Math.abs(y - bc[1]) >= 3) far.push([x, y]);
      const sc = pick(rn, far);
      // bỏ đi một ô trong 9 ô
      const all = [];
      for (let x = 0; x < 3; x++) for (let y = 0; y < 3; y++) all.push([x, y]);
      const fixed = new Set([key(bc[0], bc[1]), key(fc[0], fc[1]), key(sc[0], sc[1])]);
      const drop = pick(rn, all.filter((c) => !fixed.has(key(c[0], c[1]))));
      const rest = shuffle(rn, all.filter((c) => !fixed.has(key(c[0], c[1])) && key(c[0], c[1]) !== key(drop[0], drop[1])));
      const types = shuffle(rn, ['fight', 'fight', 'elite', 'chest', pick(rn, SIDE)]);
      const rooms = [room(0, sc[0], sc[1], 'start', true)];
      rest.forEach((c, k) => rooms.push(room(1 + k, c[0], c[1], types[k], isFight(types[k]))));
      rooms.push(room(6, fc[0], fc[1], 'fountain', true));
      rooms.push(room(7, bc[0], bc[1], 'boss', true));
      const at = {};
      for (const r of rooms) at[key(r.x, r.y)] = r;
      // cây khung ngẫu nhiên trên 7 phòng không phải Trùm, rồi thêm cửa để có đường vòng
      const inner = rooms.filter((r) => r.type !== 'boss');
      const seen = new Set([0]);
      const stack = [rooms[0]];
      const edges = new Set();
      const ek = (a, b) => (a.id < b.id ? a.id + '-' + b.id : b.id + '-' + a.id);
      while (stack.length) {
        const cur = stack[stack.length - 1];
        const nb = shuffle(rn, DKEYS).map((d) => at[key(cur.x + DIRS[d][0], cur.y + DIRS[d][1])]).filter((n) => n && n.type !== 'boss' && !seen.has(n.id));
        if (!nb.length) { stack.pop(); continue; }
        seen.add(nb[0].id); edges.add(ek(cur, nb[0])); link(cur, nb[0]); stack.push(nb[0]);
      }
      if (seen.size !== inner.length) continue;
      const extra = [];
      for (const a of inner) for (const d of ['down', 'right']) {
        const b = at[key(a.x + DIRS[d][0], a.y + DIRS[d][1])];
        if (b && b.type !== 'boss' && !edges.has(ek(a, b))) extra.push([a, b]);
      }
      if (!extra.length) continue;
      const add = shuffle(rn, extra).slice(0, 1 + (rn() < 0.6 && extra.length > 1 ? 1 : 0));
      for (const [a, b] of add) link(a, b);
      link(rooms[6], rooms[7]);
      const need = rooms.filter((r) => isFight(r.type)).map((r) => r.id);
      return finish('B', seed, rooms, { a: 6, b: 7, ids: need, need: need.length, rule: 'clear' });
    }
    return null;
  }

  // ---------- Kiểu C: sảnh trung tâm ----------
  function genC(seed, rn) {
    for (let guard = 0; guard < 400; guard++) {
      const cells = { hub: [0, 0], fountain: [0, -1], boss: [0, -2] };
      const wings = [[-1, 0], [1, 0], [0, 1]];

    if (T.fore) T.fore(g, G.srand((seed || 11) + 9));
    return { base: base.canvas, fore: fore.canvas, g, T };
  }
  const cache = new Map();
  function get(W) {
    const doors = W.doors || [];
    const key = [W.uid, W.region, W.type, W.seed, doors.map((d) => d.dir + (d.open ? 1 : 0) + (d.gate ? 'g' : '') + (d.boss ? 'b' : '')).join(',')].join('|');
    let room = cache.get(key);
    if (!room) {
      const g = Object.assign({}, W.geo, { type: W.type, variant: W.variant || 0 });
      g.doors = doors.map((d) => ({ side: SIDE_OF[d.dir], dir: d.dir, at: d.dir === 'up' || d.dir === 'down' ? g.cx : g.cy, state: d.open ? 'open' : 'locked', gate: !!d.gate, boss: !!d.boss }));
      building = true;
      try { room = buildRoom(THEMES[W.region] || Castle, g, W.seed); } finally { building = false; }
      if (cache.size >= 4) cache.delete(cache.keys().next().value);
      cache.set(key, room);
    }
    return room;
  }
  RA.get = get;
  RA.cache = cache;

  // ---------- lớp sống: lửa đuốc, mũi tên cửa mở, chỗ quái sắp hiện, nước dâng ----------
  function live(cx, W, room) {
    const g = room.g, t = G.time || 0, pv = c;
    c = cx;
    try {
      for (const l of g.lights) {
        const f = Math.floor(t * 9 + l.x) % 3;
        if (l.k === 'torch') { r(l.x - 2 + (f === 1 ? 1 : 0), l.y - 9 - f, 3, 3, '#ff7a2a'); r(l.x - 1, l.y - 7 - (f === 2 ? 2 : 0), 2, 3, '#ffd23f'); r(l.x + (f - 1), l.y - 12 - f, 1, 1, '#ffd23f'); }
        else if (l.k === 'candle') { r(l.x - 1, l.y - (f === 0 ? 1 : 0), 2, 3, '#ffd23f'); r(l.x - 1, l.y + 1, 2, 1, '#ff7a2a'); r(l.x - 3, l.y - 2, 6, 6, 'rgba(255,200,80,0.10)'); }
        else if (l.k === 'twinkle') { if (Math.floor(t * 2 + l.x * 0.37) % 4 === 0) { r(l.x, l.y - 2, 1, 5, '#ffffff'); r(l.x - 2, l.y, 5, 1, '#ffffff'); } }
        else if (l.k === 'firefly') { const fx = l.x + Math.sin(t * 1.3 + l.x) * 7, fy = l.y + Math.cos(t * 1.7 + l.y) * 4; r(fx, fy, 1, 1, Math.floor(t * 3 + l.x) % 3 ? '#f8ffd0' : 'rgba(248,255,208,0.3)'); }
      }
      // mũi tên nhún nhảy ở cửa đang mở
      const bob = Math.floor(t * 4) % 2, col = room.T === Cave ? '#d8f6ff' : room.T === Forest ? '#f4ffb0' : '#ffe08a';
      for (const d of g.doors) {
        if (d.state !== 'open') continue;
        if (d.side === 'top') arrow0(d.at, g.fy0 + 9 - bob, 'up', col);
        else if (d.side === 'bottom') arrow0(d.at, g.fy1 - 9 + bob, 'down', col);
        else if (d.side === 'left') arrow0(g.fx0 + 8 - bob, d.at, 'left', col);
        else arrow0(g.fx1 - 9 + bob, d.at, 'right', col);
      }
      // nước dâng (trận Ngư Tinh): phủ phần sàn không còn đứng được
      const s = W.shrink;
      if (s) {
        const wc = 'rgba(50,130,185,0.62)', foam = 'rgba(220,245,255,0.8)', f = Math.floor(t * 3) % 2;
        const y0 = Math.round(s.y0), y1 = Math.round(s.y1), x0 = Math.round(s.x0 || 0);
        r(g.fx0, g.fy0, g.fx1 - g.fx0, y0 - g.fy0, wc); r(g.fx0, y1, g.fx1 - g.fx0, g.fy1 - y1, wc);
        for (let x = g.fx0 + 2; x < g.fx1 - 14; x += 24) { r(x + f * 3, y0 - 1, 14, 1, foam); r(x + 10 - f * 3, y1, 14, 1, foam); r(x + 6, y0 - 8 - f, 6, 1, 'rgba(220,245,255,0.3)'); r(x + 3, y1 + 7 + f, 6, 1, 'rgba(220,245,255,0.3)'); }
        if (x0 > g.fx0) { r(g.fx0, y0, x0 - g.fx0, y1 - y0, wc); for (let y = y0 + 2; y < y1; y += 8) r(x0 - 1, y + f * 2, 1, 5, foam); }
      }
      // chỗ quái sắp hiện ra: vệt tối loang dần, viền sáng theo màu chủ đề
      for (const sp of W.spawns || []) {
        const k = 1 - Math.max(0, sp.t) / sp.t0, rx = 4 + 7 * k + (sp.big ? 5 : 0);
        ell(sp.x, sp.y, rx + 2, (rx + 2) * 0.7, rgba(room.T.light, 0.18 + 0.2 * k));
        ell(sp.x, sp.y, rx, rx * 0.7, 'rgba(8,4,10,0.75)');
        if (Math.floor(t * 12) % 2) ell(sp.x, sp.y, rx * 0.5, rx * 0.35, rgba(room.T.light, 0.35));
        if (k > 0.55) { const h = Math.round((k - 0.55) * 40); r(sp.x - 2, sp.y - h, 4, h, rgba(room.T.light, 0.5)); r(sp.x - 1, sp.y - h - 2, 2, 2, '#ffffff'); }
      }
    } finally { c = pv; }
  }

  // ---------- nối vào game: thay nền phòng và thêm vài đồ vật ----------
  const oldBg = A.bg, oldProp = A.prop;
  A.bg = function (cx, reg, seed, cam, width, shrink) {
    const W = G.getWorld ? G.getWorld() : null;
    if (!W || !W.geo) return oldBg.apply(this, arguments);
    try {
      const room = get(W);
      cx.drawImage(room.base, 0, 0);
      live(cx, W, room);
    } catch (e) {
      if (!A.roomErr) { A.roomErr = e; if (window.console) console.warn('room_art bg', e); }
      cx.fillStyle = '#120c0c'; cx.fillRect(0, 0, G.W, G.H);
    }
  };
  const PROPS = {
    // lớp phủ trước của phòng (song cửa dưới, măng đá, cỏ cao): vẽ sau nhân vật
    roomFore(o) {
      const W = G.getWorld ? G.getWorld() : null;
      if (W && W.geo) c.drawImage(get(W).fore, 0, 0);
    },
    // bệ thử thách: cột đá có đồng hồ cát
    pedestal(o, x, y, t) {
      ell(x, y + 1, 12, 4, 'rgba(0,0,0,0.3)');
      r(x - 10, y - 5, 20, 6, DARK); r(x - 9, y - 4, 18, 4, '#5a6a70'); r(x - 9, y - 4, 18, 1, '#8aa0a4');
      r(x - 7, y - 16, 14, 12, DARK); r(x - 6, y - 15, 12, 11, '#6a7c82'); r(x - 6, y - 15, 2, 11, '#9ab0b4'); r(x + 4, y - 15, 2, 11, '#465458');
      r(x - 9, y - 19, 18, 4, DARK); r(x - 8, y - 18, 16, 2, '#8aa0a4'); r(x - 8, y - 18, 16, 1, '#c0d4d8');
      const live = !o.used, col = live ? '#4ad0c0' : '#5a6a70', f = Math.floor(t * 3) % 3;
      r(x - 5, y - 32, 10, 13, DARK); r(x - 4, y - 31, 8, 1, '#e8d8a0'); r(x - 4, y - 21, 8, 1, '#e8d8a0');
      r(x - 3, y - 30, 6, 3, col); r(x - 2, y - 27, 4, 1, col); r(x - 1, y - 26, 2, 1, col); r(x - 2, y - 25, 4, 1, col); r(x - 3, y - 24, 6, 3, col);
      if (live) { r(x - 2, y - 30, 3, 1, '#c8fff4'); r(x, y - 26 + f, 1, 1, '#ffffff'); ell(x, y - 26, 9, 9, 'rgba(74,208,192,0.10)'); }
    },
  };
  A.prop = function (cx, o) {
    const f = o && PROPS[o.type];
    if (!f) return oldProp.apply(this, arguments);
    const pv = c;
    c = cx;
    try { f(o, Math.round(o.x || 0), Math.round(o.y || 0), G.time || 0); } catch (e) {
      if (!A.roomErrP) { A.roomErrP = e; if (window.console) console.warn('room_art prop', e); }
    } finally { c = pv; }
  };
})();

// ===== js/minimap.js =====
// Bản đồ nhỏ ở góc trên bên phải (dưới hai ô vũ khí) và bản đồ to khi chạm vào.
// Chỉ hiện phòng đã qua (tô đặc), phòng đang đứng (sáng, có viền) và phòng kề đã biết (chỉ viền và biểu tượng).
(function () {
  const G = window.G, ui = G.ui;
  const MM = (G.minimap = {});
  // Biểu tượng 7x7 cho từng loại phòng
  const ICON = {
    start: ['.#####.', '#.....#', '#.....#', '#.....#', '#...#.#', '#.....#', '#.....#'],
    fight: ['...#...', '...#...', '...#...', '...#...', '.#####.', '...#...', '...#...'],
    elite: ['#.....#', '##...##', '#######', '#.#.#.#', '#######', '.#.#.#.', '.......'],
    chest: ['.#####.', '#######', '#######', '.......', '#######', '###.###', '#######'],
    fountain: ['...#...', '..###..', '..###..', '.#####.', '.#####.', '.#####.', '..###..'],
    merchant: ['..###..', '...#...', '..###..', '.#####.', '#######', '#######', '.#####.'],
    challenge: ['#######', '.#####.', '..###..', '...#...', '..###..', '.#####.', '#######'],
    curse: ['.......', '..###..', '.#####.', '##.#.##', '.#####.', '..###..', '.......'],
    boss: ['.#####.', '#######', '#.###.#', '#######', '.#####.', '.#.#.#.', '.......'],
    lock: ['..###..', '.#...#.', '.#...#.', '#######', '###.###', '###.###', '#######'],
    key: ['.###...', '#...#..', '#...#..', '.###...', '..#....', '..##...', '..###..'],
  };
  const COL = {
    start: '#7fc060', fight: '#a09488', elite: '#e8853a', chest: '#e8c040', fountain: '#4a9fe0',
    merchant: '#c8a070', challenge: '#40c0b0', curse: '#a070e0', boss: '#d84a40',
  };
  const NAME = {
    start: 'Bắt đầu', fight: 'Đánh quái', elite: 'Tinh anh', chest: 'Rương báu', fountain: 'Suối hồi',
    merchant: 'Thương nhân', challenge: 'Thử thách', curse: 'Lời nguyền', boss: 'Trùm',
  };
  MM.COL = COL; MM.NAME = NAME; MM.ICON = ICON;
  function icon(name, x, y, s, col) {
    const rows = ICON[name];
    if (!rows) return;
    const c = G.ux;
    c.fillStyle = col;
    for (let j = 0; j < 7; j++) for (let i = 0; i < 7; i++) if (rows[j][i] === '#') c.fillRect(x + i * s, y + j * s, s + 0.05, s + 0.05);
  }
  MM.icon = icon;
  function dark(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgb(' + Math.round((n >> 16) * k) + ',' + Math.round(((n >> 8) & 255) * k) + ',' + Math.round((n & 255) * k) + ')';
  }
  // Trạng thái hiển thị của một phòng: 'cur' đang đứng, 'seen' đã qua, 'known' kề phòng đã qua, null là chưa biết.
  function stateOf(S, id) {
    if (id === S.idx) return 'cur';
    if (S.seen[id]) return 'seen';
    if (S.known[id]) return 'known';
    return null;
  }
  MM.stateOf = stateOf;

  // Vẽ lưới phòng vào ô (x, y, w, h). cw, ch: cỡ ô phòng; gp: khe giữa hai ô; s: cỡ điểm của biểu tượng.
  function grid(S, x, y, w, h, cw, ch, gp, s) {
    const M = G.mapgen, map = S.map;
    const gw = map.w * cw + (map.w - 1) * gp, gh = map.h * ch + (map.h - 1) * gp;
    const x0 = x + (w - gw) / 2, y0 = y + (h - gh) / 2;
    const X = (i) => x0 + i * (cw + gp), Y = (j) => y0 + j * (ch + gp);
    const open = M.gateOpen(map, S.cleared);
    const lw = Math.max(2, Math.round(s * 1.6));
    // lối nối giữa các phòng đã biết
    for (const r of map.rooms) {
      for (const d of ['right', 'down']) {
        const n = r.doors[d];
        if (n == null) continue;
        const sa = stateOf(S, r.id), sb = stateOf(S, n);
        if (!sa || !sb || (sa === 'known' && sb === 'known')) continue;
        const gate = M.isGate(map, r.id, n) && !open;
        const faint = sa === 'known' || sb === 'known';
        const col = gate ? '#e0443a' : faint ? 'rgba(200,170,120,0.5)' : '#c8a878';
        if (d === 'right') ui.rect(X(r.x) + cw, Y(r.y) + ch / 2 - lw / 2, gp, lw, col);
        else ui.rect(X(r.x) + cw / 2 - lw / 2, Y(r.y) + ch, lw, gp, col);
        if (gate) {
          // ổ khóa đỏ nằm giữa lối vào
          const lx = d === 'right' ? X(r.x) + cw + gp / 2 : X(r.x) + cw / 2, ly = d === 'right' ? Y(r.y) + ch / 2 : Y(r.y) + ch + gp / 2;
          const k = Math.max(0.6, s * 0.75);
          ui.rect(lx - 3.5 * k - 1, ly - 3.5 * k - 1, 7 * k + 2, 7 * k + 2, '#2a0c0a');
          icon('lock', lx - 3.5 * k, ly - 3.5 * k, k, '#ff6a5a');
        }
      }
    }
    for (const r of map.rooms) {
      const st = stateOf(S, r.id);
      if (!st) continue;
      const cx = X(r.x), cy = Y(r.y), col = COL[r.type];
      const ix = cx + (cw - 7 * s) / 2, iy = cy + (ch - 7 * s) / 2;
      if (st === 'cur') {
        const blink = Math.floor(G.time * 3) % 2;
        ui.rect(cx - 2, cy - 2, cw + 4, ch + 4, blink ? 'rgba(255,230,160,0.5)' : 'rgba(255,210,122,0.28)');
        ui.rect(cx, cy, cw, ch, '#ffd27a', '#fff6d8');
        icon(r.type, ix, iy, s, '#4a2408');
      } else if (st === 'seen') {
        ui.rect(cx, cy, cw, ch, dark(col, 0.55), dark(col, 0.95));
        icon(r.type, ix, iy, s, S.cleared[r.id] || !G.mapgen.isFight(r.type) ? '#f4ead0' : '#1a1210');
      } else {
        ui.rect(cx, cy, cw, ch, 'rgba(0,0,0,0.35)', col);
        icon(r.type, ix, iy, s, col);
      }
    }
  }

  // Số ghi ở góc bản đồ nhỏ: mảnh chìa (Kiểu C), phòng quái đã dọn (Kiểu B), số phòng đã qua (Kiểu A).
  function gateInfo(S) {
    const M = G.mapgen, map = S.map;
    if (!map.gate) return null;
    return { n: M.gateCount(map, S.cleared), need: map.gate.need, keys: map.gate.rule === 'keys', open: M.gateOpen(map, S.cleared) };
  }
  MM.gateInfo = gateInfo;
  MM.gateText = function (S) {
    const gi = gateInfo(S);
    if (!gi) return 'Suối hồi nằm ngay trước phòng Trùm.';
    if (gi.open) return gi.keys ? 'Đã đủ 3 mảnh chìa: cửa phía trên sảnh đã mở.' : 'Đã dọn đủ 3 phòng quái: cửa Trùm trong phòng Suối hồi đã mở.';
    return gi.keys ? 'Mỗi cánh có một phòng quái giữ một mảnh chìa. Đã có ' + gi.n + '/3 mảnh.' : 'Cửa Trùm nằm trong phòng Suối hồi, mở khi dọn xong 3 phòng quái. Đã dọn ' + gi.n + '/3.';
  };

  // Ô bản đồ nhỏ: [x, y, rộng, cao]. Trong phòng trùm (sàn rộng) thì thu lại thành một nút nhỏ.
  MM.rect = function (S) {
    return S.W && S.W.geo && S.W.geo.big ? [424, 41, 52, 15] : [374, 41, 102, 68];
  };
  MM.draw = function (S) {
    const b = MM.rect(S), x = b[0], y = b[1], w = b[2], h = b[3];
    const small = h < 30;
    ui.rect(x, y, w, h, 'rgba(14,10,10,0.88)', '#7a5a3a');
    if (small) { ui.text('Bản đồ', x + w / 2, y + 10.5, { size: 7, bold: true, align: 'center', color: '#ffd27a' }); return; }
    ui.rect(x + 1.5, y + 1.5, w - 3, h - 3, null, 'rgba(255,220,160,0.12)');
    ui.text('Bản đồ', x + 6, y + 10.5, { size: 7, bold: true, color: '#ffd27a' });
    const gi = gateInfo(S);
    if (gi) {
      const col = gi.open ? '#8fe06a' : gi.keys ? '#ffd27a' : '#ff9a8a';
      ui.text(gi.n + '/' + gi.need, x + w - 6, y + 10.5, { size: 7, align: 'right', bold: true, color: col });
      icon(gi.keys ? 'key' : 'lock', x + w - 27, y + 4, 1, col);
    } else {
      const n = S.map.rooms.filter((r) => S.seen[r.id]).length;
      ui.text('Phòng ' + n + '/8', x + w - 6, y + 10.5, { size: 6.5, align: 'right', color: '#d9cdb8' });
    }
    grid(S, x + 4, y + 14, w - 8, h - 17, 13, 9, 4, 1);
  };

  // Bản đồ to: hiện khi chạm vào bản đồ nhỏ, trò chơi tạm dừng.
  MM.drawBig = function (S) {
    const reg = G.REGIONS[S.r];
    ui.rect(0, 0, G.W, G.H, 'rgba(0,0,0,0.72)');
    ui.panel(50, 14, 380, 242, 'Bản đồ ải · ' + reg.name + ' ' + (S.i + 1));
    ui.rect(60, 36, 252, 172, 'rgba(8,6,6,0.6)', '#4a3a2c');
    grid(S, 64, 40, 244, 164, 36, 28, 12, 3);
    // chú giải: chỉ các loại phòng đã biết
    const types = [];
    for (const r of S.map.rooms) if (stateOf(S, r.id) && !types.includes(r.type)) types.push(r.type);
    const order = ['start', 'fight', 'elite', 'chest', 'fountain', 'merchant', 'challenge', 'curse', 'boss'].filter((t) => types.includes(t));
    ui.text('Chú giải', 322, 46, { size: 8, bold: true, color: '#ffd27a' });
    order.forEach((t, k) => {
      const y = 53 + k * 15;
      ui.rect(322, y, 13, 11, 'rgba(0,0,0,0.35)', COL[t]);
      icon(t, 325, y + 2, 1, COL[t]);
      ui.text(NAME[t], 340, y + 8.5, { size: 7.5, color: '#f1ead9' });
    });
    const ky = 53 + order.length * 15 + 4;
    ui.rect(322, ky, 13, 11, '#ffd27a', '#fff6d8');
    ui.text('Bạn đang ở đây', 340, ky + 8.5, { size: 7, color: '#ffd27a' });
    ui.para(MM.gateText(S), 62, 222, 250, { size: 7.5, color: '#ffd9c8' });
    ui.text('Chạm để chơi tiếp', 420, 246, { size: 8, align: 'right', bold: true, color: Math.floor(G.time * 2.5) % 2 ? '#ffd27a' : '#fff3da' });
  };
})();

// ===== js/main.js =====
// Khởi động game.
(function () {
  const G = window.G;
  G.loadSave();
  let started = false;
  function start() {
    if (started) return;
    started = true;
    G.setScene(G.Title);
    G.run();
  }
  // Chờ phông chữ một chút cho đẹp, nhưng không chờ quá 1,2 giây.
  try {
    if (document.fonts && document.fonts.load) {
      Promise.race([
        document.fonts.load('700 12px "Be Vietnam Pro"'),
        new Promise((r) => setTimeout(r, 1200)),
      ]).then(start, start);
    } else start();
  } catch (e) { start(); }
})();

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Linh Khí</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&display=swap">
<style>
  /* Bố cục: một khung game 16:9 nằm giữa màn hình, co giãn theo cạnh ngắn hơn. Game chỉ có một giao diện tối. */
  :root {
    color-scheme: dark;
    --bg: #120d10;
    --fg: #f1ead9;
    --accent: #ffd27a;
    --frame: #3a2a22;
  }
  /* Chiều cao luôn tính theo 100% của khung chứa (không dùng 100vh) để chạy đúng khi được nhúng. */
  html, body { height: 100%; overscroll-behavior: none; touch-action: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #shell { height: 100%; box-sizing: border-box; padding-inline: 16px; padding-block: 0; }
  #fit { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; touch-action: none; }
  #stage { position: relative; outline: 1px solid var(--frame); background: #000; max-width: 100%; }
  #world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #ui { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
</style>
</head>
<body>
<div id="shell"><div id="fit"><div id="stage">
  <canvas id="world" width="480" height="270" aria-label="Màn hình game Linh Khí"></canvas>
</div><canvas id="ui"></canvas></div></div>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/weapon_art.js"></script>
<script src="js/hero_art.js"></script>
<script src="js/hero_tinhlinh.js"></script>
<script src="js/env_art.js"></script>
<script src="js/combat.js"></script>
<script src="js/moves.js"></script>
<script src="js/boss.js"></script>
<script src="js/fx.js"></script>
<script src="js/fx_he.js"></script>
<script src="js/monster_art.js"></script>
<script src="js/mobs.js"></script>
<script src="js/bao_truoc.js"></script>
<script src="js/fx_dan.js"></script>
<script src="js/btn_art.js"></script>
<script src="js/ui_theme.js"></script>
<script src="js/linhkhi.js"></script>
<script src="js/stage.js"></script>
<script src="js/village_scene.js"></script>
<script src="js/village.js"></script>
<script src="js/mapgen.js"></script>

<script src="js/minimap.js"></script>
<script src="js/portal.js"></script>
<script src="js/main.js"></script>
</body>
</html>

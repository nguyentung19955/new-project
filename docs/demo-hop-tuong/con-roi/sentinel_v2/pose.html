<!doctype html><meta charset=utf-8><body style="margin:0;background:#5a5f69"><canvas id=c width=1100 height=900></canvas>
<script src="rig.js"></script><script>
(async()=>{const def=await (await fetch('sentinel.json')).json(); const R=await RIG.load(def,'parts/');
const ctx=document.getElementById('c').getContext('2d'); const ref=new Image(); ref.src='parts/assembled.png'; await new Promise(r=>ref.onload=r);
ctx.drawImage(ref,20,60); RIG.draw(ctx,R,{},760,600,1,false); window.done=true;})();
</script>

<html lang="vi"><head><meta charset="utf-8"><title>Tờ phác thảo quái và trùm</title>
<style>
  body { margin: 0; background: #1e1b24; color: #e9e4f0; font-family: Inter, "Be Vietnam Pro", system-ui, sans-serif; }
  #to { width: 1760px; padding: 28px 30px 34px; box-sizing: border-box; }
  h1 { margin: 0; font-size: 44px; color: #ffd27a; font-weight: 800; }
  .sub { font-size: 21px; color: #d8d2e4; margin: 6px 0 20px; line-height: 1.4; max-width: 1500px; }

  .card { background: #2a2530; border-radius: 14px; padding: 12px 14px 14px; box-sizing: border-box; display: flex; flex-direction: column; }

  .ten { font-size: 24px; font-weight: 800; margin-top: 6px; }
  .vai { font-size: 17px; font-weight: 600; opacity: .95; }

  .chip { display: inline-block; font-size: 20px; font-weight: 700; padding: 3px 14px; border-radius: 999px; margin-left: 14px; vertical-align: middle; color: #1e1b24; }
  ul { margin: 6px 0 0 0; padding-left: 22px; font-size: 19px; line-height: 1.5; color: #e2dcec; }

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16171a">
  <title>TURRET MERGE</title>
  <link rel="preload" href="assets/fonts/oxanium/oxanium-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/saira-semi-condensed/saira-semi-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/saira-semi-condensed/saira-semi-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/hud.css">
</head>
<body>
  <div id="wrap">
    <canvas id="cv"></canvas>

    <!-- THANH TRÊN: băng WAVE · trùm / số quái · tim -->
    <div id="top" hidden>
      <div id="tb-wave"><span data-t="wave">WAVE</span><b id="tb-so">1</b></div>
      <div id="tb-giua">
        <div id="tb-trum"><img src="assets/ui_canh_bao_trum.png" alt=""><span id="tb-trum-chu"></span></div>
        <div id="tb-seg" aria-hidden="true"></div>
        <div id="tb-trum-mau" hidden><i></i></div>
      </div>
      <div id="tb-tim"></div>
    </div>
    <div id="tb-doi" hidden></div>

    <!-- HÀNG DƯỚI kiểu DCDW: mana · nút TRIỆU HỒI · tốc độ / tạm dừng; hàng thẻ: 5 ụ (nâng cấp) + Ma vương -->
    <div id="duoi" hidden>
      <div id="mana-hop"><img src="assets/ui_mana.png" alt=""><b id="mana">0</b></div>
      <button id="nut-trieu" data-act="trieu"><span class="tr-cap"><img src="assets/ui_nut_trieu.png" alt=""><span class="tr-chu"><span class="tr-ten" data-t="summon">Summon</span><span class="tr-gia"><img src="assets/ui_mana.png" alt=""><b id="gia-trieu">10</b></span></span></span><i class="tr-led"></i></button>
      <div class="nut-cot">
        <button class="nut-nho" data-act="tocdo" id="nut-tocdo">1×</button>
        <button class="nut-nho" data-act="dung" aria-label="Pause">❚❚</button>
      </div>
      <div id="bo-the"></div>
      <button id="the-mv" data-act="mv"><span class="mv-ic"></span><span class="mv-ten"></span><span class="mv-gia"><img src="assets/ui_mana.png" alt=""><b>0</b></span><i class="mv-cd"></i></button>
    </div>

    <div id="bang-wave" hidden><div class="bw-dai"><b></b><span></span></div></div>
    <div id="cutin" hidden><div class="ci-nen"></div><div class="ci-po-hop"><img class="ci-po" alt=""></div><div class="ci-chu"><small>COMMANDER SKILL</small><b></b><span></span></div><img class="ci-ki" alt=""></div>
    <div id="canh-bao" hidden><img src="assets/ui_canh_bao_trum.png" alt=""><b></b><span></span></div>

    <!-- BẢNG THÔNG TIN Ụ (chạm ụ / giữ thẻ) -->
    <div id="tt" hidden>
      <div class="tt-the"><img class="tt-anh" alt=""></div>
      <div class="tt-than">
        <div class="tt-dau"><b class="tt-ten"></b><span class="tt-bac"></span></div>
        <div class="tt-phu"></div>
        <div class="tt-kn"></div>
        <div class="tt-so"></div>
      </div>
    </div>

    <!-- MÀN CHỌN BỘ BÀI: 64 ụ theo bậc, chọn 5 (tối đa 1 ụ ĐỎ) + 1 Ma vương + chế độ -->
    <div id="chon" class="man">
      <div class="chon-dau">
        <div class="logo"><b>TURRET MERGE</b><span data-t="subtitle">MERGE · DEFEND · SURVIVE</span></div>
        <div class="chon-hang">
          <div class="chon-goi"><span data-t="pick5">PICK 5 TURRETS</span> <b id="chon-dem">0/5</b></div>
          <span style="display:flex;gap:6px"><button class="nut-xep" data-act="nhac" data-t="musicOn">MUSIC: ON</button><button class="nut-xep" data-act="amthanh" data-t="sfxOn">SFX: ON</button><button class="nut-xep" data-act="xep" id="nut-xep">SORT: TIER</button></span>
        </div>
        <div id="chon-bo"></div>
      </div>
      <div id="chon-luoi"></div>
      <div class="chon-cuoi">
        <div class="chon-mv" id="chon-mv"></div>
        <div class="chon-che">
          <button class="che" data-act="che" data-che="coop"><b>CO-OP</b><span data-t="coopSub"></span></button>
          <button class="che" data-act="che" data-che="solo"><b>SOLO</b><span data-t="soloSub"></span></button>
          <button class="che" data-act="che" data-che="pvp"><b>PVP</b><span data-t="pvpSub"></span></button>
        </div>
        <div class="chon-nut">
          <button class="nut" data-act="ngaunhien" data-t="random">RANDOM</button>
          <button class="nut chinh" data-act="vao" id="nut-vao" data-t="start" disabled>START</button>
        </div>
      </div>
    </div>

    <div id="dung" class="man phu" hidden>
      <div class="bang">
        <div class="bang-ten" data-t="paused">PAUSED</div>
        <div class="bang-nut">
          <button class="nut" data-act="nhac" id="nut-nhac" data-t="musicOn">MUSIC: ON</button>
          <button class="nut" data-act="amthanh" id="nut-am" data-t="sfxOn">SFX: ON</button>
          <button class="nut" data-act="bo" data-t="quit">QUIT</button>
          <button class="nut chinh" data-act="tiep" data-t="resume">RESUME</button>
        </div>
      </div>
    </div>

    <div id="ketqua" class="man phu" hidden>
      <div class="bang">
        <img class="kq-ic" src="assets/ui_thuong.png" alt="">
        <div class="bang-ten" id="kq-ten"></div>
        <div class="kq-so" id="kq-so"></div>
        <div class="kq-phu" id="kq-phu"></div>
        <div class="bang-nut">
          <button class="nut" data-act="doibo" data-t="changeDeck">CHANGE DECK</button>
          <button class="nut chinh" data-act="choilai" data-t="again">PLAY AGAIN</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/font.js"></script>
  <script src="js/meta.js"></script>
  <script src="js/text.js"></script>
  <script src="js/data.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/tiervfx.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/skills2.js"></script>
  <script src="js/phattrien.js"></script>
  <script src="js/artscale.js"></script>
  <script src="js/skills3.js"></script>
  <script src="js/skills4.js"></script>
  <script src="js/render.js"></script>
  <script src="js/corehud.js"></script>
  <script src="js/quaianim.js"></script>
  <script src="js/support.js"></script>
  <script src="js/hieuung.js"></script>
  <script src="js/buff.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tuongmoi-ui.js"></script>
  <script src="js/glyph.js"></script>
  <script src="js/nhandien.js"></script>
</body>
</html>

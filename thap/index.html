  <script>(function () {
    // logo + khung thanh hiện CÙNG LÚC khi ảnh đã giải mã (không bật logo/khung lẻ từng cái); quá 1,5 s thì hiện luôn
    (function () { var t = document.getElementById('tai'), n = 2, hien = function () { if (t) t.classList.add('san'); }, xong = function () { if (--n <= 0) hien(); };
      ['assets/logo.png', 'assets/tai_khung.png'].forEach(function (u) { var im = new Image(); im.onload = im.onerror = function () { (im.decode ? im.decode() : Promise.resolve()).then(xong, xong); }; im.src = u; });
      setTimeout(hien, 1500); })();
    var vw = innerWidth || 390, vh = innerHeight || 844; document.documentElement.style.setProperty('--tk', Math.max(0.8, Math.min(1.6, vw / 430, vh / 640)).toFixed(3));
    // ảnh chỉ huy lớn của HOME (home.js) — tải SONG SONG với js thay vì đợi js chạy xong
    if (!/[?&](preview|mode)=/.test(location.search)) { var mv = 'hero'; try { var l = JSON.parse(localStorage.getItem('turret_bo') || 'null'); if (l && /^(hero|dahlia|eve)$/.test(l.mv)) mv = l.mv; } catch (e) { }
      var k = document.createElement('link'); k.rel = 'preload'; k.as = 'image'; k.href = 'assets/hero/home_af_' + mv + '.webp'; document.head.appendChild(k); }
  })();</script>
  <div id="wrap">
    <script>
    // đặt khung #wrap NGAY khi trình duyệt dựng tới đây (trước 40+ tệp js, phông, ảnh) — F5 / mạng chậm trên iPhone Safari
    // không còn màn đen + nền lệch góc phải dưới. taitai.js / REN.coLai() đặt lại mỗi lần đổi cỡ.
    function datKhung() {
      var wrap = document.getElementById('wrap'); if (!wrap) return false;
      var vw = innerWidth || document.documentElement.clientWidth, vh = innerHeight || document.documentElement.clientHeight;
      if (!(vw > 0 && vh > 0)) return false;
      var thuc = devicePixelRatio || 1, s = Math.min(vw / 430, vh / 860);
      wrap.style.left = Math.round((vw - 430 * s) / 2 * thuc) / thuc + 'px'; wrap.style.top = Math.round((vh - 860 * s) / 2 * thuc) / thuc + 'px';
      wrap.style.transformOrigin = '0 0'; wrap.style.transform = 'scale(' + s + ')';
      return true;
    }
    if (!/[?&]preview=/.test(location.search)) { document.getElementById('wrap').className = 'dang-tai'; document.documentElement.className = 'dang-tai'; } // che menu chưa có ảnh tới khi màn tải (taitai.js) dựng xong
    datKhung(); addEventListener('resize', function () { if (typeof hoiKhung !== 'function') datKhung(); });
    </script>

  <script id="tm-nap-js">
  // NẠP KHỞI ĐỘNG + THANH TIẾN ĐỘ THEO BYTE (TDO). css trước (song song) → js (song song, chạy đúng thứ tự). Không chặn vẽ màn tải.
  // TDO.dot(tu, den): một đợt tải hiển thị từ tu% → den%; d.them(khoá, byte) khi bắt đầu, d.xong(khoá) khi xong. % = byte đã về
  // + ước lượng phần đang tải (băng thông đo được) → thanh chạy đều, không đứng 0% chờ tệp lớn đầu tiên. taitai.js dùng lại.
  window.TDO = (function () {
    var bw = 120000, bwB = 0, bwT = 0, cur = null, hien = 0, hen = 0;
    function el(s) { var t = document.getElementById('tai'); return t && t.querySelector(s); }
    function ve() {
      var d = cur; if (!d) return;
      var now = Date.now(), tong = 0, ve = 0, n = 0, dang = 0, k;
      for (k in d.m) { var x = d.m[k]; tong += x.b; if (x.x) { ve += x.b; n++; } else if (x.t) dang++; }
      for (k in d.m) { var y = d.m[k]; if (!y.x && y.t) ve += Math.min(y.b * 0.9, (now - y.t) / 1000 * bw / Math.max(1, dang)); }
      var f = tong ? ve / tong : 0, p = Math.floor(d.tu + (d.den - d.tu) * Math.min(1, f));
      if (!d.het && n < d.sl) p = Math.min(p, d.den - 1); // chưa xong hết tệp → không bao giờ báo đủ 100 %
      if (d.het) p = d.den;
      if (p < hien) p = hien; hien = p;
      var a = el('.tai-day'), b = el('.tai-pt'), t = document.getElementById('tai'); // chỉ %: bộ đếm tệp n/m bỏ (từng báo 100 % 256/309)
      if (a) a.style.setProperty('--p', p + '%'); if (b) b.textContent = p + '%'; if (t) t.dataset.p = p;
    }
    function chay() { if (!hen) hen = setInterval(function () { ve(); if (!cur || cur.het) { clearInterval(hen); hen = 0; } }, 100); }
    return {
      dot: function (tu, den, giuMoc) {
        if (!giuMoc) hien = tu;
        var d = cur = { tu: tu, den: den, m: {}, sl: 0, het: false,
          them: function (k, b, cho) { if (d.m[k]) { if (!cho && !d.m[k].t) d.m[k].t = Date.now(); return; } d.m[k] = { b: Math.max(2000, b || 60000), t: cho ? 0 : Date.now(), x: false }; d.sl++; chay(); },
          xong: function (k) { var x = d.m[k]; if (!x || x.x) return; x.x = true; var dt = (Date.now() - x.t) / 1000; bwB += x.b; bwT += Math.max(0.05, dt); if (bwB > 30000) bw = Math.max(20000, bwB / bwT * 2); ve(); },
          ket: function () { d.het = true; ve(); } };
        ve(); return d;
      },
      ve: ve, get p() { return hien; },
    };
  })();
  (function () {
    var tpl = document.getElementById('tm-nap'), css = [], js = [], d = TDO.dot(0, 20);
    var ns = (tpl.content || tpl).querySelectorAll('link[rel=stylesheet], script[src]');
    for (var i = 0; i < ns.length; i++) (ns[i].tagName === 'LINK' ? css : js).push(ns[i]);
    var conCss = css.length;
    js.forEach(function (o) { d.them(o.getAttribute('src'), +o.getAttribute('data-b') || 15000, true); });
    // các tệp js của game viết theo kiểu "chờ DOMContentLoaded = mọi script đã chạy" (bọc UI.init, dời chip…). Giữ đúng nghĩa đó:
    // trong lúc nạp, document.readyState báo 'loading'; script cuối chạy xong → phát lại DOMContentLoaded.
    function chayJs() {
      var con = js.length;
      try { Object.defineProperty(document, 'readyState', { configurable: true, get: function () { return 'loading'; } }); } catch (e) { }
      function het() { try { delete document.readyState; } catch (e) { } d.ket(); document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true })); }
      js.forEach(function (o) {
        var s = document.createElement('script'), u = o.getAttribute('src'); s.async = false; s.src = u;
        d.them(u, +o.getAttribute('data-b') || 15000);
        s.onload = s.onerror = function () { d.xong(u); if (--con === 0) het(); };
        document.body.appendChild(s);
      });
      if (!js.length) het();
    }
    css.forEach(function (o) {
      var l = document.createElement('link'), u = o.getAttribute('href'); l.rel = 'stylesheet'; l.href = u;
      d.them(u, +o.getAttribute('data-b') || 8000);
      l.onload = l.onerror = function () { d.xong(u); if (--conCss === 0) chayJs(); };
      document.head.appendChild(l);
    });
    if (!css.length) chayJs();
  })();
  </script>

  <div id="wrap">
    <script>
    // đặt khung #wrap NGAY khi trình duyệt dựng tới đây (trước 40+ tệp js, phông, ảnh) — F5 / mạng chậm trên iPhone Safari
    // không còn màn đen + nền lệch góc phải dưới. taitai.js / REN.coLai() đặt lại mỗi lần đổi cỡ.
    function datKhung() {
      var wrap = document.getElementById('wrap'); if (!wrap) return false;
      var vw = innerWidth || document.documentElement.clientWidth, vh = innerHeight || document.documentElement.clientHeight;
      if (!(vw > 0 && vh > 0)) return false;
      var thuc = devicePixelRatio || 1, s = Math.min(vw / 430, vh / 860);
      wrap.style.left = Math.round((vw - 430 * s) / 2 * thuc) / thuc + 'px'; wrap.style.top = Math.round((vh - 860 * s) / 2 * thuc) / thuc + 'px';
      wrap.style.transformOrigin = '0 0'; wrap.style.transform = 'scale(' + s + ')';
      return true;
    }
    if (!/[?&]preview=/.test(location.search)) document.getElementById('wrap').className = 'dang-tai'; // che menu chưa có ảnh tới khi màn tải (taitai.js) dựng xong
    datKhung(); addEventListener('resize', function () { if (typeof hoiKhung !== 'function') datKhung(); });
    </script>

    <!-- THANH TRÊN: băng WAVE · trùm / số quái · tim -->
    <div id="top" hidden>
      <div id="tb-wave"><span data-t="wave">WAVE</span><b id="tb-so">1</b></div>
      <div id="tb-giua">

        <div id="tb-seg" aria-hidden="true"></div>

      </div>
      <div id="tb-tim"></div>
    </div>
    <div id="tb-doi" hidden></div>

    <!-- HÀNG DƯỚI kiểu DCDW: mana · nút TRIỆU HỒI · tốc độ / tạm dừng; hàng thẻ: 5 ụ (nâng cấp) + Ma vương -->

      <div id="mana-hop"><img src="assets/ui_mana.png" alt=""><b id="mana">0</b></div>
      <button id="nut-trieu" data-act="trieu"><span class="tr-cap"><img src="assets/ui_nut_trieu.png" alt=""><span class="tr-chu"><span class="tr-ten" data-t="summon">Summon</span><span class="tr-gia"><img src="assets/ui_mana.png" alt=""><b id="gia-trieu">10</b></span></span></span><i class="tr-led"></i></button>
      <div class="nut-cot">
        <button class="nut-nho" data-act="tocdo" id="nut-tocdo">1×</button>
        <button class="nut-nho" data-act="dung" aria-label="Pause"></button>
      </div>
      <div id="bo-the"></div>
      <button id="the-mv" data-act="mv"><span class="mv-ic"></span><span class="mv-ten"></span><span class="mv-gia"><img src="assets/ui_mana.png" alt=""><b>0</b></span><i class="mv-cd"></i></button>
    </div>

    <div id="bang-wave" hidden><div class="bw-dai"><b></b><span></span></div></div>
    <div id="cutin" hidden><div class="ci-nen"></div><div class="ci-po-hop"><img class="ci-po" alt=""></div><div class="ci-chu"><small>COMMANDER SKILL</small><b></b><span></span></div><img class="ci-ki" alt=""></div>

    <!-- MENU (HUD mượt A): 2 màn trong #chon — HOME (.hm: hồ sơ, logo, ảnh lớn, chọn chế độ, PLAY, DECK/COLLECTION) và XÂY BỘ BÀI (.dk).
         #chon hiện = đang ở menu (mọi file khác vẫn dựa vào điều này); #chon.xem-dk = đang ở màn bộ bài. js/home.js lo chuyển màn + các bảng trượt. -->

      <div class="hm" id="hm">
        <img class="hm-nen" src="assets/nen_home.jpg" alt="">

          <button class="hm-ic hm-ic1" data-act="hm-cai" aria-label="Settings"><img src="assets/p7_ic_caidat.png" alt=""></button>
        </div>
        <img class="hm-logo" src="assets/logo.png" alt="TURRET MERGE">
        <div class="hm-duoi">

          <div class="hm-tab">
            <button data-act="hm-deck" id="hm-deck"><span class="hm-tab-u" id="hm-deck-u"></span><b>DECK</b><small id="hm-deck-so">0/5</small></button>
            <button data-act="hm-bst"><b>COLLECTION</b><small id="hm-bst-so"></small></button>
          </div>
        </div>
      </div>

      <div class="dk" id="dk">
        <img class="dk-nen" src="assets/nen_deck.jpg" alt="">
        <div class="dk-dau">
          <button class="hm-ic hm-ic1 dk-lui" data-act="hm-ve" aria-label="Back"><img src="assets/p7_ic_lui.png" alt=""></button>

          <button class="hm-ic hm-ic1 dk-pre" data-act="hm-pre" aria-label="Preset decks"><img src="assets/p7_ic_bomau.png" alt=""></button>
        </div>
        <div class="chon-dau">
          <div class="dk-dem"><span><b id="chon-dem">0/5</b> <span>SELECTED</span></span><button class="dk-chu" data-act="ngaunhien">RANDOM</button></div>

        </div>
        <button class="dk-noi" id="dk-noi" data-act="hm-noi"></button>
        <button class="dk-mv" id="dk-mv" data-act="hm-mvs"></button>
        <div class="dk-tim"><label class="dk-o" id="dk-o"><img class="dk-o-ic" src="assets/p7_ic_tim.png" alt=""></label><button class="hm-ic hm-ic1 dk-loc" data-act="hm-loc" id="dk-loc" aria-label="Filter and sort"><img src="assets/p7_ic_loc.png" alt=""><i id="dk-loc-so" hidden></i></button></div>
        <div id="chon-luoi"></div>
        <div class="chon-cuoi">
          <div class="chon-mv" id="chon-mv" hidden></div>
          <div class="chon-che" hidden>
            <button class="che" data-act="che" data-che="coop"><b>CO-OP</b><span data-t="coopSub"></span></button>
            <button class="che" data-act="che" data-che="solo"><b>SOLO</b><span data-t="soloSub"></span></button>
            <button class="che" data-act="che" data-che="pvp"><b>PVP</b><span data-t="pvpSub"></span></button>
          </div>
          <button class="nut-xep" data-act="xep" id="nut-xep" hidden>SORT: TIER</button>
          <button class="hm-choi dk-choi" data-act="hm-choi" id="nut-vao" disabled><b>PLAY</b><small id="dk-choi-phu"></small></button>
        </div>
      </div>
      <div class="hm-mo" id="hm-mo" hidden><div class="hm-mo-nen" data-act="hm-dong"></div><div class="hm-tam" id="hm-tam"></div></div>
    </div>

    <div id="dung" class="man phu" hidden>
      <div class="bang">
        <div class="bang-ten" data-t="paused">PAUSED</div>
        <div class="bang-nut">

          <button class="nut chinh" data-act="choilai" data-t="again">PLAY AGAIN</button>
        </div>
      </div>

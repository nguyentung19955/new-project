<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cắt ảnh game</title>
<!-- Mở bằng Chrome / Edge (bấm đúp file), không cần cài gì. Kéo thả thư mục "D:\ảnh game" vào trang → xem trước → tải da-cat.zip.
     Cắt giống tools/cat_anh.py (cùng thuật toán với tools/cat-sheet.py · cat-fx.py · cat-icons.py). Hướng dẫn: docs/HUONG-DAN-CAT-ANH.md -->
<style>
:root{--bg:#f6f1e7;--card:#fff;--ink:#2a1608;--mute:#7a6a5a;--ok:#2e9a3e;--warn:#d99000;--bad:#d03030;--line:#e3d8c6;--acc:#b5651d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a16;--card:#2a241e;--ink:#f1e6d6;--mute:#b3a48f;--line:#3d342b;--acc:#e09a50}}
:root[data-theme="dark"]{--bg:#1e1a16;--card:#2a241e;--ink:#f1e6d6;--mute:#b3a48f;--line:#3d342b;--acc:#e09a50}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 12px}
#tha{border:3px dashed var(--acc);border-radius:14px;padding:26px 16px;text-align:center;background:var(--card);cursor:pointer}
#tha.over{background:#fff3e0}
#tha b{font-size:18px}
.nut{display:inline-block;margin:6px 4px 0;padding:9px 16px;border-radius:9px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.nut.phu{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.nut:disabled{opacity:.45;cursor:default}
#tong{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#tong .dem{flex:1;min-width:200px}
.the{background:var(--card);border-radius:10px;margin:10px 0;padding:10px 12px;border-left:6px solid var(--line)}
.the.tot{border-color:var(--ok)}.the.canh{border-color:var(--warn)}.the.loi{border-color:var(--bad)}
.dau{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dau .ten{font-weight:700;word-break:break-all}
.dau input{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;min-width:230px;background:var(--bg);color:var(--ink)}
.nhan{font-size:13px;color:var(--mute)}
ul.tb{margin:4px 0;padding-left:20px}ul.tb li.e{color:var(--bad)}ul.tb li.w{color:var(--warn)}
.xem{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:6px}
.o{background:repeating-conic-gradient(#d8d8d8 0 25%,#fff 0 50%) 0 0/12px 12px;border-radius:6px}
canvas.chay{max-height:160px;max-width:100%;height:auto}
.khung{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;flex:1 1 220px;min-width:0}
.khung figure{max-width:100%}
.khung figure{margin:0;text-align:center;font-size:11px;color:var(--mute)}
.khung canvas{max-height:64px;max-width:100%;height:auto;display:block}
.goc{max-height:90px;max-width:100%;border-radius:6px;border:1px solid var(--line)}
@media (max-width:600px){.dau input{min-width:0;width:100%}canvas.chay{max-height:120px}}
</style>
</head>
<body>
<main>
<h1>Cắt ảnh game</h1>
<p class="sub">Kéo thả cả thư mục ảnh AI vừa gen (ví dụ <b>D:\ảnh game</b>) vào ô dưới. Tool tự nhận ảnh theo tên file, xoá nền hồng tím, cắt từng khung, rồi cho tải <b>da-cat.zip</b> đúng cấu trúc thư mục <code>assets/</code> của game.</p>
<div id="tha" tabindex="0">
  <b>Thả thư mục hoặc ảnh vào đây</b><br>
  <span class="nhan">hoặc</span><br>
  <button class="nut" id="nut-thu-muc" type="button">Chọn thư mục…</button>
  <button class="nut phu" id="nut-anh" type="button">Chọn ảnh…</button>
  <input id="chon-thu-muc" type="file" webkitdirectory multiple hidden>
  <input id="chon-anh" type="file" accept="image/*" multiple hidden>
</div>
<div id="tong" hidden>
  <span class="dem" id="dem"></span>
  <button class="nut" id="tai" type="button" disabled>Tải da-cat.zip</button>
  <button class="nut phu" id="xoa" type="button">Làm lại</button>
</div>
<div id="ds"></div>
<datalist id="dl"></datalist>
</main>

// ═════════════ ảnh: {w, h, c (số kênh 4 = RGBA, 2 = LA), d: Uint8ClampedArray RGBA} ═════════════
const mk = (w, h, c = 4) => ({ w, h, c, d: new Uint8ClampedArray(w * h * 4) });
const clone = (im) => ({ w: im.w, h: im.h, c: im.c, d: new Uint8ClampedArray(im.d) });
const rhe = (x) => { const f = Math.floor(x), r = x - f; return r > 0.5 ? f + 1 : r < 0.5 ? f : (f % 2 === 0 ? f : f + 1); }; // numpy round (nửa → chẵn)
const clip = (x, a, b) => (x < a ? a : x > b ? b : x);

function crop(im, x0, y0, x1, y1) {          // như PIL crop: ngoài ảnh = trong suốt
  const w = Math.max(0, x1 - x0), h = Math.max(0, y1 - y0), o = mk(w, h, im.c);
  for (let y = 0; y < h; y++) {
    const sy = y + y0; if (sy < 0 || sy >= im.h) continue;
    for (let x = 0; x < w; x++) {
      const sx = x + x0; if (sx < 0 || sx >= im.w) continue;
      const s = (sy * im.w + sx) * 4, t = (y * w + x) * 4;
      o.d[t] = im.d[s]; o.d[t + 1] = im.d[s + 1]; o.d[t + 2] = im.d[s + 2]; o.d[t + 3] = im.d[s + 3];
    }
  }
  return o;
}
function bbox(im) {                           // như PIL getbbox (kênh alpha) → [x0,y0,x1,y1] hoặc null
  let x0 = im.w, y0 = im.h, x1 = -1, y1 = -1;
  for (let y = 0; y < im.h; y++) for (let x = 0; x < im.w; x++) if (im.d[(y * im.w + x) * 4 + 3]) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  return x1 < 0 ? null : [x0, y0, x1 + 1, y1 + 1];
}
function paste(dst, src, ox, oy) {            // dán thay (không trộn) như PIL paste không mặt nạ
  for (let y = 0; y < src.h; y++) for (let x = 0; x < src.w; x++) {
    const X = x + ox, Y = y + oy; if (X < 0 || Y < 0 || X >= dst.w || Y >= dst.h) continue;
    const s = (y * src.w + x) * 4, t = (Y * dst.w + X) * 4;
    for (let k = 0; k < 4; k++) dst.d[t + k] = src.d[s + k];
  }
}
function median(arr) { const a = Float64Array.from(arr).sort(); const n = a.length; return n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2; }
function edgePixels(im, m) {                  // hàng trên m · dưới m · cột trái m · phải m (như numpy concatenate)
  const out = [];
  const add = (x, y) => { const i = (y * im.w + x) * 4; out.push([im.d[i], im.d[i + 1], im.d[i + 2]]); };
  for (let y = 0; y < Math.min(m, im.h); y++) for (let x = 0; x < im.w; x++) add(x, y);
  for (let y = Math.max(0, im.h - m); y < im.h; y++) for (let x = 0; x < im.w; x++) add(x, y);
  for (let y = 0; y < im.h; y++) for (let x = 0; x < Math.min(m, im.w); x++) add(x, y);
  for (let y = 0; y < im.h; y++) for (let x = Math.max(0, im.w - m); x < im.w; x++) add(x, y);
  return out;
}
const borderColor = (im) => { const e = edgePixels(im, 6); return [0, 1, 2].map((k) => median(e.map((p) => p[k]))); };
const isPink = ([r, g, b]) => r > 150 && g < 120 && b > 60 && r > b + 40 && b > g + 20;

function dilate7(mask, w, h) {                // PIL MaxFilter(7) (mép lặp lại = cửa sổ cắt theo ảnh)
  const t = new Uint8Array(w * h), o = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let v = 0; for (let k = Math.max(0, x - 3); k <= Math.min(w - 1, x + 3); k++) if (mask[y * w + k]) { v = 1; break; }
    t[y * w + x] = v;
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let v = 0; for (let k = Math.max(0, y - 3); k <= Math.min(h - 1, y + 3); k++) if (t[k * w + x]) { v = 1; break; }
    o[y * w + x] = v;
  }
  return o;
}
function label(mask, w, h) {                  // nhãn liên thông 4 hướng (như scipy.ndimage.label mặc định)
  const lab = new Int32Array(w * h); let n = 0; const st = new Int32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    if (!mask[i] || lab[i]) continue;
    n++; let sp = 0; st[sp++] = i; lab[i] = n;
    while (sp) {
      const p = st[--sp], x = p % w, y = (p - x) / w;
      if (x > 0 && mask[p - 1] && !lab[p - 1]) { lab[p - 1] = n; st[sp++] = p - 1; }
      if (x < w - 1 && mask[p + 1] && !lab[p + 1]) { lab[p + 1] = n; st[sp++] = p + 1; }
      if (y > 0 && mask[p - w] && !lab[p - w]) { lab[p - w] = n; st[sp++] = p - w; }
      if (y < h - 1 && mask[p + w] && !lab[p + w]) { lab[p + w] = n; st[sp++] = p + w; }
    }
  }
  return { lab, n };
}
function borderLabels(lab, w, h) {
  const s = new Set();
  for (let x = 0; x < w; x++) { s.add(lab[x]); s.add(lab[(h - 1) * w + x]); }
  for (let y = 0; y < h; y++) { s.add(lab[y * w]); s.add(lab[y * w + w - 1]); }
  s.delete(0); return s;
}

function frameCounts(names) {
  const cnt = {};
  for (const n of names) {
    if (n === 'head') continue;
    if (!n.includes('_')) { cnt[n] = 1; continue; }
    const a = n.slice(0, n.lastIndexOf('_'));
    while (names.includes(`${a}_${(cnt[a] || 0) + 1}`)) cnt[a] = (cnt[a] || 0) + 1;
  }
  return cnt;
}

function keyMagenta(im) {

    const r = im.d[i * 4], g = im.d[i * 4 + 1], b = im.d[i * 4 + 2];
    let a = im.d[i * 4 + 3], nr = r, nb = b;
    const edge = dil[i] && !bg[i], m = Math.min(r, b) - g;

    o.d[i * 4] = nr; o.d[i * 4 + 1] = g; o.d[i * 4 + 2] = nb; o.d[i * 4 + 3] = clip(rhe(a), 0, 255);
  }
  return o;
}

  inp.onchange = () => { const v = inp.value.trim().toLowerCase(); it.key = v in DANH_SACH ? v : null; it.doan = false; it.done = false; render(it); run(); };
  const nhan = document.createElement('span'); nhan.className = 'nhan';
  nhan.textContent = it.key ? `${DANH_SACH[it.key][2]} · ${k ? k.kind : DANH_SACH[it.key][0]}` + (it.done ? '' : ' · đang cắt…') : '';
  dau.append(ten, '→', inp, nhan); el.appendChild(dau);
  if (errs.length || warns.length) {

    for (const m of errs) { const li = document.createElement('li'); li.className = 'e'; li.textContent = m; ul.appendChild(li); }
    for (const m of warns) { const li = document.createElement('li'); li.className = 'w'; li.textContent = m; ul.appendChild(li); }
    el.appendChild(ul);
  }

  if (it.raw && (!k || !Object.keys(k.files).length)) { const g = toCanvas(it.raw); g.className = 'goc'; xem.appendChild(g); }
  if (k && Object.keys(k.files).length) {
    const frames = k.anim.map((p) => k.files[p][1]).filter(Boolean);
    if (k.strip) { const im = Object.values(k.files)[0][1]; for (let i = 0; i < k.strip.n; i++) frames.push(crop(im, i * k.strip.hh, 0, (i + 1) * k.strip.hh, k.strip.hh)); }
    if (frames.length) {
      const W = Math.max(...frames.map((f) => f.w)), H = Math.max(...frames.map((f) => f.h));
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cv.className = 'o chay';
      const cvs = frames.map(toCanvas); let i = 0;
      const draw = () => { if (!cv.isConnected) return; const g = cv.getContext('2d'); g.clearRect(0, 0, W, H); const f = cvs[i % cvs.length]; g.drawImage(f, (W - f.width) / 2, H - f.height); i++; setTimeout(draw, 150); };
      xem.appendChild(cv); setTimeout(draw, 0);
    }

}
async function zipBytes() {
  const entries = [], frames = {}, lines = [], enc = new TextEncoder(), taken = new Set();
  for (const it of ITEMS.slice().reverse()) {        // ảnh sau ghi đè ảnh trước cùng mã
    const k = it.ket;
    lines.unshift(`${it.path} → ${it.key || '?'}${k ? ` (${k.kind})` : ''}${k && k.err.length ? ' · LỖI: ' + k.err.join('; ') : ''}${k && k.warn.length ? ' · ' + k.warn.join('; ') : ''}${!it.key ? ' · không nhận ra tên file' : ''}`);
    if (!k || taken.has(it.key)) continue;
    taken.add(it.key);
    const bytes = {};
    for (const [p, [how, im]] of Object.entries(k.files)) { bytes[p] = await encodePNG(im, how === 'light'); entries.push({ name: 'assets/' + p, data: bytes[p] }); }
    for (const [p, src] of Object.entries(k.alias)) entries.push({ name: 'assets/' + p, data: bytes[src] });
    for (const p of k.marks) entries.push({ name: 'assets/' + p, data: new Uint8Array(0) });
    if (k.frames) Object.assign(frames, k.frames);
  }
  entries.sort((a, b) => (a.name < b.name ? -1 : 1));
  entries.push({ name: 'pack-frames.json', data: enc.encode(JSON.stringify(frames, null, 1)) });
  entries.push({ name: 'bao-cao.txt', data: enc.encode(lines.join('\r\n') + '\r\n') });
  return makeZip(entries);
}
window.__catAnh = { zipBytes, nhanDien, ITEMS };
$('tai').onclick = async () => {

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'da-cat.zip'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000); $('tai').disabled = false;
};
$('xoa').onclick = () => { ITEMS.length = 0; $('ds').innerHTML = ''; $('tong').hidden = true; };
$('nut-thu-muc').onclick = (e) => { e.stopPropagation(); $('chon-thu-muc').click(); };
$('nut-anh').onclick = (e) => { e.stopPropagation(); $('chon-anh').click(); };
$('tha').onclick = () => $('chon-anh').click();
for (const id of ['chon-thu-muc', 'chon-anh']) $(id).onchange = (e) => { addFiles([...e.target.files]); e.target.value = ''; };
async function walk(entry, pre, out) {
  if (entry.isFile) { const f = await new Promise((r, j) => entry.file(r, j)); f.path = pre + f.name; out.push(f); return; }
  if (entry.name === 'da-cat') return;
  const rd = entry.createReader();
  for (;;) { const b = await new Promise((r, j) => rd.readEntries(r, j)); if (!b.length) break; for (const e of b) await walk(e, pre + entry.name + '/', out); }
}
const tha = $('tha');
tha.ondragover = (e) => { e.preventDefault(); tha.classList.add('over'); };
tha.ondragleave = () => tha.classList.remove('over');
document.body.ondragover = (e) => e.preventDefault();
document.body.ondrop = tha.ondrop = async (e) => {
  e.preventDefault(); e.stopPropagation(); tha.classList.remove('over');
  const out = [], ents = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (ents.length) for (const en of ents) await walk(en, '', out); else out.push(...e.dataTransfer.files);
  addFiles(out);
};

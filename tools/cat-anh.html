<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cắt ảnh game</title>
<!-- Mở bằng Chrome / Edge (bấm đúp file), không cần cài gì. Kéo thả thư mục "D:\ảnh game" vào trang → xem trước → tải da-cat.zip.
     Cắt giống tools/cat_anh.py (cùng thuật toán với tools/cat-sheet.py · cat-fx.py · cat-icons.py). Hướng dẫn: docs/HUONG-DAN-CAT-ANH.md -->
<style>
:root{--bg:#f6f1e7;--card:#fff;--ink:#2a1608;--mute:#7a6a5a;--ok:#2e9a3e;--warn:#d99000;--bad:#d03030;--line:#e3d8c6;--acc:#b5651d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a16;--card:#2a241e;--ink:#f1e6d6;--mute:#b3a48f;--line:#3d342b;--acc:#e09a50}}
:root[data-theme="dark"]{--bg:#1e1a16;--card:#2a241e;--ink:#f1e6d6;--mute:#b3a48f;--line:#3d342b;--acc:#e09a50}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 12px}
#tha{border:3px dashed var(--acc);border-radius:14px;padding:26px 16px;text-align:center;background:var(--card);cursor:pointer}
#tha.over{background:#fff3e0}
#tha b{font-size:18px}
.nut{display:inline-block;margin:6px 4px 0;padding:9px 16px;border-radius:9px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.nut.phu{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.nut:disabled{opacity:.45;cursor:default}
#tong{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#tong .dem{flex:1;min-width:200px}
#tai{display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}#tai .nut{margin:0}
.the{background:var(--card);border-radius:10px;margin:10px 0;padding:10px 12px;border-left:6px solid var(--line)}
.the.tot{border-color:var(--ok)}.the.canh{border-color:var(--warn)}.the.loi{border-color:var(--bad)}.the.bo{border-color:var(--line);opacity:.7}
.dau{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dau .ten{font-weight:700;word-break:break-all}
.dau input{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;min-width:230px;background:var(--bg);color:var(--ink)}
.nhan{font-size:13px;color:var(--mute)}
ul.tb{margin:4px 0;padding-left:20px}ul.tb li.e{color:var(--bad)}ul.tb li.w{color:var(--warn)}
.xem{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:6px}
.o{background:repeating-conic-gradient(#d8d8d8 0 25%,#fff 0 50%) 0 0/12px 12px;border-radius:6px}
canvas.chay{max-height:160px;max-width:100%;height:auto}
.khung{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;flex:1 1 220px;min-width:0}
.khung figure{max-width:100%}
.khung figure{margin:0;text-align:center;font-size:11px;color:var(--mute)}
.khung canvas{max-height:64px;max-width:100%;height:auto;display:block}
.goc{max-height:90px;max-width:100%;border-radius:6px;border:1px solid var(--line)}
@media (max-width:600px){.dau input{min-width:0;width:100%}canvas.chay{max-height:120px}}
</style>
</head>
<body>
<main>
<h1>Cắt ảnh game</h1>
<p class="sub">Kéo thả cả thư mục ảnh AI vừa gen (ví dụ <b>D:\ảnh game</b>) vào ô dưới. Tool tự nhận ảnh theo tên file, xoá nền hồng tím, cắt từng khung, rồi cho tải <b>da-cat.zip</b> đúng cấu trúc thư mục <code>assets/</code> của game.</p>
<div id="tha" tabindex="0">
  <b>Thả thư mục hoặc ảnh vào đây</b><br>
  <span class="nhan">hoặc</span><br>
  <button class="nut" id="nut-thu-muc" type="button">Chọn thư mục…</button>
  <button class="nut phu" id="nut-anh" type="button">Chọn ảnh…</button>
  <input id="chon-thu-muc" type="file" webkitdirectory multiple hidden>
  <input id="chon-anh" type="file" accept="image/*" multiple hidden>
</div>
<div id="tong" hidden>
  <span class="dem" id="dem"></span>
  <span id="tai"></span>
  <button class="nut phu" id="xoa" type="button">Làm lại</button>
</div>
<div id="ds"></div>
<datalist id="dl"></datalist>
</main>

function keyMagenta(im) {

function keyPink(im) {

name: Build Android APK

on:
  push:
    branches: [claude/mobile-tower-defense-game-k5oxzo, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest có sẵn Android SDK (ANDROID_HOME); chấp nhận giấy phép để Gradle tự tải bản SDK còn thiếu
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npm run build:web
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: than-thoai-viet-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # link tải thẳng trên điện thoại (không cần đăng nhập GitHub):
      # https://github.com/<chủ repo>/<repo>/releases/download/apk-latest/than-thoai-viet.apk
      # (v145 đổi tên game; vẫn đăng kèm nui-cao-nuoc-dang.apk để link cũ không chết)
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk than-thoai-viet.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk nui-cao-nuoc-dang.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Bản cài Android mới nhất
          body: Bản thử (debug) build tự động từ nhánh ${{ github.ref_name }}, commit ${{ github.sha }}.
          prerelease: true
          make_latest: false
          files: |
            than-thoai-viet.apk
            nui-cao-nuoc-dang.apk

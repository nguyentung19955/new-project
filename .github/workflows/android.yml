name: Build Android APK

on:
  push:
    branches: [claude/mobile-tower-defense-game-k5oxzo, main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest có sẵn Android SDK (ANDROID_HOME); chấp nhận giấy phép để Gradle tự tải bản SDK còn thiếu
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npm run build:web
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nui-cao-nuoc-dang-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

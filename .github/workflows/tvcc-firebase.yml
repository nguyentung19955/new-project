# Đưa game "Tiếng Vọng Cuối Cùng" lên Firebase Hosting (gói MIỄN PHÍ Spark) + cập nhật quy tắc Firestore + kiểm lưu mây.
# Phép thử (lõi + Firebase Emulator) luôn chạy. Triển khai chỉ chạy khi có bí mật service account (chưa có thì tự bỏ qua).
# Xem tieng-vong-cuoi-cung/docs/firebase/BAO-CAO.md
name: tvcc-firebase
on:
  workflow_dispatch:
  push:
    branches: [tieng-vong-cuoi-cung]
    paths:
      - 'tieng-vong-cuoi-cung/game/**'
      - 'tieng-vong-cuoi-cung/firebase.json'
      - 'tieng-vong-cuoi-cung/firestore.rules'
      - 'tieng-vong-cuoi-cung/tools/firebase/**'
      - '.github/workflows/tvcc-firebase.yml'
concurrency:
  group: tvcc-firebase
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TIENG_VONG || secrets.FIREBASE_SERVICE_ACCOUNT }}
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'tieng-vong-cuoi-cun' }}
    defaults:
      run:
        working-directory: tieng-vong-cuoi-cung
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false, sparse-checkout: "tieng-vong-cuoi-cung/game\ntieng-vong-cuoi-cung/art\ntieng-vong-cuoi-cung/tools/firebase\ntieng-vong-cuoi-cung/firebase.json\ntieng-vong-cuoi-cung/firestore.rules\ntieng-vong-cuoi-cung/.firebaserc", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Phép thử lõi lưu mây
        run: node tools/firebase/kiem-thu-luu-may.js
      - name: Cài Firebase JS SDK (chỉ để kiểm)
        run: npm i --no-save --no-audit --no-fund firebase@10.14.1
      - name: Phép thử với Firebase Emulator (Auth + Firestore + firestore.rules)
        run: npx -y firebase-tools@13 emulators:exec --only auth,firestore --project demo-tvcc "node tools/firebase/kiem-thu-emulator.mjs"
      - name: Triển khai Hosting + quy tắc Firestore
        if: env.SA != ''
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only hosting --project "$PROJECT" --non-interactive
          # quy tắc Firestore: service account cần quyền "Firebase Rules Admin"; không có thì bỏ qua (dán tay trong Firestore ▸ Rules)
          npx -y firebase-tools@13 deploy --only firestore:rules --project "$PROJECT" --non-interactive || echo "::warning::Không cập nhật được quy tắc Firestore – dán tay firestore.rules"
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Kiểm dự án Firebase thật (đăng nhập khách + ghi/đọc bản lưu thử)
        if: env.SA != ''
        continue-on-error: true
        run: |
          node tools/firebase/kiem-tra-du-an-that.mjs
          { echo "## Kiểm lưu mây trên dự án thật"; echo '```'; cat ket-qua-kiem-tra-that.txt; echo '```'; echo "Link chơi: https://$PROJECT.web.app/"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Kiểm đăng nhập Google trên dự án thật (Google provider, Authorized domains) + bản đã lên Hosting
        if: env.SA != ''
        continue-on-error: true
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" PROJECT="$PROJECT" node tools/firebase/kiem-nha-cung-cap-google.mjs
          rm -f "$RUNNER_TEMP/sa.json"
          if curl -fsS "https://$PROJECT.web.app/game/dang-nhap.js" | grep -q "Sign in with Google"; then echo "ĐẠT Hosting: đã có ô đăng nhập Google (game/dang-nhap.js)" >> ket-qua-google.txt; else echo "CHƯA Hosting: chưa thấy game/dang-nhap.js" >> ket-qua-google.txt; fi
          { echo "## Đăng nhập Google trên dự án thật"; echo '```'; cat ket-qua-google.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

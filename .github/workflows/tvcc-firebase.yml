# Đưa game "Tiếng Vọng Cuối Cùng" lên Firebase Hosting (gói MIỄN PHÍ Spark) + cập nhật quy tắc Firestore.
# Chỉ chạy khi đã có bí mật FIREBASE_SERVICE_ACCOUNT (xem tieng-vong-cuoi-cung/docs/firebase/BAO-CAO.md).
# Chưa có bí mật → bước triển khai tự bỏ qua, không báo lỗi.
name: tvcc-firebase
on:
  workflow_dispatch:
  push:
    branches: [tieng-vong-cuoi-cung]
    paths:
      - 'tieng-vong-cuoi-cung/game/**'
      - 'tieng-vong-cuoi-cung/firebase.json'
      - 'tieng-vong-cuoi-cung/firestore.rules'
      - '.github/workflows/tvcc-firebase.yml'
concurrency:
  group: tvcc-firebase
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TIENG_VONG || secrets.FIREBASE_SERVICE_ACCOUNT }}
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'tieng-vong-cuoi-cun' }}
    steps:
      - name: Kiểm có bí mật chưa
        id: co
        run: if [ -n "$SA" ]; then echo "co=1" >> "$GITHUB_OUTPUT"; else echo "Chưa có FIREBASE_SERVICE_ACCOUNT – bỏ qua triển khai."; fi
      - uses: actions/checkout@v4
        if: steps.co.outputs.co == '1'
        with: { lfs: false }
      - uses: actions/setup-node@v4
        if: steps.co.outputs.co == '1'
        with: { node-version: 20 }
      - name: Phép thử lõi lưu mây
        if: steps.co.outputs.co == '1'
        working-directory: tieng-vong-cuoi-cung
        run: node tools/firebase/kiem-thu-luu-may.js
      - name: Triển khai Hosting (+ thử quy tắc Firestore)
        if: steps.co.outputs.co == '1'
        working-directory: tieng-vong-cuoi-cung
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only hosting --project "$PROJECT" --non-interactive
          # quy tắc Firestore: thử cập nhật, lỗi quyền thì bỏ qua (dán tay trong Firestore ▸ Rules cũng được)
          npx -y firebase-tools@13 deploy --only firestore:rules --project "$PROJECT" --non-interactive || echo "Không cập nhật được quy tắc Firestore – dán tay firestore.rules"
          rm -f "$RUNNER_TEMP/sa.json"

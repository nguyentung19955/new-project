<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Render 3D sang sprite (thử nghiệm)</title>
<style>body{margin:0;background:#4a4e56;color:#fff;font:14px sans-serif}#out{display:flex;flex-wrap:wrap;gap:4px;padding:8px}#out canvas,#out img{background:#5e636c}button{font-size:16px;margin:8px;padding:8px 14px}</style>
</head><body>
<div><button id="btnGh">Mở GitHub</button><button id="btnGui">Gửi lên GitHub</button><span id="tt">đang tải…</span></div>
<div id="out"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const url = q.get('glb'), ten = q.get('ten') || 'thu', elev = +(q.get('elev') || 62), S = +(q.get('size') || 256), outl = +(q.get('vien') || 0.018);
const tt = document.getElementById('tt');
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(S, S); r.setClearColor(0x000000, 0); r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const gltf = await new GLTFLoader().loadAsync(url);
const model = gltf.scene;
// unlit (giữ màu vẽ gốc) + viền đen kiểu anime (inverted hull)
const vienMat = new THREE.MeshBasicMaterial({ color: 0x14101a, side: THREE.BackSide });
const meshes = []; model.traverse((o) => { if (o.isMesh) meshes.push(o); });
for (const m of meshes) {
  const map = m.material.map; m.material = new THREE.MeshBasicMaterial({ map, color: map ? 0xffffff : m.material.color });
  const v = new THREE.Mesh(m.geometry, vienMat); v.scale.setScalar(1 + outl); m.add(v);
}
const box = new THREE.Box3().setFromObject(model), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
model.position.sub(c); model.position.y += sz.y / 2;   // chân ở y=0
const root = new THREE.Group(); root.add(model); scene.add(root);
const R = Math.max(sz.x, sz.y, sz.z) * 0.62;
const cam = new THREE.OrthographicCamera(-R, R, R, -R, 0.01, 100);
const e = elev * Math.PI / 180, dist = 10;
cam.position.set(0, sz.y * 0.45 + dist * Math.sin(e), dist * Math.cos(e)); cam.lookAt(0, sz.y * 0.45, 0);
const HUONG = ['s', 'sw', 'w', 'nw', 'n', 'ne', 'e', 'se'];
const out = document.getElementById('out'); const files = [];
function chup(name) { r.render(scene, cam); const cv = document.createElement('canvas'); cv.width = S; cv.height = S; cv.getContext('2d').drawImage(r.domElement, 0, 0); out.appendChild(cv); return new Promise((ok) => cv.toBlob((b) => { files.push({ name, blob: b }); ok(); }, 'image/png')); }
// 1) 8 hướng tĩnh — quay mô hình (nhìn S = mặt hướng camera)
for (let i = 0; i < 8; i++) { root.rotation.y = -i * Math.PI / 4; await chup(`${ten}_${HUONG[i]}.png`); }
// 2) sheet thở 12 khung cho hướng S và W (nhún + nghiêng rất nhẹ cả mô hình)
for (const [hi, hn] of [[0, 's'], [2, 'w']]) {
  const sheet = document.createElement('canvas'); sheet.width = S * 12; sheet.height = S; const g = sheet.getContext('2d');
  for (let f = 0; f < 12; f++) { const t = f / 12 * Math.PI * 2; root.rotation.y = -hi * Math.PI / 4; root.position.y = Math.sin(t) * sz.y * 0.012; root.scale.set(1 + Math.sin(t) * 0.006, 1 - Math.sin(t) * 0.006, 1 + Math.sin(t) * 0.006); r.render(scene, cam); g.drawImage(r.domElement, f * S, 0); }
  root.position.y = 0; root.scale.set(1, 1, 1);
  out.appendChild(sheet); sheet.style.width = '100%';
  await new Promise((ok) => sheet.toBlob((b) => { files.push({ name: `${ten}_tho_${hn}.png`, blob: b }); ok(); }, 'image/png'));
}
tt.textContent = `xong ${files.length} ảnh`;
let gh = null;
document.getElementById('btnGh').onclick = () => { gh = window.open('https://github.com/nguyentung19955/new-project/upload/claude/demo-hop-tuong/docs/demo-hop-tuong/thu-3d', 'gh3d'); };
document.getElementById('btnGui').onclick = () => { if (gh) gh.postMessage({ __neon: 1, files }, 'https://github.com'); tt.textContent = 'đã gửi'; };
window.__files = files;
</script></body></html>

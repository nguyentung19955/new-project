<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#04020c">
  <title>NEON GRID — Merge Defense (demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/demo.css">
</head>
<body>
  <div id="wrap">
    <canvas id="cv"></canvas>

    <!-- TOP HUD y 0..64: wave (x12..88) · boss/timer (x104..226) · 6 ô đội AI (x230..378) -->
    <div id="top" hidden>
      <div class="tb-wave"><span class="nho">WAVE</span><b id="tb-dot">1</b></div>
      <div class="tb-giua"><div id="tb-boss">BOSS IN 9</div><div id="tb-quai"><span class="nho">HOSTILES</span> <b>0</b></div><div id="tb-mang" hidden><span class="nho">CORE</span> <b>10/10</b></div></div>
      <div id="tb-ai"></div>
    </div>

    <!-- HÀNG DƯỚI kiểu DCDW: ô Mana (giọt + số) trái · nút SUMMON tím to giữa (giá) · tốc độ + tạm dừng gọn phải; 5 thẻ + thẻ Archfiend to hơn viền tím -->
    <div id="duoi" hidden>
      <div id="lk-hop"><b><i class="ic-mana"></i> <span id="lk">0</span></b><span class="nho">MANA</span></div>
      <button id="nut-trieu" data-act="trieu"><span class="tr-ten">SUMMON</span><span class="tr-gia"><i class="ic-e"></i><span id="gia-trieu">10</span></span></button>
      <button id="nut-tocdo" class="nut-nho" data-act="tocdo">1x</button>
      <button id="nut-dung" class="nut-nho" data-act="dung" aria-label="Menu"><i class="ic-dung"></i></button>
      <div id="bo-bac"></div>
      <button id="the-af" data-act="af" aria-label="Archfiend"><canvas></canvas><i class="af-cd"></i><span class="af-lv">ARCHFIEND</span><span class="af-ten">ARCHFIEND</span><span class="af-gia"><i class="ic-e"></i><b>0</b></span></button>
    </div>
    <!-- cờ đầu hàng đỏ ở đầu phải THANH GIỮA (PVP) — mở bảng tạm dừng (QUIT = đầu hàng) -->
    <button id="nut-co" data-act="dung" hidden aria-label="Surrender"><i class="ic-co"></i></button>

    <div id="chon" class="man">
      <div class="chon-dau">
        <div class="logo"><b data-t="NEON GRID">NEON GRID</b><span>MERGE DEFENSE · DEMO</span></div>
        <div class="chon-goi">SELECT 5 HEROES + 1 ARCHFIEND <span id="chon-dem">0/5</span></div>
      </div>
      <div id="chon-luoi"></div>
      <div class="chon-cuoi">
        <div class="chon-af" id="chon-af"></div>
        <div class="chon-che" id="chon-che">
          <button class="che" data-act="che" data-che="coop"><b>CO-OP</b><span>ALLY AI · 70 WAVES</span></button>
          <button class="che" data-act="che" data-che="pvp"><b>PVP</b><span>VS AI MIRROR</span></button>
        </div>
        <div class="chon-meo" id="chon-meo">Summon random heroes · drag a hero onto the <b>same hero of the same rank</b> to merge into a higher rank. Outlast the <b>AI MIRROR</b> board above.</div>
        <div class="chon-nut">
          <button class="nut" data-act="ngaunhien">RANDOM</button>
          <button class="nut chinh" data-act="vao" id="nut-vao" disabled>DEPLOY</button>
        </div>
      </div>
    </div>

    <div id="dung" class="man phu" hidden>
      <div class="bang kinh">
        <div class="bang-ten">PAUSED</div>
        <div id="dung-bo" class="dung-bo"></div>
        <div class="bang-nut">
          <button class="nut" data-act="bo">QUIT</button>
          <button class="nut chinh" data-act="tiep">RESUME</button>
        </div>
      </div>
    </div>

    <div id="ketqua" class="man phu" hidden>
      <div class="bang kinh do">
        <div class="bang-ten" id="kq-ten" data-t="CORE DESTROYED">CORE DESTROYED</div>
        <div class="kq-so">You survived to <b id="kq-dot">WAVE 0</b></div>
        <div class="kq-phu" id="kq-phu"></div>
        <div class="kq-sat" id="kq-sat" hidden></div>
        <div class="bang-nut">
          <button class="nut" data-act="doibo">CHANGE SQUAD</button>
          <button class="nut chinh" data-act="choilai">RETRY</button>
        </div>
      </div>
    </div>
  </div>


  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>

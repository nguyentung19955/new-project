<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Linh Khí</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&display=swap">
<style>
  /* Bố cục: một khung game 16:9 nằm giữa màn hình, co giãn theo cạnh ngắn hơn. Game chỉ có một giao diện tối. */
  :root {
    color-scheme: dark;
    --bg: #120d10;
    --fg: #f1ead9;
    --accent: #ffd27a;
    --frame: #3a2a22;
  }
  /* Chiều cao luôn tính theo 100% của khung chứa (không dùng 100vh) để chạy đúng khi được nhúng. */
  html, body { height: 100%; overscroll-behavior: none; touch-action: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #shell { height: 100%; box-sizing: border-box; padding-inline: 16px; padding-block: 0; }
  #fit { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; touch-action: none; }
  #stage { position: relative; outline: 1px solid var(--frame); background: #000; max-width: 100%; }
  #world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #ui { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
</style>
</head>
<body>
<div id="shell"><div id="fit"><div id="stage">
  <canvas id="world" width="480" height="270" aria-label="Màn hình game Linh Khí"></canvas>
</div><canvas id="ui"></canvas></div></div>

// ===== js/engine.js =====
// Bộ máy: canvas, co giãn màn hình, bàn phím và cảm ứng, âm thanh, lưu game, vòng lặp.
(function () {
  const G = window.G;
  const world = document.getElementById('world');
  const uiCv = document.getElementById('ui');
  const wrap = document.getElementById('stage');
  const fit = document.getElementById('fit');
  G.wx = world.getContext('2d');
  G.ux = uiCv.getContext('2d');
  G.wx.imageSmoothingEnabled = false;
  G.scale = 1;

  function resize() {
    const box = fit.getBoundingClientRect();
    const s = Math.max(0.4, Math.min(box.width / G.W, box.height / G.H));
    const cw = Math.floor(G.W * s), ch = Math.floor(G.H * s);
    wrap.style.width = cw + 'px';
    wrap.style.height = ch + 'px';
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    uiCv.width = Math.max(1, Math.round(box.width * dpr));
    uiCv.height = Math.max(1, Math.round(box.height * dpr));
    G.scale = cw / G.W;
    G.uiScale = G.scale * dpr;
    // Lề trống quanh khung game, tính theo đơn vị của game. Nút cảm ứng tận dụng phần lề này.
    G.ox = (box.width - cw) / 2; G.oy = (box.height - ch) / 2; G.dpr = dpr;
    G.mx = G.ox / G.scale; G.my = G.oy / G.scale;
    G.cx = Math.min(G.mx, 56);
    G.cy = G.my > 44 ? Math.min(G.my - 6, 124) : 0;
    G.portrait = box.height > box.width * 1.1;
  }
  function onResize() {
    const was = G.portrait;
    resize();
    // Xoay máy thì vị trí các ngón đang giữ không còn đúng nữa, bỏ hết.
    if (was !== G.portrait && G.dropPointers) G.dropPointers();
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 60));
  if (window.ResizeObserver) { try { new ResizeObserver(onResize).observe(fit); } catch (e) { /* không sao */ } }
  resize();

  // ---------- tiện ích ----------
  G.rnd = Math.random;
  G.rr = (a, b) => a + G.rnd() * (b - a);
  G.ri = (a, b) => Math.floor(G.rr(a, b + 1));
  G.pick = (arr) => arr[Math.floor(G.rnd() * arr.length)];
  G.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  G.dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  G.srand = function (seed) {
    let s = seed >>> 0 || 1;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  };

  // ---------- bàn phím ----------
  G.keys = {};
  G.keyP = {};
  window.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!G.keys[e.code]) G.keyP[e.code] = true;
    G.keys[e.code] = true;
    G.audioStart();
  });
  window.addEventListener('keyup', (e) => { G.keys[e.code] = false; });

  // ---------- con trỏ và cảm ứng ----------
  G.pointers = new Map();
  G.click = null; // một lần chạm hoàn chỉnh trong khung hình này
  G.downs = []; // các lần vừa chạm xuống trong khung hình này
  function pos(e) {
    const r = wrap.getBoundingClientRect();
    return { x: (e.clientX - r.left) / G.scale, y: (e.clientY - r.top) / G.scale };
  }
  fit.addEventListener('pointerdown', (e) => {
    if (e.cancelable) e.preventDefault();
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const p = pos(e);
    // Mã ngón có thể được dùng lại: ngón mới luôn thay ngón cũ cùng mã.
    const o = { id: e.pointerId, x: p.x, y: p.y, sx: p.x, sy: p.y, role: null, stale: false };
    G.pointers.set(e.pointerId, o);
    G.downs.push(o);
    try { fit.setPointerCapture(e.pointerId); } catch (err) { /* không sao */ }
    G.audioStart();
  });
  fit.addEventListener('pointermove', (e) => {
    const o = G.pointers.get(e.pointerId);
    if (!o) return;
    const p = pos(e);
    o.x = p.x; o.y = p.y;
  });
  function up(e) {
    const o = G.pointers.get(e.pointerId);
    if (!o) return;
    const p = pos(e);
    // Chỉ tính là một lần bấm nếu ngón không dùng để điều khiển và màn hình chưa đổi từ lúc chạm xuống.
    if (e.type === 'pointerup' && !o.role && !o.stale && Math.hypot(p.x - o.sx, p.y - o.sy) < 12) G.click = { x: o.sx, y: o.sy };
    G.pointers.delete(e.pointerId);
    G.audioStart();
  }
  fit.addEventListener('pointerup', up);
  fit.addEventListener('pointercancel', up);
  // Bỏ hết ngón đang giữ (khi mất tiêu điểm, xoay máy, ẩn trang).
  G.dropPointers = function () { G.pointers.clear(); G.downs.length = 0; G.click = null; };
  // Đánh dấu các ngón đang giữ là cũ: nhấc lên sẽ không tính là bấm vào màn hình mới.
  G.stalePointers = function () { for (const o of G.pointers.values()) o.stale = true; };
  function dropInput() { G.dropPointers(); G.keys = {}; G.keyP = {}; }
  window.addEventListener('blur', dropInput);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      dropInput();
      if (G.scene && G.scene.hide) { try { G.scene.hide(); } catch (e) { /* không sao */ } }
    }
  });
  // Chặn cuộn trang, phóng to bằng hai ngón, bảng chọn khi nhấn giữ.
  const stop = (e) => { if (e.cancelable) e.preventDefault(); };
  document.addEventListener('contextmenu', stop);
  for (const t of ['touchstart', 'touchmove', 'touchend']) fit.addEventListener(t, stop, { passive: false });
  document.addEventListener('touchmove', stop, { passive: false });
  for (const t of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'selectstart', 'dragstart']) document.addEventListener(t, stop);
  window.addEventListener('wheel', (e) => { if (e.ctrlKey) stop(e); }, { passive: false });
  G.inRect = (p, x, y, w, h) => p && p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;

  // ---------- âm thanh ----------
  let ac = null;
  G.audioStart = function () {
    if (!G.save || !G.save.sound) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume().catch(() => {});
    } catch (e) { /* máy không có âm thanh */ }
  };
  const SFX = {
    hit: [220, 0.05, 'square', 0.05], swing: [520, 0.04, 'triangle', 0.03], hurt: [110, 0.12, 'sawtooth', 0.07],
    mark: [1040, 0.09, 'sine', 0.06], evolve: [660, 0.35, 'triangle', 0.08], warn: [330, 0.1, 'square', 0.04],
    gong: [98, 0.6, 'sine', 0.12], pick: [780, 0.08, 'sine', 0.05], die: [160, 0.1, 'square', 0.04],
    fire: [300, 0.08, 'sawtooth', 0.03], poison: [180, 0.1, 'triangle', 0.04], ice: [1400, 0.06, 'sine', 0.04],
    boom: [70, 0.25, 'sawtooth', 0.1], ui: [600, 0.03, 'square', 0.03], win: [880, 0.5, 'triangle', 0.08],
  };
  G.sfx = function (name, pitch) {
    if (!ac || !G.save.sound || G.noRender || ac.state !== 'running') return;
    const d = SFX[name];
    if (!d) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = d[2];
      o.frequency.value = d[0] * (pitch || 1);
      if (name === 'evolve' || name === 'win') o.frequency.exponentialRampToValueAtTime(d[0] * 2, ac.currentTime + d[1]);
      if (name === 'boom' || name === 'hurt') o.frequency.exponentialRampToValueAtTime(d[0] * 0.5, ac.currentTime + d[1]);
      g.gain.value = d[3];
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d[1]);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + d[1] + 0.02);
    } catch (e) { /* bỏ qua lỗi âm thanh */ }
  };

  // ---------- lưu game ----------
  const KEY = 'linhkhi_save_v1';
  G.newWeapon = function (save, type, tier) {
    const w = {
      id: save.nextId++, type, tier, marks: { fire: 0, poison: 0, ice: 0 }, branch: null,
      sharpen: 0, name: null, kills: 0, bossKills: {}, affix: null,
    };
    if (tier === 2) w.affix = G.pick(Object.keys(G.AFFIX));
    save.weapons.push(w);
    return w;
  };
  G.newSave = function () {
    const s = {
      v: 1, gold: 0, ore: 0, stones: 0, mats: [0, 0, 0], shards: [0, 0, 0], forge: 1,
      heroes: {}, hero: 'smith', weapons: [], nextId: 1, carry: [null, null],
      owned: { helm: [], armor: [], charm: [] }, helm: null, armor: null, charm: null,
      stars: {}, stars2: {}, scars: {}, tut: {}, sound: true, wins: 0,
    };
    for (const k of G.HKEYS) s.heroes[k] = { unlocked: k === 'smith', lvl: 1, xp: 0, sk: { atk: 0, def: 0, elem: 0 } };
    s.carry[0] = G.newWeapon(s, 'sword', 0).id;
    s.carry[1] = G.newWeapon(s, 'bow', 0).id;
    return s;
  };
  G.loadSave = function () {
    let s = null;
    try {
      const raw = window.localStorage.getItem(KEY);
      if (raw) s = JSON.parse(raw);
    } catch (e) { s = null; }
    G.save = G.fixSave(s);
  };
  // Kiểm tra bản lưu cũ hoặc hỏng: thiếu gì thì bù, sai gì thì sửa, hỏng nặng thì tạo mới.
  G.fixSave = function (s) {
    const base = G.newSave();
    try {
      if (!s || typeof s !== 'object' || Array.isArray(s) || s.v !== 1) return base;
      const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
      const obj = (v) => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
      const arr3 = (v) => [0, 1, 2].map((i) => Math.max(0, num(Array.isArray(v) ? v[i] : 0, 0)));
      for (const k in base) if (!(k in s)) s[k] = base[k];
      for (const k of ['gold', 'ore', 'stones', 'wins']) s[k] = Math.max(0, Math.floor(num(s[k], 0)));
      s.mats = arr3(s.mats); s.shards = arr3(s.shards);
      s.forge = G.clamp(Math.floor(num(s.forge, 1)), 1, G.FORGE_CAP.length - 1);
      s.sound = s.sound !== false;
      for (const k of ['stars', 'stars2', 'scars', 'tut']) s[k] = obj(s[k]);
      for (const k of ['stars', 'stars2']) for (const id in s[k]) s[k][id] = G.clamp(Math.floor(num(s[k][id], 1)), 1, 3);
      for (const id in s.scars) if (!G.ELS.includes(s.scars[id])) delete s.scars[id];
      // hero
      s.heroes = obj(s.heroes);
      for (const k of G.HKEYS) {
        const h = obj(s.heroes[k]), sk = obj(h.sk);
        const lvl = G.clamp(Math.floor(num(h.lvl, 1)), 1, G.MAX_LEVEL);
        const fix = { unlocked: k === 'smith' || !!h.unlocked, lvl, xp: Math.max(0, num(h.xp, 0)), sk: {} };
        for (const b of G.SKEYS) fix.sk[b] = G.clamp(Math.floor(num(sk[b], 0)), 0, 5);
        if (fix.sk.atk + fix.sk.def + fix.sk.elem > Math.floor(lvl / 3)) fix.sk = { atk: 0, def: 0, elem: 0 };
        s.heroes[k] = Object.assign(h, fix);
      }
      if (!G.HKEYS.includes(s.hero) || !s.heroes[s.hero].unlocked) s.hero = 'smith';
      // vũ khí
      const seen = {};
      s.weapons = (Array.isArray(s.weapons) ? s.weapons : []).filter((w) => {
        if (!w || typeof w !== 'object' || !G.WTYPES[w.type] || typeof w.id !== 'number' || seen[w.id]) return false;
        seen[w.id] = true;
        w.tier = G.clamp(Math.floor(num(w.tier, 0)), 0, G.TIERS.length - 1);
        const m = obj(w.marks);
        w.marks = { fire: Math.max(0, num(m.fire, 0)), poison: Math.max(0, num(m.poison, 0)), ice: Math.max(0, num(m.ice, 0)) };
        w.branch = G.ELS.includes(w.branch) ? w.branch : null;
        w.sharpen = G.clamp(Math.floor(num(w.sharpen, 0)), 0, 10);
        w.name = typeof w.name === 'string' ? w.name : null;
        w.kills = Math.max(0, num(w.kills, 0));
        w.bossKills = obj(w.bossKills);
        w.affix = G.AFFIX[w.affix] ? w.affix : null;
        return true;
      });
      s.nextId = Math.max(Math.floor(num(s.nextId, 1)), 1, ...s.weapons.map((w) => w.id + 1));
      if (!s.weapons.length) G.newWeapon(s, 'sword', 0);
      if (s.weapons.length < 2) G.newWeapon(s, 'bow', 0);
      const has = (id) => s.weapons.some((w) => w.id === id);
      const c = Array.isArray(s.carry) ? s.carry.slice(0, 2) : [];
      for (let i = 0; i < 2; i++) {
        if (!has(c[i]) || (i === 1 && c[1] === c[0])) {
          const free = s.weapons.find((w) => w.id !== c[0] && w.id !== c[1]);
          c[i] = free ? free.id : null;
        }
      }
      s.carry = c;
      // trang bị
      const own = obj(s.owned);
      s.owned = {};
      for (const slot of ['helm', 'armor', 'charm']) {
        s.owned[slot] = (Array.isArray(own[slot]) ? own[slot] : []).filter((id, i, a) => G.GEAR[slot][id] && a.indexOf(id) === i);
        if (!s.owned[slot].includes(s[slot])) s[slot] = null;
      }
      return s;
    } catch (e) { return base; }
  };
  G.persist = function () {
    try { window.localStorage.setItem(KEY, JSON.stringify(G.save)); } catch (e) { /* chơi không lưu */ }
  };
  G.resetSave = function () {
    G.save = G.newSave();
    G.persist();
  };
  G.weaponById = (id) => G.save.weapons.find((w) => w.id === id) || null;

  // ---------- vẽ giao diện (toạ độ 480x270, chữ nét ở độ phân giải thật) ----------
  const FONT = '"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const ui = (G.ui = {});
  ui.begin = function () {
    const c = G.ux;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, uiCv.width, uiCv.height);
    c.setTransform(G.uiScale, 0, 0, G.uiScale, G.ox * G.dpr, G.oy * G.dpr);
    c.textBaseline = 'alphabetic';
  };
  ui.font = function (size, bold) {
    G.ux.font = (bold ? '700 ' : '500 ') + size + 'px ' + FONT;
  };
  ui.text = function (str, x, y, o) {
    o = o || {};
    const c = G.ux;
    // Chữ không nhỏ hơn 6,5 để còn đọc được trên điện thoại.
    ui.font(Math.max(6.5, o.size || 9), o.bold);
    c.textAlign = o.align || 'left';
    if (o.shadow !== false) {
      c.fillStyle = 'rgba(0,0,0,0.75)';
      c.fillText(str, x + 0.6, y + 0.6);
    }
    c.fillStyle = o.color || '#f1ead9';
    c.fillText(str, x, y);
  };
  ui.wrap = function (str, maxW, size, bold) {
    ui.font(Math.max(6.5, size || 9), bold);
    const words = String(str).split(' ');
    const lines = [];
    let cur = '';
    for (const w of words) {
      const t = cur ? cur + ' ' + w : w;
      if (G.ux.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
    }
    if (cur) lines.push(cur);
    return lines;
  };
  ui.para = function (str, x, y, maxW, o) {
    o = o || {};
    const size = Math.max(6.5, o.size || 9);
    const lines = ui.wrap(str, maxW, size, o.bold);
    lines.forEach((l, i) => ui.text(l, x, y + i * (size + 3), o));
    return y + lines.length * (size + 3);
  };
  ui.rect = function (x, y, w, h, fill, stroke) {
    const c = G.ux;
    if (fill) { c.fillStyle = fill; c.fillRect(x, y, w, h); }
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = 1; c.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1); }
  };
  ui.panel = function (x, y, w, h, title) {
    ui.rect(x, y, w, h, 'rgba(20,16,14,0.94)', '#7a5a3a');
    ui.rect(x + 2, y + 2, w - 4, h - 4, null, 'rgba(255,220,160,0.12)');
    if (title) ui.text(title, x + 8, y + 15, { size: 11, bold: true, color: '#ffd27a' });
  };
  ui.btn = function (x, y, w, h, label, o) {
    o = o || {};
    const hover = [...G.pointers.values()].some((p) => !p.role && !p.stale && G.inRect(p, x, y, w, h));
    const base = o.disabled ? '#3a322c' : o.color || '#8a4b25';
    ui.rect(x, y, w, h, hover && !o.disabled ? '#b5672f' : base, o.disabled ? '#51463d' : '#e2b36a');
    const size = o.size || 9;
    ui.text(label, x + w / 2, y + h / 2 + size * 0.36 - (o.sub ? 4 : 0), {
      size, bold: true, align: 'center', color: o.disabled ? '#8a7f74' : '#fff3da',
    });
    if (o.sub) ui.text(o.sub, x + w / 2, y + h / 2 + 8, { size: o.subSize || 7, align: 'center', color: o.disabled ? '#8a7f74' : '#f0d9b0' });
    if (!o.disabled && G.click && G.inRect(G.click, x, y, w, h)) {
      G.click = null;
      G.sfx('ui');
      return true;
    }
    return false;
  };
  ui.bar = function (x, y, w, h, frac, col, back) {
    ui.rect(x, y, w, h, back || 'rgba(0,0,0,0.6)');
    ui.rect(x, y, Math.max(0, w * G.clamp(frac, 0, 1)), h, col);
    ui.rect(x, y, w, h, null, 'rgba(0,0,0,0.8)');
  };
  ui.circle = function (x, y, r, fill, stroke) {
    const c = G.ux;
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = 1.2; c.stroke(); }
  };

  // ---------- vòng lặp ----------
  G.scene = null;
  G.setScene = function (s) {
    G.scene = s;
    G.click = null;
    G.stalePointers();
    if (s.enter) s.enter();
  };
  G.time = 0;
  const STEP = 1 / 60;
  let last = 0, acc = 0;
  G.tick = function () {
    G.time += STEP;
    if (G.scene) G.scene.update(STEP);
    G.keyP = {};
    G.downs.length = 0;
  };
  function frame(ts) {
    requestAnimationFrame(frame); // đặt trước để một lỗi lẻ không làm đứng game
    const now = ts / 1000;
    acc += Math.min(0.1, Math.max(0, now - last || 0));
    last = now;
    let n = 0;
    while (acc >= STEP && n < 5) { G.tickDraw = n === 0; G.tick(); acc -= STEP; n++; }
    if (acc > STEP) acc = 0; // khung hình quá chậm: bỏ phần dư, không chạy bù dồn
    if (G.scene && !G.noRender) {
      ui.begin();
      G.scene.draw();
      if (G.portrait) {
        ui.text('Xoay ngang điện thoại để hình to và dễ chơi hơn', 240, -10, { size: 13, align: 'center', color: '#ffd27a' });
      }
    }
    G.click = null; // nút bấm trong giao diện được kiểm tra lúc vẽ, nên xoá sau khi vẽ
  }
  G.run = function () { requestAnimationFrame(frame); };
  // Dùng khi chạy thử tự động: chạy n bước mà không vẽ.
  G.sim = function (n) {
    G.noRender = true;
    try { for (let i = 0; i < n; i++) { G.tick(); G.click = null; } } finally { G.noRender = false; }
  };
})();

// ===== js/art.js =====
// Hình pixel vẽ bằng mã: hero, quái, boss, cảnh nền, đồ vật. Chỉ dùng fillRect toạ độ nguyên, màu phẳng.
(function () {
  const G = window.G;
  const A = (G.art = {});
  const p = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
  A.p = p;

  A.line = function (c, x0, y0, x1, y1, col, t) {
    t = t || 1;
    c.fillStyle = col;
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
    for (let i = 0; i <= n; i++) {
      c.fillRect(Math.round(x0 + ((x1 - x0) * i) / n), Math.round(y0 + ((y1 - y0) * i) / n), t, t);
    }
  };
  A.ellipse = function (c, x, y, rx, ry, col) {
    c.fillStyle = col;
    x = Math.round(x); y = Math.round(y);
    for (let dy = -Math.floor(ry); dy <= Math.floor(ry); dy++) {
      const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))));
      if (hw > 0) c.fillRect(x - hw, y + dy, hw * 2, 1);
    }
  };

  // ---------- tiện ích màu và viền ----------
  // Trộn hai màu hex, có nhớ kết quả để không tính lại mỗi khung hình.
  const MIX = new Map();
  function mix(a, b, k) {
    const key = a + b + k;
    let v = MIX.get(key);
    if (v) return v;
    const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
    const f = (s) => { const u = (x >> s) & 255, w = (y >> s) & 255; return Math.round(u + (w - u) * k); };
    v = '#' + ((1 << 24) | (f(16) << 16) | (f(8) << 8) | f(0)).toString(16).slice(1);
    MIX.set(key, v);
    return v;
  }
  const lite = (h, k) => mix(h, '#ffffff', k);
  const dim = (h, k) => mix(h, '#000000', k);

  // Vẽ hai lượt: lượt viền (OUT) tô khối tối rộng hơn 1 điểm, lượt sau tô màu thật.
  const DARK = '#140d0e';
  let OUT = false, OC = DARK, cx = null;
  const q = (x, y, w, h, col) => {
    if (OUT) { cx.fillStyle = OC; cx.fillRect(x - 1, y - 1, w + 2, h + 2); } else { cx.fillStyle = col; cx.fillRect(x, y, w, h); }
  };
  // Chi tiết bên trong, không có viền.
  const d = (x, y, w, h, col) => { if (!OUT) { cx.fillStyle = col; cx.fillRect(x, y, w, h); } };
  // Đoạn thẳng dày, ít ô vuông.
  function seg(x0, y0, x1, y1, t, col) {
    const o = OUT ? 1 : 0, h = t >> 1;
    cx.fillStyle = OUT ? OC : col;
    const dx = x1 - x0, dy = y1 - y0;
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / Math.max(1, t - 1)));
    for (let i = 0; i <= n; i++) cx.fillRect(Math.round(x0 + (dx * i) / n) - h - o, Math.round(y0 + (dy * i) / n) - h - o, t + 2 * o, t + 2 * o);
  }
  // Elip thô, mỗi hàng cao 2 điểm.
  function qe(x, y, rx, ry, col) {
    if (OUT) { rx += 1; ry += 1; col = OC; }
    cx.fillStyle = col;
    for (let dy = -ry; dy < ry; dy += 2) {
      const m = dy + 1;
      const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - (m * m) / (ry * ry))));
      if (hw > 0) cx.fillRect(x - hw, y + dy, hw * 2, 2);
    }
  }
  const de = (x, y, rx, ry, col) => { if (!OUT) qe(x, y, rx, ry, col); };
  // Vòng elip rỗng (chỉ viền).
  function ring(c, x, y, rx, ry, col) {
    c.fillStyle = col;
    x = Math.round(x); y = Math.round(y);
    const n = Math.floor(ry);
    if (n < 1 || rx < 2) return;
    const hwAt = (k) => (k > n ? 0 : Math.round(rx * Math.sqrt(Math.max(0, 1 - (k * k) / (ry * ry)))));
    for (let dy = -n; dy <= n; dy++) {
      const a = Math.abs(dy), hw = hwAt(a);
      if (hw <= 0) continue;
      const w = Math.min(hw, Math.max(2, hw - hwAt(a + 1) + 1));
      c.fillRect(x - hw, y + dy, w, 1);
      c.fillRect(x + hw - w, y + dy, w, 1);
    }
  }
  const region = () => { const w = G.getWorld && G.getWorld(); return w && w.region != null ? w.region : 0; };

  // ---------- vũ khí ----------
  A.weaponLook = function (w) {
    const stage = w ? G.wStage(w) : 0;
    const el = w ? (w.coat || (stage > 0 ? w.branch : null)) : null;
    return {
      type: w ? w.type : 'sword', stage,
      col: el ? G.EL[el].col : w ? G.TIERS[w.tier].col : '#b9c0c9',
      col2: el ? G.EL[el].col2 : '#ffffff', el,
    };
  };
  // Vẽ vũ khí từ bàn tay (x0, y0) theo góc ang (độ, 0 là chĩa thẳng về trước, âm là chĩa lên).
  A.weapon = function (c, look, x0, y0, ang, pull) {
    const r = (ang * Math.PI) / 180;
    const cs = Math.cos(r), sn = Math.sin(r);
    const pt = (k) => [Math.round(x0 + cs * k), Math.round(y0 + sn * k)];
    const st = look.stage;
    if (look.type === 'sword') {
      const L = 14 + st * 2;
      const a = pt(-2), b = pt(3), e = pt(L);
      A.line(c, a[0], a[1], b[0], b[1], '#5a4030', 2);
      A.line(c, b[0], b[1], e[0], e[1], look.col, 2);
      A.line(c, b[0], b[1], e[0], e[1], look.col2, 1);
      if (st >= 2) { const m = pt(L - 4); A.line(c, m[0], m[1], e[0], e[1], look.col2, 2); }
      const g1 = [Math.round(b[0] - sn * 3), Math.round(b[1] + cs * 3)], g2 = [Math.round(b[0] + sn * 3), Math.round(b[1] - cs * 3)];
      A.line(c, g1[0], g1[1], g2[0], g2[1], '#caa15a', 2);
    } else if (look.type === 'hammer') {
      const L = 13;
      const a = pt(-2), e = pt(L);
      A.line(c, a[0], a[1], e[0], e[1], '#7a5a3a', 2);
      const s = 7 + st;
      p(c, e[0] - (s >> 1) - 1, e[1] - (s >> 1) - 1, s + 3, s + 2, '#2a2422');

    G.sfx('hurt');
    text(P.x, P.y - 38, '-' + Math.round(amt), '#ff6a5a', 9);
    if (P.key === 'wrestler' && melee && src && !src.dead) G.damage(src, raw * 0.5, { src: 'reflect', fromPlayer: false });
    if (el) {
      const k = 1 - P.resist[el];
      if (el === 'fire') { P.st.fire = 3 * k; P.dot = raw * 0.05; } // tổng cộng thêm khoảng 30% nếu cháy đủ 3 giây
      if (el === 'poison') { P.st.poison = 4 * k; P.dot = raw * 0.035; }
      if (el === 'ice') P.st.ice = 2.5 * k;
    }
    if (P.hp <= 0) { P.dead = true; W.over = 'dead'; }
    return true;
  };

  G.updatePlayer = function (P, inp, dt) {
    P.t += dt;
    for (const k of ['atkT', 'cdT', 'dodgeCd', 'inv', 'hurtT', 'skillCd', 'specCd', 'swapCd', 'gongT']) if (P[k] > 0) P[k] -= dt;
    for (const id in P.coats) if (P.coats[id].t > 0) P.coats[id].t -= dt;
    // hiệu ứng trên người chơi
    P.dotT -= dt;
    for (const k of ['fire', 'poison', 'ice']) if (P.st[k] > 0) P.st[k] -= dt;
    if (P.dotT <= 0) {
      P.dotT = 0.5;
      if (!P.dead && (P.st.fire > 0 || P.st.poison > 0)) {
        P.hp -= P.dot;
        if (P.hp < 1) P.hp = 1;
      }
    }
    if (W.over) { P.moving = false; return; }
    const w = curW(P);
    const slow = P.st.ice > 0 ? 0.65 : 1;
    let mx = inp.mx, my = inp.my;
    const ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }
    P.moving = false;

    if (P.dashT > 0) {
      P.dashT -= dt;
      const nx = G.clamp(P.x + P.dashV * dt, W.x0, W.px1 != null ? W.px1 : W.x1);
      for (const e of G.targets()) {
        if (P.dashHit.includes(e)) continue;
        if (e.x >= Math.min(P.x, nx) - e.r - 6 && e.x <= Math.max(P.x, nx) + e.r + 6 && Math.abs(e.y - P.y) <= 12 + e.hr) {
          P.dashHit.push(e);
          playerHit(e, P.dashMult, { w, stun: P.dashStun });
        }
      }
      hitProps(Math.min(P.x, nx) - 4, Math.max(P.x, nx) + 4, P.y, 14);
      P.x = nx;
      return;
    }
    if (P.dodgeT > 0) {
      P.dodgeT -= dt;
      const ox = P.x;
      P.x += P.ddx * 195 * dt;
      P.y += P.ddy * 120 * dt;
      if (P.charm === 'c_mist' || P.set === 'ngu') {
        for (const e of G.targets()) {
          if (!e.misted && e.x >= Math.min(ox, P.x) - e.r && e.x <= Math.max(ox, P.x) + e.r && Math.abs(e.y - P.y) < 14 + e.hr) {
            e.misted = true;
            G.applyStatus(e, 'ice', G.pDamage(P, w), 1);
          }
        }
      }
      if (P.dodgeT <= 0) {
        for (const e of W.ents) e.misted = false;
        if (W.boss) W.boss.misted = false;
        if (P.set === 'ho') P.boost = true;
      }
    } else {
      const sp = P.speed * slow * (P.atkT > 0 ? 0.4 : 1);
      if (ml > 0.12) {
        P.x += mx * sp * dt;
        P.y += my * sp * 0.75 * dt;
        P.moving = true;
        if (P.atkT <= 0 && Math.abs(mx) > 0.2) P.face = mx > 0 ? 1 : -1;
      }
      if (inp.dodgeP && P.dodgeCd <= 0) {
        P.dodgeT = 0.27; P.dodgeCd = 1 * P.dodgeCdMax; P.inv = Math.max(P.inv, 0.32);
        P.atkT = 0;
        if (ml > 0.12) { P.ddx = mx; P.ddy = my; } else { P.ddx = P.face; P.ddy = 0; }
        if (Math.abs(P.ddx) > 0.2) P.face = P.ddx > 0 ? 1 : -1;
        W.stats.dodges++;
        G.sfx('swing', 0.7);
      } else if (inp.specialP && P.mana >= P.specCost && P.specCd <= 0) {
        special(P);
      } else if (inp.skillP && P.mana >= 40 && P.skillCd <= 0) {
        heroSkill(P);
      } else if ((inp.atk || inp.atkP) && P.cdT <= 0) {
        startAttack(P);
      }
      if (inp.swapP && P.weapons.length > 1 && P.swapCd <= 0) {
        P.cur = 1 - P.cur;
        P.swapCd = 1.5;
        P.firstHit = true;
        P.comboI = -1;
        G.sfx('pick');
      }
      if (inp.potionP && P.potions > 0 && P.hp < P.maxhp && !W.noPotion) {
        P.potions--;
        P.hp = Math.min(P.maxhp, P.hp + P.maxhp * 0.3);
        W.usedPotion = true;
        G.burst(P.x, P.y, '#ff6a5a', 12, 50);
        G.sfx('pick', 1.4);
      }
    }
    if (P.atkT > 0 && !P.hitDone && P.atkT <= P.atkDur * 0.55) doHit(P);
    P.x = G.clamp(P.x, W.x0, W.px1 != null ? W.px1 : W.x1);
    P.y = G.clamp(P.y, W.y0, W.y1);
    if (P.set === 'moc') {
      P.stillT = P.moving || P.atkT > 0 ? 0 : P.stillT + dt;
      if (P.stillT > 2) P.hp = Math.min(P.maxhp, P.hp + P.maxhp * 0.02 * dt);
    }
  };

  // ---------- quái ----------
  function strike(e, reach, depth, mult) {
    const P = W.P;
    const dx = (P.x - e.x) * e.face;
    if (dx > -6 && dx < reach && Math.abs(P.y - e.y) < depth) G.hurtPlayer(e.dmg * (mult || 1), e.el, e, true);
  }
  function updateEnemy(e, dt) {
    const P = W.P;
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;
    tickStatus(e, dt);
    if (e.dead) return;
    e.moving = false;
    if (e.st.frozen > 0 || e.st.stun > 0) { e.wind = 0; return; }
    const sp = e.speed * slowOf(e) * (e.st.root > 0 ? 0 : 1);
    const dx = P.x - e.x, dy = P.y - e.y, ad = Math.abs(dx);
    e.cd -= dt;
    if (e.wind > 0) {
      e.wind -= dt;
      if (e.wind <= 0) {
        if (e.role === 'archer') {
          const d = Math.max(30, Math.hypot(dx, dy));
          W.projs.push({ team: 'enemy', kind: 'fruit', x: e.x + e.face * 6, y: e.y, vx: (dx / d) * 135, vy: (dy / d) * 135, t: 3, dmg: e.dmg, el: e.el, col: e.el ? G.EL[e.el].col : null });
        } else if (e.role === 'nimble') {
          e.lunge = 0.18; e.lv = e.face * 230;
        } else {
          strike(e, 30 + e.r, 12 + e.hr * 0.5, 1);
        }
        e.cd = e.role === 'archer' ? 2.3 : e.role === 'swarm' ? 1.3 : 1.4;
      }
      return;
    }
    if (e.lunge > 0) {
      e.lunge -= dt;
      e.x += e.lv * dt;
      if (!e.lhit && Math.abs(P.x - e.x) < 12 && Math.abs(P.y - e.y) < 11) { e.lhit = true; G.hurtPlayer(e.dmg, e.el, e, true); }
      if (e.lunge <= 0) { e.lhit = false; e.retreat = 0.7; }
      return;
    }
    e.face = dx >= 0 ? 1 : -1;
    let tx = P.x, ty = P.y;
    if (e.role === 'archer') {
      const want = 150;
      tx = P.x - e.face * want;
      tx = G.clamp(tx, W.x0 + 6, W.x1 - 6);
      if (Math.abs(tx - e.x) < 14 && Math.abs(dy) < 60 && e.cd <= 0 && e.x > W.x0 && e.x < W.x1) { e.wind = 0.5; G.sfx('warn', 1.3); return; }
    } else if (e.role === 'nimble') {
      if (e.retreat > 0) {
        e.retreat -= dt;
        tx = e.x - e.face * 60; ty = e.y + (e.t % 2 < 1 ? 30 : -30);
      } else {
        const side = P.face; // vòng ra sau lưng người chơi
        tx = P.x - side * 46;
        if (Math.abs(dy) < 9 && ad < 64 && ad > 20 && e.cd <= 0) { e.wind = 0.4; return; }
      }
    } else {
      if (e.role === 'elite') {
        e.slamCd -= dt;
        if (e.slamCd <= 0 && ad < 140) {
          e.slamCd = 5;
          G.zoneCircle(P.x, P.y, 30, 0.85, e.dmg * 1.3, e.el);
          G.sfx('warn');
          e.wind = 0.5; e.cd = 1.2;
          return;
        }
      }
      tx = P.x - e.face * (12 + e.r);
      // Vào thật gần mới vung đòn, và đòn với xa hơn tầm bắt đầu 14 điểm: lùi chậm thì vẫn trúng, phải bước hẳn ra hoặc lăn né.
      if (ad < 16 + e.r && Math.abs(dy) < 10 && e.cd <= 0) {
        e.wind = e.role === 'swarm' ? 0.3 : e.role === 'shield' ? 0.55 : 0.42;
        return;
      }
    }
    const mdx = tx - e.x, mdy = ty - e.y, md = Math.hypot(mdx, mdy);
    if (md > 2) {
      e.x += (mdx / md) * sp * dt;
      e.y += (mdy / md) * sp * 0.75 * dt;
      e.moving = true;
    }
    e.y = G.clamp(e.y, W.y0, W.y1);
  }
  function separate() {
    const a = W.ents;
    for (let i = 0; i < a.length; i++) {
      for (let j = i + 1; j < a.length; j++) {
        const A1 = a[i], B = a[j];
        if (A1.dead || B.dead) continue;
        const dx = B.x - A1.x, dy = (B.y - A1.y) * 1.6;
        const d = Math.hypot(dx, dy), min = (A1.r + B.r) * 0.9;
        if (d < min && d > 0.01) {
          const k = ((min - d) / d) * 0.5;
          A1.x -= dx * k; B.x += dx * k;
          A1.y -= (dy * k) / 1.6; B.y += (dy * k) / 1.6;
        }
      }
    }
  }

  // ---------- cập nhật mỗi khung ----------
  G.updateWorld = function (dt, inp) {
    const P = W.P;
    G.updatePlayer(P, inp, dt);
    for (const e of W.ents) if (!e.dead) updateEnemy(e, dt);
    separate();
    // Quái đã vào phòng thì không được lùi hay bị đẩy ra ngoài mép phòng (ngoài đó người chơi không với tới).
    for (const e of W.ents) {
      if (e.x >= W.x0 && e.x <= W.x1) e.inside = true;
      else if (e.inside) e.x = G.clamp(e.x, W.x0, W.x1);
    }
    if (W.boss && !W.boss.dead) G.updateBoss(W.boss, dt);
    // đạn
    for (const o of W.projs) {
      o.t -= dt;
      if (o.homing) {
        const dx = P.x - o.x, dy = P.y - o.y, d = Math.max(1, Math.hypot(dx, dy));
        o.vx += ((dx / d) * o.homing - o.vx) * dt * 2.5;
        o.vy += ((dy / d) * o.homing - o.vy) * dt * 2.5;
      }
      o.x += o.vx * dt; o.y += o.vy * dt;
      if (o.team === 'player') {
        for (const e of G.targets()) {
          if (o.seen.includes(e)) continue;
          if (Math.abs(e.x - o.x) < e.r + 4 && Math.abs(e.y - o.y) < e.hr + 7) {
            o.seen.push(e);
            playerHit(e, o.mult, { w: o.w, ranged: true });
            P.mana = Math.min(P.maxmana, P.mana + P.manaHit + (o.w.affix === 'mana' ? 1 : 0));
            G.sfx('hit', 1.3);
            if (o.pierce > 0) o.pierce--; else { o.t = 0; break; }
          }
        }
        for (const pr of W.props) if (pr.env && !pr.used && Math.abs(pr.x - o.x) < 8 && Math.abs(pr.y - o.y) < 10) { G.triggerProp(pr); o.t = 0; }
      } else if (Math.abs(P.x - o.x) < 7 && Math.abs(P.y - o.y) < 8) {
        if (G.hurtPlayer(o.dmg, o.el, null, false) || P.inv <= 0) o.t = 0;
      }
      if (o.x < -30 || o.x > W.w + 30) o.t = 0;
    }
    W.projs = W.projs.filter((o) => o.t > 0);
    // vùng nguy hiểm và vũng
    for (const z of W.zones) {
      if (z.wave) {
        if (z.wait > 0) { z.wait -= dt; continue; } // sóng đứng yên báo trước rồi mới tràn tới
        z.x += z.vx * dt;
        if (!z.hit && Math.abs(P.x - z.x) < 6 && (P.y < z.g0 || P.y > z.g1)) { if (G.hurtPlayer(z.dmg, z.el, null, false)) z.hit = true; }
        if (z.x < -20) z.dead = true;
        continue;
      }
      if (z.t > 0) {
        z.t -= dt;
        if (z.t <= 0) {
          if (z.team !== 'player' && z.team !== 'fx' && G.inZone(z, P)) G.hurtPlayer(z.dmg, z.el, null, false);
          if (z.onFire) z.onFire(z);
          if (z.then) { z.pool = true; z.life = z.then; z.tick = 0.4; }
          W.shake = Math.max(W.shake, 0.06);
        }
        continue;
      }
      z.life -= dt;
      if (z.pool) {
        z.tick -= dt;
        if (z.tick <= 0) {
          if (z.team === 'player') {
            if (z.rain) {
              z.tick = 0.15;
              for (const e of G.targets()) if (Math.hypot(e.x - z.x, (e.y - z.y) * 1.6) < z.r + e.r) playerHit(e, 0.5, { w: z.w, ranged: true });
              G.burst(z.x + G.rr(-30, 30), z.y + G.rr(-12, 12), z.el ? G.EL[z.el].col : '#e8e2d0', 3, 30);
            } else {
              z.tick = 1;
              for (const e of G.targets()) if (Math.hypot(e.x - z.x, (e.y - z.y) * 1.6) < z.r + e.r) G.applyStatus(e, z.el, z.src, 1);
            }
          } else {
            z.tick = 0.5;
            if (G.inZone(z, P)) G.hurtPlayer(z.dmg * 0.3, z.el, null, false);
          }
        }
        if (z.heal && G.inZone(z, P)) P.hp = Math.min(P.maxhp, P.hp + P.maxhp * 0.03 * dt);
      }
      if (z.life <= 0) z.dead = true;
    }
    W.zones = W.zones.filter((z) => !z.dead);
    // bẫy của Thợ Săn
    for (const pr of W.props) {
      if (pr.type !== 'trap' || pr.dead) continue;
      pr.t -= dt;
      if (pr.t <= 0) { pr.dead = true; continue; }
      for (const e of G.targets()) {
        if (Math.abs(e.x - pr.x) < 10 + e.r * 0.5 && Math.abs(e.y - pr.y) < 9 + e.hr * 0.5) {
          pr.dead = true;
          e.st.root = e.isBoss ? 0.8 : 2;
          const src = G.pDamage(P, pr.w);
          if (pr.el) G.applyStatus(e, pr.el, src, pr.el === 'fire' ? 1 : 2);
          G.damage(e, src * 1.5, { el: pr.el, src: 'trap', w: pr.w });
          G.sfx('hit', 0.6);
          break;
        }
      }
    }
    W.props = W.props.filter((p) => !p.dead);
    W.ents = W.ents.filter((e) => !e.dead);
    // hạt, chữ, vệt chém
    for (const o of W.parts) { o.t -= dt; o.x += o.vx * dt; o.y += o.vy * dt; o.vy += 90 * dt; }
    W.parts = W.parts.filter((o) => o.t > 0);
    for (const o of W.texts) { o.t -= dt; o.y -= 22 * dt; }
    W.texts = W.texts.filter((o) => o.t > 0);
    for (const o of W.slashes) o.t -= dt;
    W.slashes = W.slashes.filter((o) => o.t > 0);
    if (W.shake > 0) W.shake -= dt;
    if (W.banner) { W.banner.t -= dt; if (W.banner.t <= 0) W.banner = null; }
    // Trong phòng trùm cố định, đặt người chơi lệch trái để thấy rõ phía trùm.
    const lead = W.boss && !W.boss.dead && W.boss.kind !== 'ho' ? 150 : G.W / 2;
    const camTo = G.clamp(P.x - lead, 0, Math.max(0, W.w - G.W));
    W.cam += (camTo - W.cam) * Math.min(1, dt * 6);
  };

  // ---------- vẽ ----------
  G.drawWorld = function (reg) {
    const c = G.wx, A = G.art, P = W.P;
    const cam = Math.round(W.cam);
    const sx = W.shake > 0 ? Math.round(G.rr(-2, 2)) : 0, sy = W.shake > 0 ? Math.round(G.rr(-1, 1)) : 0;
    c.setTransform(1, 0, 0, 1, 0, 0);
    A.bg(c, reg, W.seed, cam, W.w, W.shrink);
    c.setTransform(1, 0, 0, 1, -cam + sx, sy);
    for (const z of W.zones) {
      if (z.wave) {
        // lúc còn báo trước thì sóng mờ và nhấp nháy, khe hở nhìn thấy ngay
        const wc = z.wait > 0 ? 'rgba(160,220,250,' + (Math.floor(G.time * 10) % 2 ? 0.3 : 0.5) + ')' : 'rgba(160,220,250,0.85)';
        A.p(c, Math.round(z.x) - 3, W.y0 - 6, 6, z.g0 - W.y0 + 6, wc);
        A.p(c, Math.round(z.x) - 3, z.g1, 6, G.H - z.g1, wc);
      } else if (z.team === 'fx') A.ellipse(c, z.x, z.y, z.r, z.r * 0.6, 'rgba(255,240,200,0.35)');
      else A.zone(c, z);
    }
    const list = [];
    for (const e of W.ents) list.push({ y: e.y, f: () => (e.illusion ? A.boss(c, e) : A.enemy(c, e)) });
    for (const pr of W.props) list.push({ y: pr.y - (pr.type === 'door' ? 200 : 0), f: () => A.prop(c, pr) });
    if (W.boss && !W.boss.dead) {
      const b = W.boss;
      list.push({ y: b.y + (b.kind === 'moc' ? -30 : 0), f: () => { if (b.kind === 'mini') A.enemy(c, b); else A.boss(c, b); if (!b.hidden) A.status(c, b, Math.round(b.x), Math.round(b.y - b.h - 6)); } });
    }
    const w = G.curW(P);
    list.push({
      y: P.y,
      f: () => A.hero(c, {
        x: P.x, y: P.y, face: P.face, key: P.key, move: P.moving, t: P.t,
        atk: P.atkT > 0 ? 1 - P.atkT / P.atkDur : -1, dodge: P.dodgeT > 0 ? 1 - P.dodgeT / 0.27 : -1,
        flash: P.hurtT > 0, alpha: P.inv > 0 && P.dodgeT <= 0 && Math.floor(G.time * 20) % 2 ? 0.5 : null,
        weapon: Object.assign({}, w, { coat: P.coats[w.id] && P.coats[w.id].t > 0 ? P.coats[w.id].el : null }),
        helm: P.helm, armor: P.armor, gong: P.gongT > 0,
      }),
    });
    list.sort((a, b) => a.y - b.y);
    for (const o of list) o.f();
    if (P.st.fire > 0) { A.p(c, Math.round(P.x) - 3, Math.round(P.y) - 38, 2, 3, '#ff7a2a'); A.p(c, Math.round(P.x) + 1, Math.round(P.y) - 40, 2, 4, '#ffd23f'); }
    if (P.st.poison > 0) A.p(c, Math.round(P.x) - 2, Math.round(P.y) - 38, 3, 3, '#6fcf3a');
    if (P.st.ice > 0) A.p(c, Math.round(P.x) - 5, Math.round(P.y) - 2, 10, 2, '#7fd4ff');
    for (const o of W.projs) A.proj(c, o);
    for (const s of W.slashes) A.slash(c, s);
    for (const o of W.parts) A.p(c, Math.round(o.x), Math.round(o.y), o.s, o.s, o.col);
    c.setTransform(1, 0, 0, 1, 0, 0);
    // chữ sát thương vẽ ở lớp giao diện cho nét
    for (const o of W.texts) G.ui.text(o.s, o.x - cam, o.y, { size: o.size, align: 'center', color: o.col, bold: true });
  };
})();

// ===== js/boss.js =====
// Trùm: lớp thích nghi theo cách chơi, trùm nhỏ và ba boss vùng (Mộc Tinh, Ngư Tinh, Hồ Tinh).
(function () {
  const G = window.G;
  const W = () => G.getWorld();

  // Từ số liệu cách chơi trong ải, chọn ra các lớp thích nghi của trùm.
  G.computeLayers = function (stats, max, pct) {
    const L = [];
    const el = stats.el;
    const tot = el.fire + el.poison + el.ice + el.none;
    if (tot > 0) {
      const top = G.ELS.slice().sort((a, b) => el[b] - el[a])[0];
      if (el[top] / tot > 0.5) L.push({ type: 'resist', el: top, pct });
    }
    const rm = stats.ranged + stats.melee;
    if (rm > 0) {
      if (stats.ranged / rm > 0.6) L.push({ type: 'antiRanged' });
      else if (stats.melee / rm > 0.6) L.push({ type: 'antiMelee' });
    }
    if (stats.dodges > 15) L.push({ type: 'antiDodge' });
    return L.slice(0, max);
  };
  // Gọi được qua layers.map(G.layerText): khi hệ khắc chế cũng đang bị kháng thì không ghi "yếu".
  G.layerText = function (l, i, all) {
    if (l.type === 'resist') {
      const weakOk = !Array.isArray(all) || !all.some((x) => x.type === 'resist' && x.el === G.WEAK[l.el]);
      return 'Kháng ' + G.EL[l.el].name + (weakOk ? ', yếu ' + G.EL[G.WEAK[l.el]].name : '') + (l.scar ? ' (vết sẹo)' : '');
    }
    if (l.type === 'antiRanged') return 'Chống đánh xa';
    if (l.type === 'antiMelee') return 'Chống áp sát';
    return 'Bắt bài lăn né';
  };
  function setWeak(b) {
    const res = b.layers.filter((l) => l.type === 'resist').map((l) => l.el);
    b.weak = res.map((e) => G.WEAK[e]).filter((e) => !res.includes(e));
  }
  const has = (b, type) => b.layers.some((l) => l.type === type);

  G.makeBoss = function (kind, o) {
    const w = W();
    const mid = (w.y0 + w.y1) / 2;
    const reg = G.REGIONS[w.region];
    const b = {
      isBoss: true, kind, name: o.name, layers: o.layers, weak: [], weakHits: 0, phase: 0, exposed: 0, flash: 0,
      seq: [], cd: 1.8, face: -1, t: 0, hidden: false, st: G.st0(), dmg: w.base.dmg, marks: kind === 'mini' ? 10 : 20,
      maxhp: w.base.hp * (kind === 'mini' ? G.MINI_HP : (G.BOSS_HP_OF && G.BOSS_HP_OF[kind]) || G.BOSS_HP), last: null, wind: 0, moving: false,
    };
    b.hp = b.maxhp;
    setWeak(b);
    if (kind === 'moc') {
      Object.assign(b, { x: w.w - 140, y: w.y1 - 24, r: 24, hr: 70, h: 124, armSwing: 0 });
      b.rangedShield = (P) => Math.abs(P.x - b.x) > 130;
      w.px1 = b.x - 26;
    } else if (kind === 'ngu') {
      Object.assign(b, { x: w.w - 130, y: mid + 6, r: 44, hr: 70, h: 44 });
      w.px1 = b.x - 62;
    } else if (kind === 'ho') {
      Object.assign(b, { x: w.w - 130, y: mid, r: 18, hr: 10, h: 42, tails: 9, tpCd: 0, hopCd: 2, speed: 84 });
      b.onHit = function (hit) {
        if (hit.ranged && has(b, 'antiRanged') && b.tpCd <= 0 && b.seq.length === 0 && !b.dead) {
          const P = w.P;
          b.tpCd = 4;
          G.burst(b.x, b.y, '#ffffff', 12, 60);
          b.x = P.x - P.face * 26;
          if (b.x < w.x0 + 4 || b.x > w.x1 - 4) b.x = P.x + P.face * 26; // sát mép sân thì hiện ra phía trước mặt
          b.x = G.clamp(b.x, w.x0, w.x1);
          b.y = P.y;
          G.zoneCircle(P.x, P.y, 22, 0.55, b.dmg, null);
          G.sfx('warn', 1.5);
          b.seq.push({ t: 0.7, f: () => {} });
        }
      };
    } else {
      Object.assign(b, { x: w.w - 200, y: mid, r: 16, hr: 10, h: 58, scale: 2.4, role: 'mini', skin: reg.skin, el: reg.el, speed: 30 * w.haste, resist: null });
    }
    w.boss = b;
    return b;
  };

  function later(b, t, f) { b.seq.push({ t, f }); }
  function choose(b, opts) {
    let pool = opts.filter((x) => x !== b.last);
    if (!pool.length) pool = opts;
    b.last = G.pick(pool);
    return b.last;
  }
  const adds = () => W().ents.filter((e) => e.add && !e.dead).length;
  function near(x, y, dx, dy) {
    const w = W();
    return [G.clamp(x + G.rr(-dx, dx), w.x0 + 6, (w.px1 != null ? w.px1 : w.x1) - 4), G.clamp(y + G.rr(-dy, dy), w.y0, w.y1)];
  }

  // ---------- Mộc Tinh ----------
  function thinkMoc(b) {
    const w = W(), P = w.P, ph = b.phase;
    const opts = ['sweep', 'roots', 'fruit'];
    if (ph >= 1 && adds() === 0) opts.push('summon'); // chỉ gọi quái từ giai đoạn 2, và khi sân đã sạch
    if (has(b, 'antiMelee') && Math.abs(P.x - b.x) < 100) opts.push('thorn', 'thorn');
    const a = choose(b, opts);
    const tele = ph >= 1 ? 0.95 : 1.05;
    G.sfx('warn');
    if (a === 'sweep') {
      const mid = (w.y0 + w.y1) / 2, top = P.y < mid;
      b.armSwing = -0.4;
      G.zoneRect(w.x0 - 4, top ? w.y0 - 6 : mid, b.x - 22 - w.x0, top ? mid - w.y0 + 6 : w.y1 - mid + 6, tele, b.dmg * 1.4, null, {
        onFire: () => { b.armSwing = 1; b.exposed = 2.6; G.sfx('boom'); },
      });
      later(b, tele + 0.5, () => { b.armSwing = 0; });
    } else if (a === 'roots') {
      const n = ph >= 1 ? 3 : 1;
      for (let i = 0; i < n; i++) {
        later(b, i * 0.45, () => {
          G.zoneCircle(P.x, P.y, 16, 0.7, b.dmg, null);
          if (has(b, 'antiDodge')) later(b, 0.35, () => G.zoneCircle(G.clamp(P.x + P.ddx * 46, w.x0, w.px1), P.y, 16, 0.6, b.dmg, null));
        });
      }
      later(b, n * 0.45 + 0.5, () => {});
    } else if (a === 'fruit') {
      const n = ph >= 2 ? 5 : 3;
      for (let i = 0; i < n; i++) {
        const q = near(P.x, P.y, 70, 30);
        G.zoneCircle(q[0], q[1], 18, 1.0 + i * 0.12, b.dmg * 0.8, 'poison', { then: 4 });
      }
      later(b, 1.3, () => {});
    } else if (a === 'summon') {
      for (let i = 0; i < 2; i++) G.spawnEnemy('rusher', b.x - 46, w.y0 + 14 + i * (w.y1 - w.y0 - 28), { add: true, hpMult: 0.5, dmgMult: 0.7 });
      later(b, 0.6, () => {});
    } else {
      G.zoneCircle(b.x - 14, (w.y0 + w.y1) / 2, 64, 1.0, b.dmg, null);
      later(b, 1.2, () => {});
    }
    b.cd = [1.7, 1.3, 1.0][ph];
  }

  // ---------- Ngư Tinh ----------
  function thinkNgu(b) {
    const w = W(), P = w.P, ph = b.phase;
    const opts = ['charge', 'spout', 'wave'];
    if (has(b, 'antiRanged')) opts.push('dive', 'dive');
    if (has(b, 'antiMelee') && P.x > w.px1 - 56) opts.push('spikes', 'spikes');
    const a = choose(b, opts);
    G.sfx('warn');
    if (a === 'charge') {
      const n = ph >= 2 ? 3 : 1;
      b.hidden = true;
      for (let i = 0; i < n; i++) {
        later(b, 0.3 + i * 0.95, () => {
          G.zoneRect(-10, G.clamp(P.y, w.y0 + 8, w.y1 - 8) - 13, w.w + 20, 26, 0.85, b.dmg * 1.35, 'ice', {
            onFire: (z) => { for (let k = 0; k < 8; k++) G.burst(w.x0 + k * 55, z.y + 13, '#9fd0e8', 4, 60); G.sfx('boom', 1.2); },
          });
          if (has(b, 'antiDodge') && i === n - 1) later(b, 0.45, () => G.zoneRect(-10, G.clamp(P.y, w.y0 + 8, w.y1 - 8) - 13, w.w + 20, 26, 0.6, b.dmg * 1.2, 'ice'));
        });
      }
      later(b, 0.3 + n * 0.95 + 0.6, () => { b.hidden = false; b.exposed = 2.6; });
    } else if (a === 'spout') {
      const n = ph >= 1 ? 6 : 4;
      for (let i = 0; i < n; i++) {
        const q = i === 0 ? [P.x, P.y] : near(P.x, P.y, 80, 34);
        G.zoneCircle(q[0], q[1], 17, 0.85 + i * 0.1, b.dmg, 'ice');
      }
      later(b, 1.5, () => {});
    } else if (a === 'wave') {
      const mk = () => {
        const g0 = G.rr(w.y0, w.y1 - 38);
        w.zones.push({ wave: true, x: b.x - 50, vx: -150, wait: 0.9, g0, g1: g0 + 38, dmg: b.dmg * 1.2, el: 'ice' });
      };
      mk();
      if (ph >= 1) later(b, 0.9, mk);
      later(b, 2.4, () => {});
    } else if (a === 'dive') {
      b.hidden = true;
      later(b, 0.3, () => G.zoneCircle(P.x, P.y, 30, 0.85, b.dmg * 1.4, 'ice', { onFire: (z) => G.burst(z.x, z.y, '#9fd0e8', 20, 90) }));
      later(b, 1.6, () => { b.hidden = false; });
    } else {
      b.spikes = true;
      G.zoneCircle(b.x - 34, b.y, 68, 0.9, b.dmg, null, { onFire: () => { b.spikes = false; } });
      later(b, 1.1, () => {});
    }
    b.cd = [1.6, 1.25, 0.95][ph];
  }
  function phaseNgu(b) {
    const w = W();
    if (b.phase === 1) { w.y0 += 14; w.y1 -= 14; }
    if (b.phase === 2) { w.x0 = 150; }
    w.shrink = { y0: w.y0 - 6, y1: w.y1 + 8, x0: w.x0 > 20 ? w.x0 - 8 : 0 };
    w.banner = { s: 'Nước dâng!', col: '#7fd4ff', t: 2 };
  }

  // ---------- Hồ Tinh ----------
  function thinkHo(b) {
    const w = W(), P = w.P, ph = b.phase;
    const opts = ['pounce', 'pounce', 'fox', 'nova'];
    if (w.ents.filter((e) => e.illusion && !e.dead).length < 2) opts.push('illusion');
    const a = choose(b, opts);
    G.sfx('warn', 1.2);
    if (a === 'pounce') {
      const go = (tele) => {
        const tx = P.x, ty = P.y;
        G.zoneCircle(tx, ty, 24, tele, b.dmg * 1.15, null, {
          onFire: () => { b.x = G.clamp(tx + (b.x < tx ? -8 : 8), w.x0, w.x1); b.y = ty; b.exposed = 2.0; G.burst(tx, ty, '#ffffff', 10, 60); },
        });
      };
      go(0.6);
      if (has(b, 'antiDodge')) later(b, 1.0, () => go(0.5));
      later(b, has(b, 'antiDodge') ? 2.6 : 2.0, () => {});
    } else if (a === 'fox') {
      const n = ph >= 1 ? 4 : 3;
      for (let i = 0; i < n; i++) {
        const an = -1.2 + (i * 2.4) / (n - 1);
        w.projs.push({ team: 'enemy', kind: 'fire', x: b.x, y: b.y, vx: Math.cos(an) * 70 * b.face, vy: Math.sin(an) * 70, homing: 58, t: 3.6, dmg: b.dmg * 0.8, el: 'fire' });
      }
      later(b, 1.0, () => {});
    } else if (a === 'nova') {
      const el = w.stats.el;
      const top = G.ELS.slice().sort((x, y) => el[y] - el[x])[0];
      b.tailEl = el[top] > 0 ? top : 'fire';
      G.zoneCircle(b.x, b.y, 62, 0.8, b.dmg * 1.2, b.tailEl);
      later(b, 1.2, () => {});
    } else {
      G.burst(b.x, b.y, '#ffffff', 14, 70);
      for (let i = 0; i < 2; i++) {
        if (w.ents.filter((e) => e.illusion && !e.dead).length >= 2) break;
        const q = near(P.x, P.y, 130, 40);
        w.ents.push({
          illusion: true, kind: 'ho', layers: b.layers, alpha: 0.7, x: q[0], y: q[1], r: 16, hr: 9, h: 36, hp: 1, maxhp: 1,
          st: G.st0(), dmg: b.dmg * 0.6, face: -1, t: 0, cd: ph >= 1 ? 1.2 : 99, tails: 9, add: true, role: 'illusion',
          speed: ph >= 1 ? 62 : 30, marks: 0, armor: 0, flash: 0, wind: 0, scale: 1, slamCd: 99,
        });
      }
      const q = near(P.x, P.y, 150, 40);
      b.x = q[0]; b.y = q[1];
      later(b, 0.8, () => {});
    }
    b.cd = [1.5, 1.1, 0.8][ph];
  }
  function moveHo(b, dt) {
    const w = W(), P = w.P;
    if (b.seq.length || b.st.stun > 0 || b.st.root > 0) return;
    const dx = P.x - b.x || 0.01, dy = P.y - b.y, d = Math.hypot(dx, dy); // d không bao giờ bằng 0
    b.face = dx >= 0 ? 1 : -1;
    if (has(b, 'antiMelee') && d < 42 && b.hopCd <= 0 && b.exposed <= 0) {
      b.hopCd = 3.5;
      w.zones.push({ shape: 'circle', x: b.x, y: b.y, r: 24, t: 0, pool: true, team: 'enemy', el: 'fire', life: 3, tick: 0.3, dmg: b.dmg });
      b.x = G.clamp(b.x - b.face * 100, w.x0, w.x1);
      return;
    }
    const want = 105;
    const sp = b.speed * Math.max(0.4, 1 - 0.15 * b.st.iceN);
    if (d > want + 20) { b.x += (dx / d) * sp * dt; b.y += (dy / d) * sp * 0.7 * dt; } else if (d < want - 30) { b.x -= (dx / d) * sp * 0.45 * dt; } // lùi chậm để người đánh gần còn đuổi kịp
    b.y += Math.sin(b.t * 1.7) * 18 * dt;
    b.x = G.clamp(b.x, w.x0, w.x1); b.y = G.clamp(b.y, w.y0, w.y1);
  }

  // ---------- trùm nhỏ ----------
  function thinkMini(b) {
    const w = W(), P = w.P, ph = b.phase;
    const d = Math.hypot(P.x - b.x, (P.y - b.y) * 1.5);
    const opts = ['slam', 'charge', 'burst'];
    if (adds() < 4) opts.push('summon');
    if (d < 44) opts.push('swipe', 'swipe');
    const a = choose(b, opts);
    G.sfx('warn');
    b.wind = 0.7;
    if (a === 'slam') {
      G.zoneCircle(P.x, P.y, 30, 0.8, b.dmg * 1.3, b.el);
      if (has(b, 'antiDodge')) later(b, 0.4, () => G.zoneCircle(G.clamp(P.x + P.ddx * 46, w.x0, w.x1), P.y, 26, 0.7, b.dmg, b.el));
      later(b, 1.1, () => {});
    } else if (a === 'charge') {
      const dir = P.x >= b.x ? 1 : -1, py = P.y;
      const x0 = dir > 0 ? b.x : b.x - 210;
      G.zoneRect(x0, py - 12, 210, 24, 0.8, b.dmg * 1.4, b.el, {
        onFire: () => { b.x = G.clamp(b.x + dir * 190, w.x0 + 10, w.x1 - 10); b.y = py; G.sfx('boom'); b.exposed = 1.6; },
      });
      later(b, 2.2, () => {});
    } else if (a === 'burst') {
      for (let i = 0; i < 3 + ph; i++) {
        const q = near(P.x, P.y, 70, 30);
        G.zoneCircle(q[0], q[1], 18, 0.9 + i * 0.12, b.dmg * 0.8, b.el, { then: 3 });
      }
      later(b, 1.3, () => {});
    } else if (a === 'summon') {
      for (let i = 0; i < 2; i++) G.spawnEnemy('swarm', b.x + G.rr(-20, 20), G.clamp(b.y + (i ? 24 : -24), w.y0, w.y1), { add: true });
      later(b, 0.6, () => {});
    } else {
      G.zoneCircle(b.x, b.y, 38, 0.6, b.dmg, b.el);
      later(b, 0.9, () => {});
    }
    b.cd = [1.6, 1.3, 1.0][ph];
  }
  function moveMini(b, dt) {
    const w = W(), P = w.P;
    b.moving = false;
    if (b.seq.length || b.st.stun > 0 || b.st.root > 0) return;
    const dx = P.x - b.x, dy = P.y - b.y, d = Math.hypot(dx, dy);
    b.face = dx >= 0 ? 1 : -1;
    if (d > 44) {
      const sp = b.speed * Math.max(0.4, 1 - 0.15 * b.st.iceN);
      b.x += (dx / d) * sp * dt; b.y += (dy / d) * sp * 0.75 * dt;
      b.moving = true;
    }
    b.y = G.clamp(b.y, w.y0, w.y1);
  }

  G.updateBoss = function (b, dt) {
    const w = W();
    b.t += dt;
    if (b.flash > 0) b.flash -= dt;
    if (b.exposed > 0) b.exposed -= dt;
    if (b.wind > 0) b.wind -= dt;
    if (b.tpCd > 0) b.tpCd -= dt;
    if (b.hopCd > 0) b.hopCd -= dt;
    G.tickStatus(b, dt);
    if (b.dead) return;
    const frac = b.hp / b.maxhp;
    const ph = frac > 0.6 ? 0 : frac > 0.3 ? 1 : 2;
    if (ph > b.phase) {
      b.phase = ph;
      if (b.kind === 'ngu') phaseNgu(b);
      if (b.kind === 'ho' && ph === 2) b.big = true;
      if (b.kind !== 'ngu') w.banner = { s: b.name + (ph === 1 ? ' nổi giận!' : ' hóa cuồng!'), col: '#ff6a5a', t: 2 };
      G.sfx('gong');
    }
    if (b.kind === 'ho') b.tails = Math.max(1, Math.ceil(9 * frac));
    if (b.kind === 'moc') {
      if (b.phase === 2 && b.x > 360) b.x -= 7 * dt;
      w.px1 = b.x - 26;
    }
    for (const s of b.seq) s.t -= dt;
    const due = b.seq.filter((s) => s.t <= 0);
    b.seq = b.seq.filter((s) => s.t > 0);
    for (const s of due) s.f();
    if (b.kind === 'ho') moveHo(b, dt);
    if (b.kind === 'mini') moveMini(b, dt);
    if (b.seq.length === 0 && b.st.stun <= 0 && b.st.frozen <= 0) {
      b.cd -= dt;
      if (b.cd <= 0) {
        if (b.kind === 'moc') thinkMoc(b);
        else if (b.kind === 'ngu') thinkNgu(b);
        else if (b.kind === 'ho') thinkHo(b);
        else thinkMini(b);
      }
    }
  };
})();

// ===== js/stage.js =====
// Một ải: chuỗi 7 đến 8 phòng, điều khiển, bảng thông tin trên màn hình và các bảng chọn trong ải.
(function () {
  const G = window.G, ui = G.ui;
  let S = null;
  G.getRun = () => S;

  G.giveWeapon = function (type, tier) {

  };
  G.addXp = function (key, xp) {

  };
  const PROP_OF = { fire: 'brazier', poison: 'mushroom', ice: 'crystal' };
  const ROOM_NAME = {
    fight: 'Đánh quái', elite: 'Đánh quái', chest: 'Rương báu', fountain: 'Suối hồi', choice: 'Chọn cửa', boss: 'Trùm',
    fight2: 'Đánh quái thêm', merchant: 'Thương nhân', challenge: 'Thử thách', curse: 'Lời nguyền',
  };
  const TUT = [
    'Kéo cần bên trái để di chuyển. Giữ nút Đánh để ra đòn, bấm Né để lăn tránh.',
    'Đánh vỡ chậu than để đốt quái. Kết liễu quái đang cháy thì kiếm nhận dấu ấn Lửa.',
    'Lại gần rương rồi bấm Đánh để mở. Bùa hệ phủ hệ đó lên vũ khí trong 60 giây.',
    'Thanh xanh là mana. Đủ 25 mana thì bấm Đặc biệt để tung đòn mạnh.',
    'Quái tinh anh mang hệ. Chạm ô vũ khí ở góc trên bên phải để đổi sang cung.',
    'Lại gần suối đỏ để hồi máu hoặc suối xanh để hồi mana rồi bấm Đánh, chỉ chọn được một. Dòng chữ phía trên cho biết trùm đã học gì từ bạn.',
    'Trùm kháng hệ bạn dùng nhiều nhất. Đánh vỡ vật mang hệ khắc chế ở gần nó để gây sát thương lớn.',
  ];

  G.startStage = function (r, i, diff) {
    const rooms = i < 2
      ? ['fight', 'fight', 'chest', 'fight', 'elite', 'fountain', 'boss']
      : ['fight', 'fight', 'chest', 'fight', 'choice', 'elite', 'fountain', 'boss'];
    S = {
      r, i, diff: diff ? 1 : 0, base: G.stageStats(r, i, diff), P: G.buildPlayer(), rooms, idx: -1,
      stats: { el: { fire: 0, poison: 0, ice: 0, none: 0 }, ranged: 0, melee: 0, dodges: 0 },
      loot: { kills: 0, charm: false, bossDown: false, finalEl: null }, got: [], curse: null, marksMult: 1, haste: 1,
      tut: r === 0 && i === 0 && !diff && !G.save.tut.done, mode: 'play', endT: 0, layers: null, usedPotion: false, marks: 0,
      fade: 0, W: null, near: null, sel: null, swapped: false, opts: null, result: null,

  };

  function bossSetup() {
    const reg = G.REGIONS[S.r];
    const big = S.i === 4;
    const first = S.r === 0 && !S.diff && big;
    const layers = G.computeLayers(S.stats, big ? (first ? 1 : 2) : 1, first ? 0.3 : 0.5);
    const scar = G.save.scars[reg.boss];
    if (S.diff && big && scar && !layers.some((l) => l.type === 'resist' && l.el === scar)) layers.push({ type: 'resist', el: scar, pct: 0.5, scar: true });
    return { layers, kind: big ? reg.boss : 'mini', name: big ? reg.bossName : reg.mini };
  }

  function buildWaves(type) {
    const waves = [];
    const count = type === 'fight2' ? 2 : S.i >= 3 ? 3 : 2;
    const roles = ['rusher', 'swarm', 'archer'];
    if (S.i >= 1 || S.r > 0) roles.push('shield');
    if (S.i >= 2 || S.r > 0) roles.push('nimble');
    const cost = { rusher: 1, swarm: 1.5, archer: 1, shield: 1.5, nimble: 1.2 };
    for (let k = 0; k < count; k++) {
      let pts = 3 + Math.min(1.5, S.i * 0.4) + S.r * 0.5 + (S.diff ? 1 : 0);
      const list = [];
      if (type === 'elite' && k === count - 1) { list.push('elite'); pts -= 2.5; }
      for (let guard = 0; guard < 30 && pts > 0.9; guard++) {
        const r = G.pick(roles);
        if (cost[r] > pts + 0.3) continue;
        if (r === 'swarm') list.push('swarm', 'swarm', 'swarm'); else list.push(r);
        pts -= cost[r];
      }
      waves.push(list);
    }
    return waves;
  }
  function spawnWave(list) {
    const W = S.W;
    const el = S.stats.el, tot = el.fire + el.poison + el.ice + el.none;
    const top = G.ELS.slice().sort((a, b) => el[b] - el[a])[0];
    list.forEach((role, j) => {
      const left = G.rnd() < 0.25 && W.P.x > 170;
      const e = G.spawnEnemy(role, left ? -12 - j * 9 : W.w + 12 + j * 9, G.rr(W.y0, W.y1), {});
      // Quái tinh anh cũng học: kháng nhẹ hệ bạn dùng nhiều nhất
      if (role === 'elite' && tot > 0 && el[top] / tot > 0.4) e.resist = top;
    });
  }
  function addEnv(n, el) {
    const W = S.W, reg = G.REGIONS[S.r];
    for (let k = 0; k < n; k++) {
      const e = el || (G.rnd() < 0.65 ? reg.el : G.pick(G.ELS));

  }

  function enterRoom(type) {
    const P = S.P;
    const bs = type === 'boss' ? bossSetup() : null;
    const W = G.newWorld(P, {
      w: !bs ? 480 : bs.kind === 'ngu' ? 560 : 640, base: S.base, region: S.r, stats: S.stats, marksMult: S.marksMult, haste: S.haste,
      hpFloor: S.tut && type !== 'boss', loot: S.loot, seed: S.r * 100 + S.i * 10 + S.idx + 1,
    });
    W.noPotion = S.curse === 'dry';
    W.type = type; W.cleared = false; W.waves = []; W.waveI = -1; W.waveT = 0.6;

    if (S.idx > 0 && P.roomHeal) P.hp = Math.min(P.maxhp, P.hp + P.maxhp * P.roomHeal);

    S.hint = S.tut ? TUT[Math.min(S.idx, TUT.length - 1)] : null;
    if (type === 'fight' || type === 'elite' || type === 'fight2' || type === 'challenge') {

      else if (S.tut && S.idx === 1) {

        W.props.push({ type: 'brazier', env: true, x: 250, y: mid - 8 }, { type: 'brazier', env: true, x: 340, y: mid + 18 });
      } else addEnv(1 + (G.rnd() < 0.5 ? 1 : 0));

    } else if (type === 'chest') {

    } else if (type === 'fountain') {

    } else if (type === 'choice') {

      const col = { fight2: '#6a2a22', merchant: '#6a5a22', challenge: '#22506a', curse: '#4a226a' };
      W.props.push({ type: 'door', x: 180, y: W.y0, act: 'door', choice: kinds[0], col: col[kinds[0]] });

    } else if (type === 'merchant') {
      W.props.push({ type: 'merchant', x: 250, y: mid - 6, act: 'merchant' });

    } else if (type === 'curse') {

    } else if (type === 'boss') {
      S.layers = bs.layers;
      const b = G.makeBoss(bs.kind, { name: bs.name, layers: bs.layers });

      const xmax = (W.px1 != null ? W.px1 : W.x1) - 40;
      W.props.push({ type: PROP_OF[el], env: true, x: xmax * 0.45, y: W.y0 + 14 }, { type: PROP_OF[el], env: true, x: xmax * 0.75, y: W.y1 - 10 });
      W.banner = { s: b.name + (bs.layers.length ? ': ' + bs.layers.map(G.layerText).join(' · ') : ' xuất hiện'), col: '#ff6a5a', t: 4 };
      G.sfx('gong');
    }
  }
  function nextRoom() {
    if (S.W) { S.marks += S.W.marksGained; if (S.W.usedPotion) S.usedPotion = true; }
    S.idx++;
    enterRoom(S.rooms[S.idx]);
  }
  function clearRoom() {
    const W = S.W;
    W.cleared = true;
    G.sfx('pick', 0.8);
    S.P.hp = Math.min(S.P.maxhp, S.P.hp + S.P.maxhp * 0.08);

      } else W.banner = { s: 'Hết giờ, không có thưởng', col: '#b8b0a0', t: 2.5 };

    }
  }

  function chestOptions() {
    const tier = S.challengeChest ? Math.min(2, (S.r >= 1 ? 1 : 0) + 1) : S.r >= 1 && G.rnd() < 0.6 ? 1 : G.rnd() < 0.15 ? 1 : 0;
    const type = G.pick(G.WKEYS);
    return [
      { kind: 'weapon', type, tier, label: G.WTYPES[type].name + ' ' + G.TIERS[tier].name, sub: 'Vũ khí mới, cất vào rương đồ' },
      { kind: 'ore', n: 5 + S.r * 3, label: (5 + S.r * 3) + ' quặng', sub: 'Dùng để mài vũ khí ở lò rèn' },
      { kind: 'charm', el: S.tut ? 'fire' : G.pick(G.ELS), label: '', sub: 'Phủ hệ lên cả hai vũ khí trong 60 giây' },
    ].map((o) => { if (o.kind === 'charm') o.label = 'Bùa ' + G.EL[o.el].name; return o; });
  }
  function interact(pr) {
    const W = S.W, P = S.P;
    if (pr.act === 'chest' && !pr.used) { S.opts = chestOptions(); S.mode = 'chest'; S.prop = pr; } else if (pr.act === 'fountain' && !pr.used) {
      if (pr.kind === 'hp') P.hp = Math.min(P.maxhp, P.hp + P.maxhp * 0.5); else P.mana = P.maxmana;
      for (const o of W.props) if (o.type === 'fountain') o.used = true;
      G.burst(pr.x, pr.y, pr.kind === 'hp' ? '#ff6a5a' : '#6ab0ff', 20, 80);
      G.sfx('evolve', 0.8);
    } else if (pr.act === 'stash') { S.mode = 'swap'; S.sel = null; } else if (pr.act === 'merchant') S.mode = 'merchant';
    else if (pr.act === 'altar' && !pr.used) { S.mode = 'curse'; S.prop = pr; } else if (pr.act === 'door') {
      S.rooms[S.idx] = pr.choice;
      enterRoom(pr.choice);
    }
  }
  function rebuildWeapons() {
    const P = S.P;
    const cur = P.weapons[P.cur];
    P.weapons = G.save.carry.map((id) => G.weaponById(id)).filter(Boolean);
    P.cur = Math.max(0, P.weapons.indexOf(cur));
  }

  function finish(win) {

    const R = { win, lines: [], stars: 0, up: 0 };

      // Sao thứ ba: đòn kết liễu phải mang hệ khắc chế; trùm không kháng hệ nào thì chỉ cần đòn kết liễu có hệ.
      const third = b.weak.length ? b.weak.includes(S.loot.finalEl) : !!S.loot.finalEl;
      R.stars = 1 + (S.usedPotion ? 0 : 1) + (third ? 1 : 0);
      R.starNote = [true, !S.usedPotion, third];
      const map = S.diff ? sv.stars2 : sv.stars;
      const key = S.r + '-' + S.i;

      if (big) { const ns = S.diff ? 4 : 3; sv.shards[S.r] += ns; R.lines.push('+' + ns + ' mảnh ' + reg.bossName); }
      if ((R.stars === 3 && prev < 3) || (!big && G.rnd() < 0.15)) { sv.stones++; R.lines.push('+1 đá tôi'); }
      let wdrop = null;
      if (big) wdrop = [G.pick(G.WKEYS), G.rnd() < 0.35 ? 2 : 1];
      else if (G.rnd() < 0.5) wdrop = [G.pick(G.WKEYS), S.r >= 1 ? (G.rnd() < 0.6 ? 1 : 0) : G.rnd() < 0.25 ? 1 : 0];
      if (wdrop) {
        const nw = G.giveWeapon(wdrop[0], wdrop[1]);
        R.lines.push(nw ? 'Nhặt được ' + G.wName(nw) : 'Rương đồ đầy, vũ khí rớt đổi thành vàng');
      }
      if (S.loot.charm) {
        const left = Object.keys(G.GEAR.charm).filter((k) => !sv.owned.charm.includes(k));
        if (left.length) { const c = G.pick(left); sv.owned.charm.push(c); R.lines.push('Nhặt được ' + G.GEAR.charm[c].name); }
      }
      if (big && !S.diff && !sv.heroes[reg.rescue].unlocked) {

        R.lines.push('Cứu được ' + G.HEROES[reg.rescue].name + '! Hero mới đã mở.');
      }
      if (big && S.loot.finalEl) sv.scars[reg.boss] = S.loot.finalEl;

    } else {

      const gold = S.loot.kills * 2;
      sv.gold += gold;
      R.lines.push('+' + xp + ' kinh nghiệm', '+' + gold + ' vàng');

    }
    if (S.marks > 0) R.lines.push('Vũ khí nhận ' + Math.round(S.marks) + ' dấu ấn');
    if (R.up) R.lines.push(G.HEROES[sv.hero].name + ' lên cấp ' + sv.heroes[sv.hero].lvl + '!');
    for (const g of S.got) R.lines.push('Trong ải: ' + g);

  G.finishStage = finish;
  G.gotoRoom = function (n) { S.idx = n - 1; nextRoom(); }; // dùng khi chạy thử

  // ---------- điều khiển ----------
  const BTN0 = { atk: [430, 220, 28], dodge: [380, 246, 18], special: [384, 196, 18], skill: [434, 166, 18] };
  // Có lề trống (màn hình dài hoặc đang cầm dọc) thì đẩy nút ra lề để không che trận đấu.
  function btnPos(name) { const b = BTN0[name]; return [b[0] + G.cx, b[1] + G.cy, b[2]]; }
  const BTN = BTN0;
  // Ô bình máu và nút tạm dừng: [x, y, rộng, cao]. Vùng chạm rộng hơn hình vẽ 4 đơn vị mỗi phía.
  const POT = [4, 23, 50, 21], PAU = [58, 23, 30, 21];
  const hitBox = (d, b) => G.inRect(d, b[0] - 4, b[1] - 3, b[2] + 8, b[3] + 7);
  function setMode(m) { S.mode = m; S.sel = null; }
  G.stageUi = { btnPos, POT, PAU }; // để bài kiểm tra biết nút nằm ở đâu
  function readInput() {
    const k = G.keys, kp = G.keyP;
    const inp = {
      mx: (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0),
      my: (k.ArrowDown || k.KeyS ? 1 : 0) - (k.ArrowUp || k.KeyW ? 1 : 0),
      atk: !!(k.KeyJ || k.KeyZ || k.Space), atkP: !!(kp.KeyJ || kp.KeyZ || kp.Space),
      dodgeP: !!(kp.KeyK || kp.KeyX || kp.ShiftLeft), specialP: !!(kp.KeyL || kp.KeyC), skillP: !!(kp.KeyI || kp.KeyV),
      swapP: !!(kp.KeyQ || kp.Tab), potionP: !!(kp.KeyE || kp.KeyH), pauseP: !!(kp.Escape || kp.KeyP),
    };
    for (const d of G.downs) {
      if (G.inRect(d, 368, 0, 112, 38)) { inp.swapP = true; d.role = 'ui'; continue; }
      if (hitBox(d, POT)) { inp.potionP = true; d.role = 'ui'; continue; }
      if (hitBox(d, PAU)) { inp.pauseP = true; d.role = 'ui'; continue; }
      // nút tròn: lấy nút gần ngón nhất, vùng chạm rộng hơn hình vẽ một chút
      let hit = null, best = 1e9;
      for (const name in BTN) {
        const b = btnPos(name), dd = Math.hypot(d.x - b[0], d.y - b[1]);
        if (dd <= b[2] + 6 && dd - b[2] < best) { best = dd - b[2]; hit = name; }
      }
      if (hit) {
        d.role = hit;
        if (hit === 'atk') inp.atkP = true;
        if (hit === 'dodge') inp.dodgeP = true;
        if (hit === 'special') inp.specialP = true;
        if (hit === 'skill') inp.skillP = true;
      } else if (d.x < 240 && d.y > 48 && ![...G.pointers.values()].some((p) => p.role === 'joy' && p !== d)) d.role = 'joy';
      else d.role = 'none'; // chạm vào chỗ trống: không làm gì, cũng không tính là bấm nút
    }
    for (const p of G.pointers.values()) {
      if (p.role === 'atk') inp.atk = true;
      if (p.role === 'joy') {
        let dx = (p.x - p.sx) / 24, dy = (p.y - p.sy) / 24;
        const l = Math.hypot(dx, dy);
        if (l > 1) { dx /= l; dy /= l; }
        if (l > 0.18) { inp.mx += dx; inp.my += dy; }
      }
    }
    return inp;
  }

  // ---------- cảnh ----------
  G.StageScene = {
    update(dt) {
      if (!S) return;
      if (S.fade > 0) S.fade -= dt;
      const W = S.W, P = S.P;
      if (S.mode !== 'play') {
        const kp = G.keyP;
        if (kp.Escape || (kp.KeyP && S.mode === 'paused')) {
          if (S.mode === 'result' || S.mode === 'dead') { S = null; G.setScene(G.Village); return; }
          setMode('play'); G.sfx('ui');
        }
        return;
      }
      const inp = G.botInput ? G.botInput(S) : readInput();
      if (inp.pauseP) { setMode('paused'); return; }
      S.roomT = (S.roomT || 0) + dt;
      // tương tác với đồ vật gần nhất
      S.near = null;
      let bd = 26;
      for (const pr of W.props) {
        if (!pr.act || pr.used) continue;
        const d = Math.hypot(pr.x - P.x, (pr.y - P.y) * 1.3);
        if (d < bd) { bd = d; S.near = pr; }
      }
      if (S.near && inp.atkP) { inp.atk = false; inp.atkP = false; interact(S.near); if (S.mode !== 'play' || S.W !== W) return; }
      else if (S.near) inp.atk = false;
      G.updateWorld(dt, inp);
      // đợt quái
      if (W.waves.length && !W.cleared) {
        if (W.ents.filter((e) => !e.add).length === 0) {
          W.waveT -= dt;
          if (W.waveT <= 0) {
            W.waveI++;
            W.waveT = 0.7;
            if (W.waveI < W.waves.length) spawnWave(W.waves[W.waveI]); else clearRoom();
          }
        }
      }
      if (S.challenge) S.challenge.t -= dt;
      if (W.type === 'boss' && S.loot.bossDown) { S.endT += dt; if (S.endT > 1.6) finish(true); return; }
      if (W.over === 'dead') { S.endT += dt; if (S.endT > 1.2) finish(false); return; }
      if (W.cleared && W.type !== 'boss' && P.x >= W.x1 - 2) nextRoom();
    },
    // Trang bị ẩn (chuyển ứng dụng, tắt màn hình): tự tạm dừng.
    hide() { if (S && S.mode === 'play') setMode('paused'); },
    draw() {
      if (!S) return;
      if (S.mode !== S.shownMode) {
        // Bảng vừa mở hoặc đóng: ngón đang giữ không được bấm nhầm vào nút mới hiện.
        S.shownMode = S.mode; S.modeT = G.time; G.stalePointers(); G.click = null;

      else if (S.mode === 'swap') panelSwap();
      else if (S.mode === 'merchant') panelMerchant();
      else if (S.mode === 'curse') panelCurse();
      else if (S.mode === 'paused') panelPause();
      else if (S.mode === 'result' || S.mode === 'dead') panelResult();
      if (S && S.fade > 0) ui.rect(0, 0, G.W, G.H, 'rgba(0,0,0,' + Math.min(1, S.fade / 0.35) + ')'); // S có thể vừa bị xoá khi bấm Về làng
    },
  };

  function markInfo(w) {
    if (!w.branch) {
      const top = G.ELS.slice().sort((a, b) => w.marks[b] - w.marks[a])[0];
      return { frac: w.marks[top] / G.MARKS[0], col: w.marks[top] > 0 ? G.EL[top].col : '#666', txt: w.marks[top] > 0 ? G.EL[top].name + ' ' + Math.floor(w.marks[top]) + '/' + G.MARKS[0] : 'Chưa có dấu ấn' };
    }
    const st = G.wStage(w), m = w.marks[w.branch];
    const cap = G.TIERS[w.tier].maxStage;
    if (st >= cap) return { frac: 1, col: G.EL[w.branch].col, txt: G.EL[w.branch].name + ' · ' + G.STAGE_NAMES[st] + ' (tối đa)' };
    return { frac: (m - (st ? G.MARKS[st - 1] : 0)) / (G.MARKS[st] - (st ? G.MARKS[st - 1] : 0)), col: G.EL[w.branch].col, txt: G.EL[w.branch].name + ' · ' + G.STAGE_NAMES[st] + ' ' + Math.floor(m) + '/' + G.MARKS[st] };
  }
  G.markInfo = markInfo;

  function drawHud() {
    const W = S.W, P = S.P, c = G.ux;
    // máu, mana
    ui.bar(6, 5, 112, 8, P.hp / P.maxhp, '#d8453a');
    ui.text(Math.ceil(P.hp) + '/' + P.maxhp, 62, 12, { size: 6.5, align: 'center', bold: true });
    ui.bar(6, 15, 112, 5, P.mana / P.maxmana, '#3f8be0');
    const canDrink = P.potions > 0 && !W.noPotion;
    ui.rect(POT[0], POT[1], POT[2], POT[3], canDrink ? 'rgba(160,40,30,0.85)' : 'rgba(40,36,32,0.8)', canDrink ? '#e2b36a' : '#6a5a4a');
    ui.text(W.noPotion ? 'Bình: cấm' : 'Bình máu ×' + P.potions, POT[0] + POT[2] / 2, POT[1] + 13.5, { size: 7, align: 'center', bold: true, color: canDrink ? '#fff3da' : '#a89c8c' });
    ui.rect(PAU[0], PAU[1], PAU[2], PAU[3], 'rgba(40,36,32,0.8)', '#e2b36a');
    ui.text('Dừng', PAU[0] + PAU[2] / 2, PAU[1] + 13.5, { size: 7, align: 'center', bold: true });
    let sx = 6;

// ===== js/village.js =====
// Làng: màn hình chính, bản đồ chọn ải, lò rèn, trang bị, hero và cây kỹ năng, hướng dẫn, cài đặt.
(function () {
  const G = window.G, ui = G.ui;
  const V = { tab: 'hub', sel: null, ftab: 'sharpen', node: null, page: 0, confirm: false, diff: 0, msg: null, msgT: 0 };

  function say(s) { V.msg = s; V.msgT = 2.5; }
  function canPay(c) {
    const sv = G.save;
    if (!c) return true;
    if (c.gold && sv.gold < c.gold) return false;
    if (c.ore && sv.ore < c.ore) return false;
    if (c.stones && sv.stones < c.stones) return false;
    if (c.mat) for (let i = 0; i < 3; i++) if (sv.mats[i] < (c.mat[i] || 0)) return false;
    if (c.shard) for (let i = 0; i < 3; i++) if (sv.shards[i] < (c.shard[i] || 0)) return false;
    return true;
  }
  function pay(c) {
    const sv = G.save;
    sv.gold -= c.gold || 0; sv.ore -= c.ore || 0; sv.stones -= c.stones || 0;
    if (c.mat) for (let i = 0; i < 3; i++) sv.mats[i] -= c.mat[i] || 0;
    if (c.shard) for (let i = 0; i < 3; i++) sv.shards[i] -= c.shard[i] || 0;
  }
  function costText(c) {
    const a = [];
    if (c.gold) a.push(c.gold + ' vàng');
    if (c.ore) a.push(c.ore + ' quặng');
    if (c.stones) a.push(c.stones + ' đá tôi');
    if (c.mat) c.mat.forEach((n, i) => { if (n) a.push(n + ' ' + G.REGIONS[i].mat.toLowerCase()); });
    if (c.shard) c.shard.forEach((n, i) => { if (n) a.push(n + ' mảnh ' + G.REGIONS[i].bossName); });
    return a.join(', ');
  }
  G.villageApi = { canPay, pay, V };

  function drawScene() {
    const c = G.wx, A = G.art, p = A.p;
    c.setTransform(1, 0, 0, 1, 0, 0);
    p(c, 0, 0, 480, 70, '#2b1d2e');
    p(c, 0, 70, 480, 50, '#5a2f3a');
    p(c, 0, 120, 480, 40, '#a8553a');
    A.ellipse(c, 420, 96, 18, 18, '#ffcf6a');
    for (let i = 0; i < 6; i++) p(c, i * 90 - 20, 130 - ((i * 37) % 22), 120, 40, '#3a2430');
    p(c, 0, 160, 480, 110, '#4a3a2a');
    for (let i = 0; i < 60; i++) p(c, (i * 83) % 480, 164 + ((i * 47) % 100), 3 + (i % 4), 1, i % 2 ? '#40322a' : '#57452f');
    const hut = (x, y, w) => {
      p(c, x, y - 34, w, 34, '#6b4a30');
      p(c, x - 6, y - 46, w + 12, 12, '#8a5a2a');
      p(c, x - 2, y - 52, w + 4, 6, '#a06a32');
      p(c, x + w / 2 - 5, y - 20, 10, 20, '#2a1c14');
    };
    hut(150, 176, 52); hut(382, 172, 60); hut(280, 168, 40);
    // lò rèn
    p(c, 228, 150, 34, 26, '#4a4444');
    p(c, 236, 158, 18, 12, Math.floor(G.time * 6) % 2 ? '#ff7a2a' : '#ffd23f');
    p(c, 240, 132, 8, 18, '#3a3434');
    if (V.tab === 'hub') {
      const sv = G.save;
      c.save();
      c.translate(232, 236);
      c.scale(3, 3);
      const w = G.weaponById(sv.carry[0]);
      A.hero(c, { x: 0, y: 0, face: 1, key: sv.hero, move: false, t: G.time, atk: -1, dodge: -1, weapon: w, helm: sv.helm, armor: sv.armor });
      c.restore();
    }
  }
  function topBar() {
    const sv = G.save;
    ui.rect(0, 0, 480, 22, 'rgba(14,10,10,0.88)');

    if (diff && Object.keys(G.save.stars).length < 15) return false;
    if (r === 0 && i === 0) return true;
    const pr = i === 0 ? r - 1 : r, pi = i === 0 ? 4 : i - 1;
    return !!map[pr + '-' + pi];
  }

  // ---------- trang bị ----------
  function cycle(slot) {
    const sv = G.save, own = sv.owned[slot];
    const list = [null].concat(own);
    sv[slot] = list[(list.indexOf(sv[slot]) + 1) % list.length];
    G.persist();
  }
